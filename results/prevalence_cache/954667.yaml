blueprint:
  name: Sonoff ORB Buttons Blueprint
  description: >
    Use all the 16 inputs from the SONOFF Orb (single, double, triple, long press
    on 4 buttons) to trigger custom actions.
  domain: automation
  input:
    orb_action_sensor:
      name: Sonoff ORB action sensor
      description: >
        Sensor that exposes the button actions (e.g. sensor.sonoff_orb_action).
      selector:
        entity:
          domain: sensor

    single_button_1_actions:
      name: Single press – button 1
      description: Actions to run when state is 'single_button_1'
      selector:
        action: {}

    single_button_2_actions:
      name: Single press – button 2
      description: Actions to run when state is 'single_button_2'
      selector:
        action: {}

    single_button_3_actions:
      name: Single press – button 3
      description: Actions to run when state is 'single_button_3'
      selector:
        action: {}

    single_button_4_actions:
      name: Single press – button 4
      description: Actions to run when state is 'single_button_4'
      selector:
        action: {}

    long_button_1_actions:
      name: Long press – button 1
      description: Actions to run when state is 'long_button_1'
      selector:
        action: {}

    long_button_2_actions:
      name: Long press – button 2
      description: Actions to run when state is 'long_button_2'
      selector:
        action: {}

    long_button_3_actions:
      name: Long press – button 3
      description: Actions to run when state is 'long_button_3'
      selector:
        action: {}

    long_button_4_actions:
      name: Long press – button 4
      description: Actions to run when state is 'long_button_4'
      selector:
        action: {}

    double_button_1_actions:
      name: Double press – button 1
      description: Actions to run when state is 'double_button_1'
      selector:
        action: {}

    double_button_2_actions:
      name: Double press – button 2
      description: Actions to run when state is 'double_button_2'
      selector:
        action: {}

    double_button_3_actions:
      name: Double press – button 3
      description: Actions to run when state is 'double_button_3'
      selector:
        action: {}

    double_button_4_actions:
      name: Double press – button 4
      description: Actions to run when state is 'double_button_4'
      selector:
        action: {}

    triple_button_1_actions:
      name: Triple press – button 1
      description: Actions to run when state is 'triple_button_1'
      selector:
        action: {}

    triple_button_2_actions:
      name: Triple press – button 2
      description: Actions to run when state is 'triple_button_2'
      selector:
        action: {}

    triple_button_3_actions:
      name: Triple press – button 3
      description: Actions to run when state is 'triple_button_3'
      selector:
        action: {}

    triple_button_4_actions:
      name: Triple press – button 4
      description: Actions to run when state is 'triple_button_4'
      selector:
        action: {}

trigger:
  - platform: state
    entity_id: !input orb_action_sensor

condition: []

action:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: single_button_1
        sequence: !input single_button_1_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: single_button_2
        sequence: !input single_button_2_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: single_button_3
        sequence: !input single_button_3_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: single_button_4
        sequence: !input single_button_4_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: long_button_1
        sequence: !input long_button_1_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: long_button_2
        sequence: !input long_button_2_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: long_button_3
        sequence: !input long_button_3_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: long_button_4
        sequence: !input long_button_4_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: double_button_1
        sequence: !input double_button_1_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: double_button_2
        sequence: !input double_button_2_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: double_button_3
        sequence: !input double_button_3_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: double_button_4
        sequence: !input double_button_4_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: triple_button_1
        sequence: !input triple_button_1_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: triple_button_2
        sequence: !input triple_button_2_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: triple_button_3
        sequence: !input triple_button_3_actions

      - conditions:
          - condition: state
            entity_id: !input orb_action_sensor
            state: triple_button_4
        sequence: !input triple_button_4_actions

mode: single
