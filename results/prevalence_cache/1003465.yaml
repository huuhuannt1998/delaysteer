# ═══════════════════════════════════════════════════════════════════════════════
# TRIGGERS
# ═══════════════════════════════════════════════════════════════════════════════

trigger:
  - platform: time_pattern
    seconds: /30
    id: "poll"

  - platform: state
    entity_id: !input mode_selector
    id: "mode_changed"

# ═══════════════════════════════════════════════════════════════════════════════
# ACTION
# ═══════════════════════════════════════════════════════════════════════════════
action:
  # ── Step 1: Runtime variables ───────────────────────────────────────────────
  # All automation variables (v_xxx) are already available via the variables: block above.
  # Here we compute dynamic runtime values.
  - variables:
      _mode: "{{ states(v_sel) }}"
      _now_m: "{{ now().hour * 60 + now().minute }}"
      _ds_m: "{{ (v_day_start[0:2] | int) * 60 + (v_day_start[3:5] | int) }}"
      _de_m: "{{ (v_day_end[0:2] | int) * 60 + (v_day_end[3:5] | int) }}"
      _ee_m: "{{ (v_eve_end[0:2] | int) * 60 + (v_eve_end[3:5] | int) }}"
      _is_day: "{{ _now_m >= _ds_m and _now_m < _de_m }}"
      _is_eve: "{{ _now_m >= _de_m and _now_m < _ee_m }}"
      _is_ngt: "{{ _now_m < _ds_m or _now_m >= _ee_m }}"
      # Window status (true = open)
      _z1_wopen: "{{ v_z1_win not in [none, ''] and states(v_z1_win) == 'on' }}"
      _z2_wopen: "{{ v_z2_win not in [none, ''] and states(v_z2_win) == 'on' }}"
      _z3_wopen: "{{ v_z3_win not in [none, ''] and states(v_z3_win) == 'on' }}"
      _z4_wopen: "{{ v_z4_win not in [none, ''] and states(v_z4_win) == 'on' }}"
      _z5_wopen: "{{ v_z5_win not in [none, ''] and states(v_z5_win) == 'on' }}"
      # Auto-regulation enabled (true if not configured or boolean = on)
      _z1_aok: "{{ v_z1_auto in [none, ''] or states(v_z1_auto) == 'on' }}"
      _z2_aok: "{{ v_z2_auto in [none, ''] or states(v_z2_auto) == 'on' }}"
      _z3_aok: "{{ v_z3_auto in [none, ''] or states(v_z3_auto) == 'on' }}"
      _z4_aok: "{{ v_z4_auto in [none, ''] or states(v_z4_auto) == 'on' }}"
      _z5_aok: "{{ v_z5_auto in [none, ''] or states(v_z5_auto) == 'on' }}"
      # External temperatures (none if sensor not configured)
      _z1_tmp: "{{ states(v_z1_ext) | float(none) if v_z1_ext not in [none, ''] else none }}"
      _z2_tmp: "{{ states(v_z2_ext) | float(none) if v_z2_ext not in [none, ''] else none }}"
      _z3_tmp: "{{ states(v_z3_ext) | float(none) if v_z3_ext not in [none, ''] else none }}"
      _z4_tmp: "{{ states(v_z4_ext) | float(none) if v_z4_ext not in [none, ''] else none }}"
      _z5_tmp: "{{ states(v_z5_ext) | float(none) if v_z5_ext not in [none, ''] else none }}"
      # Solar boost active?
      _boost: >
        {% if v_has_solar and v_solar_sen not in [none, ''] %}
          {% set surplus = states(v_solar_sen) | float(0) %}
          {% set ev_on = v_has_ev and v_ev_sen not in [none, '']
                         and states(v_ev_sen) | float(0) > 0 %}
          {{ surplus < -(v_solar_thr | float(1500)) and not ev_on }}
        {% else %}
          false
        {% endif %}

  # ── Step 2: Update main HVAC mode ───────────────────────────────────────────
  - choose:
      - conditions: "{{ _mode == v_m_heat }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ state_attr(v_main, 'hvac_mode') != 'heat' }}"
            then:
              - service: climate.set_hvac_mode
                target:
                  entity_id: "{{ v_main }}"
                data:
                  hvac_mode: heat
      - conditions: "{{ _mode == v_m_cool }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ state_attr(v_main, 'hvac_mode') != 'cool' }}"
            then:
              - service: climate.set_hvac_mode
                target:
                  entity_id: "{{ v_main }}"
                data:
                  hvac_mode: cool
      - conditions: "{{ _mode == v_m_dry }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ state_attr(v_main, 'hvac_mode') != 'dry' }}"
            then:
              - service: climate.set_hvac_mode
                target:
                  entity_id: "{{ v_main }}"
                data:
                  hvac_mode: dry
      - conditions: "{{ _mode == v_m_fan }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ state_attr(v_main, 'hvac_mode') != 'fan_only' }}"
            then:
              - service: climate.set_hvac_mode
                target:
                  entity_id: "{{ v_main }}"
                data:
                  hvac_mode: fan_only
      - conditions: "{{ _mode == v_m_away }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ state_attr(v_main, 'hvac_mode') != v_away_hvac }}"
            then:
              - service: climate.set_hvac_mode
                target:
                  entity_id: "{{ v_main }}"
                data:
                  hvac_mode: "{{ v_away_hvac }}"
      - conditions: "{{ _mode == v_m_off }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ state_attr(v_main, 'hvac_mode') != 'off' }}"
            then:
              - service: climate.set_hvac_mode
                target:
                  entity_id: "{{ v_main }}"
                data:
                  hvac_mode: off

  # ── Step 3: Zone management by mode ─────────────────────────────────────────
  - choose:

      # ══════════════════════════════════════════════════════
      # HEATING MODE — ALL ZONES
      # ══════════════════════════════════════════════════════
      - conditions: "{{ _mode == v_m_heat }}"
        sequence:

          # Zone 1 – Heating
          - if:
              - condition: template
                value_template: "{{ v_z1_en }}"
            then:
              - choose:
                  # Window open → stop
                  - conditions: "{{ _z1_wopen }}"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(v_z1_clim) != 'off' }}"
                        then:
                          - service: climate.set_hvac_mode
                            target:
                              entity_id: "{{ v_z1_clim }}"
                            data:
                              hvac_mode: off
                  # Regulation suspended → skip
                  - conditions: "{{ not _z1_aok }}"
                    sequence: []
                  # External thermometer → hysteresis
                  - conditions: "{{ v_z1_ext not in [none, ''] }}"
                    sequence:
                      - variables:
                          _tgt: "{{ v_z1_hd if _is_day else (v_z1_he if _is_eve else v_z1_hn) }}"
                          _hs: "{{ v_z1_hhds if _is_day else v_z1_hhns }}"
                          _hp: "{{ v_z1_hhdp if _is_day else v_z1_hhnp }}"
                      # Too warm → stop heating
                      - if:
                          - condition: template
                            value_template: >
                              {{ _z1_tmp is not none and _z1_tmp >= _hp
                                 and states(v_z1_clim) == 'heat' }}
                        then:
                          - service: climate.set_hvac_mode
                            target:
                              entity_id: "{{ v_z1_clim }}"
                            data:
                              hvac_mode: off
                      # Too cold → start heating
                      - if:
                          - condition: template
                            value_template: >
                              {{ _z1_tmp is not none and _z1_tmp < _hs
                                 and states(v_z1_clim) in ['off', 'idle'] }}
                        then:
                          - service: climate.set_hvac_mode
                            target:
                              entity_id: "{{ v_z1_clim }}"
                            data:
                              hvac_mode: heat
                          - if:
                              - condition: template
                                value_template: >
                                  {{ state_attr(v_z1_clim, 'temperature') | float(0) != _tgt | float }}
                            then:
                              - service: climate.set_temperature
                                target:
                                  entity_id: "{{ v_z1_clim }}"
                                data:
                                  temperature: "{{ _tgt }}"
                # Simple mode → time-slot setpoint
                default:
                  - variables:
                      _tgt: "{{ v_z1_hd if _is_day else (v_z1_he if _is_eve else v_z1_hn) }}"
                  - if:
                      - condition: template
                        value_template: >
                          {{ state_attr(v_z1_clim, 'temperature') | float(0) != _tgt | float }}
                    then:
                      - service: climate.set_temperature
                        target:
                          entity_id: "{{ v_z1_clim }}"
                        data:
                          temperature: "{{ _tgt }}"

          # Zone 2 – Heating
          - if:
              - condition: template
                value_template: "{{ v_z2_en and v_z2_clim not in [none, ''] }}"
            then:
              - choose:
                  - conditions: "{{ _z2_wopen }}"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(v_z2_clim) != 'off' }}"
                        then:
                          - service: climate.set_hvac_mode
                            target:
                              entity_id: "{{ v_z2_clim }}"
                            data:
                              hvac_mode: off
                  - conditions: "{{ not _z2_aok }}"
                    sequence: []
                  - conditions: "{{ v_z2_ext not in [none, ''] }}"
                    sequence:
                      - variables:
                          _tgt: "{{ v_z2_hd if _is_day else (v_z2_he if _is_eve else v_z2_hn) }}"
                          _hs: "{{ v_z2_hhds if _is_day else v_z2_hhns }}"
                          _hp: "{{ v_z2_hhdp if _is_day else v_z2_hhnp }}"
                      - if:
                          - condition: template
                            value_template: >
                              {{ _z2_tmp is not none and _z2_tmp >= _hp
                                 and states(v_z2_clim) == 'heat' }}
                        then:
                          - service: climate.set_hvac_mode
                            target:
                              entity_id: "{{ v_z2_clim }}"
                            data:
                              hvac_mode: off
                      - if:
                          - condition: template
                            value_template: >
                              {{ _z2_tmp is not none and _z2_tmp < _hs
                                 and states(v_z2_clim) in ['off', 'idle'] }}
                        then:
                          - service: climate.set_hvac_mode
                            target:
                              entity_id: "{{ v_z2_clim }}"
                            data:
                              hvac_mode: heat
                          - if:
                              - condition: template
                                value_template: >
                                  {{ state_attr(v_z2_clim, 'temperature') | float(0) != _tgt | float }}
                            then:
                              - service: climate.set_temperature
                                target:
                                  entity_id: "{{ v_z2_clim }}"
                                data:
                                  temperature: "{{ _tgt }}"
                default:
                  - variables:
                      _tgt: "{{ v_z2_hd if _is_day else (v_z2_he if _is_eve else v_z2_hn) }}"
                  - if:
                      - condition: template
                        value_template: >
