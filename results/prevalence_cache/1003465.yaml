          default: 18.5
          selector:
            number:
              min: 10
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        zone1_cool_day:
          name: "Zone 1 — ❄️ Cooling Day (°C)"
          default: 25
          selector:
            number:
              min: 16
              max: 32
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        zone1_cool_evening:
          name: "Zone 1 — ❄️ Cooling Evening (°C)"
          default: 26
          selector:
