blueprint:
  name: "🌡️ Airzone Climate Manager"
  description: >
    Intelligent Airzone HVAC management with 6 modes (Heating, Cooling, Dehumidification,
    Fan Only, Away, Off). Supports up to 5 zones with configurable time slots (Day/Evening/Night),
    hysteresis regulation per zone (optional external thermometer), automatic stop when window
    is open, solar PV boost, and EV charger awareness.

    ⚙️ PREREQUISITE: Create an input_select whose states match the mode values configured
    below. Defaults: "🔥 Heating", "❄️ Cooling", "🌵 Dehumidification",
    "💨 Fan Only", "Away", "Off", "Free" (or any custom names you set below).

    ⏱️ Update cycle: every 30 seconds + immediately on mode change.

    ☀️ Solar boost: in Cooling mode, lowers setpoints when PV surplus is detected
    and EV is not charging.

    ⚡ Regulation: if an external thermometer is configured for a zone → hysteresis
    control (start/stop). Otherwise → simple setpoint sent to Airzone.
  domain: automation
  author: "Airzone Blueprint"
  homeassistant:
    min_version: "2024.6.0"

  input:

    # ═══════════════════════════════════════════════════════
    # SECTION 1 — GLOBAL CONFIGURATION
    # ═══════════════════════════════════════════════════════
    section_global:
      name: "⚙️ Global Configuration"
      input:
        airzone_main:
          name: "Main Airzone entity (whole house)"
          description: "Primary climate entity controlling the global HVAC mode (e.g. climate.main)"
          selector:
            entity:
              domain: climate

        mode_selector:
          name: "Thermal mode selector"
          description: "input_select containing the operating modes"
          selector:
            entity:
              domain: input_select

    # ═══════════════════════════════════════════════════════
    # SECTION 2 — MODE NAMES (as defined in your input_select)
    # ═══════════════════════════════════════════════════════
    section_modes:
      name: "🏷️ Mode Names"
      description: "Enter the exact state values present in your input_select"
      collapsed: true
      input:
        mode_value_heat:
          name: "Value = Heating"
          default: "🔥 Heating"
          selector:
            text: {}

        mode_value_cool:
          name: "Value = Cooling"
          default: "❄️ Cooling"
          selector:
            text: {}

        mode_value_dry:
          name: "Value = Dehumidification"
          default: "🌵 Dehumidification"
          selector:
            text: {}

        mode_value_fan:
          name: "Value = Fan Only"
          default: "💨 Fan Only"
          selector:
            text: {}

        mode_value_away:
          name: "Value = Away"
          default: "Away"
          selector:
            text: {}

        mode_value_off:
          name: "Value = Off"
          default: "Off"
          selector:
            text: {}

    # ═══════════════════════════════════════════════════════
    # SECTION 3 — TIME SLOTS
    # ═══════════════════════════════════════════════════════
    section_horaires:
      name: "🕐 Time Slots"
      input:
        day_start:
          name: "Day slot start"
          description: "e.g. 05:30 — start of the Day period"
          default: "05:30:00"
          selector:
            time: {}

        day_end:
          name: "Day slot end / Evening start"
          description: "e.g. 21:00 — start of the Evening period"
          default: "21:00:00"
          selector:
            time: {}

        evening_end:
          name: "Evening slot end / Night start"
          description: "e.g. 23:00 — after this time: Night period (until Day start)"
          default: "23:00:00"
          selector:
            time: {}

    # ═══════════════════════════════════════════════════════
    # SECTION 4 — AWAY MODE
    # ═══════════════════════════════════════════════════════
    section_away:
      name: "🏃 Away Mode"
      input:
        away_hvac_mode:
          name: "HVAC mode while Away"
          default: "heat"
          selector:
            select:
              options:
                - label: "🔥 Heating (frost protection)"
                  value: "heat"
                - label: "❄️ Cooling"
                  value: "cool"
                - label: "⛔ Full stop"
                  value: "off"

        away_temperature:
          name: "Away mode setpoint (°C)"
          default: 18
          selector:
            number:
              min: 10
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

    # ═══════════════════════════════════════════════════════
    # SECTION 5 — SOLAR PANELS (optional)
    # ═══════════════════════════════════════════════════════
    section_solar:
      name: "☀️ Solar PV Boost (optional)"
      collapsed: true
      input:
        has_solar:
          name: "Enable solar boost"
          description: "Lowers cooling setpoints when PV surplus is detected"
          default: false
          selector:
            boolean: {}

        solar_power_sensor:
          name: "Grid power sensor"
          description: "NEGATIVE value = power injected to grid (e.g. sensor.shelly_channel_1_power)"
          default:
          selector:
            entity:
              domain: sensor
              device_class: power

        solar_threshold:
          name: "Surplus threshold to trigger boost (W)"
          description: "Boost activates when injected surplus exceeds this value"
          default: 1500
          selector:
            number:
              min: 200
              max: 10000
              step: 100
              unit_of_measurement: "W"
              mode: box

        solar_boost_offset:
          name: "Setpoint offset during boost (°C)"
          description: "This value is subtracted from the cooling setpoint during boost"
          default: 2
          selector:
            number:
              min: 0.5
              max: 5
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

    # ═══════════════════════════════════════════════════════
    # SECTION 6 — EV CHARGER (optional)
    # ═══════════════════════════════════════════════════════
    section_ev:
      name: "🔌 EV Charger (optional)"
      collapsed: true
      input:
        has_ev_charger:
          name: "I have an EV charger"
          description: "Solar boost is disabled while the EV is charging"
          default: false
          selector:
            boolean: {}

        ev_power_sensor:
          name: "EV charging power sensor"
          description: "If value > 0 W: EV is charging → solar boost disabled"
          default:
          selector:
            entity:
              domain: sensor
              device_class: power

    # ═══════════════════════════════════════════════════════
    # ZONE 1 (required)
    # ═══════════════════════════════════════════════════════
    section_zone1:
      name: "🏠 Zone 1"
      input:
        zone1_enabled:
          name: "Zone 1 enabled"
          default: true
          selector:
            boolean: {}

        zone1_climate:
          name: "Zone 1 climate entity"
          description: "e.g. climate.office"
          selector:
            entity:
              domain: climate

        zone1_window:
          name: "Zone 1 window sensor (optional)"
          description: "binary_sensor — if 'on' (open) → zone is turned Off"
          default:
          selector:
            entity:
              domain: binary_sensor
              device_class: opening

        zone1_auto_boolean:
          name: "Zone 1 auto-regulation helper (optional)"
          description: "input_boolean — if Off, zone regulation is suspended"
          default:
          selector:
            entity:
              domain: input_boolean

        zone1_external_sensor:
          name: "Zone 1 external thermometer (optional)"
          description: "If set → hysteresis regulation. Otherwise → simple setpoint."
          default:
          selector:
            entity:
              domain: sensor
              device_class: temperature

        zone1_heat_day:
          name: "Zone 1 — 🔥 Heating Day (°C)"
          default: 20
          selector:
            number:
              min: 10
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        zone1_heat_evening:
          name: "Zone 1 — 🔥 Heating Evening (°C)"
          default: 19
          selector:
            number:
              min: 10
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

