              unit_of_measurement: "°C"
              mode: box

        zone4_cool_hyst_day_stop:
          name: "Zone 4 — Cool hysteresis Day: stop below (°C)"
          default: 25.5
          selector:
            number:
              min: 16
              max: 32
              step: 0.1
              unit_of_measurement: "°C"
              mode: box

        zone4_cool_hyst_night_start:
          name: "Zone 4 — Cool hysteresis Night: start above (°C)"
          default: 24.5
          selector:
            number:
              min: 16
              max: 32
              step: 0.1
              unit_of_measurement: "°C"
              mode: box

        zone4_cool_hyst_night_stop:
          name: "Zone 4 — Cool hysteresis Night: stop below (°C)"
          default: 23.5
          selector:
            number:
              min: 16
              max: 32
              step: 0.1
              unit_of_measurement: "°C"
              mode: box

    # ═══════════════════════════════════════════════════════
    # ZONE 5
    # ═══════════════════════════════════════════════════════
    section_zone5:
      name: "🏠 Zone 5 (optional)"
      collapsed: true
      input:
        zone5_enabled:
          name: "Zone 5 enabled"
          default: false
          selector:
            boolean: {}

        zone5_climate:
          name: "Zone 5 climate entity"
          default:
          selector:
            entity:
              domain: climate

        zone5_window:
