            {% if states(e) in ['on', 'open', 'true'] %}{% set ns.open = true %}{% endif %}
          {% endfor %}
          {{ ns.open }}
        {% else %}
          false
        {% endif %}
      window_door_open_seconds: >-
        {% if any_window_open | bool %}
          {% set ns = namespace(earliest=0) %}
          {% for e in window_door_entities %}
            {% set s = states[e] %}
            {% if s is not none and s.state in ['on', 'open', 'true'] %}
              {% set ts = as_timestamp(s.last_changed) | float(0) %}
              {% if ts > 0 and (ns.earliest == 0 or ts < ns.earliest) %}{% set ns.earliest = ts %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ (as_timestamp(now()) - ns.earliest) | int(0) if ns.earliest > 0 else 0 }}
        {% else %}
          0
        {% endif %}
      # Open duration vs the two stage delays. Stage 2 (delay 0 = disabled) is
      # tested first so the longer threshold wins once both are exceeded.
