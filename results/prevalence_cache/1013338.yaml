triggers:
  - trigger: homeassistant
    event: start
    id: homeassistant_start
  - trigger: time_pattern
    minutes: "/1"
    id: periodic_check
  - trigger: state
    entity_id: !input winter_mode_sensor
    id: season_changed
  - trigger: state
    entity_id: !input occupancy_entities
    id: occupancy_changed
  - trigger: state
    entity_id: !input climate_entity
    id: climate_changed

conditions: []

actions:
  # ── UNAVAILABLE-DEVICE GUARD ──────────────────────────────────────────────────
  # If the climate entity is offline (IR blaster down, wifi dropped) bail out
  # cleanly rather than computing on stale data or firing commands that fail.
  - if:
      - condition: template
        value_template: "{{ states(climate_entity) in ['unavailable', 'unknown'] }}"
    then:
      - stop: Climate entity unavailable — skipping run.
  - variables:
      trigger_id: "{{ trigger.id if trigger is defined else 'manual_run' }}"
      season_is_winter: "{{ is_state(winter_mode_sensor, 'on') }}"
      season_is_summer: "{{ is_state(winter_mode_sensor, 'off') }}"

  # ── BOOST AUTO-SHUTOFF ────────────────────────────────────────────────────────
  # Without entity triggers, boost duration is tracked via the helper's own
  # last_changed timestamp. The periodic check evaluates this every minute.
  # Auto-shutoff fires within one minute of the configured duration elapsing.
  - choose:
      - alias: Turn winter boost off after its duration
        conditions:
          - condition: template
            value_template: >-
              {{ boost_feature_enabled | bool
                 and boost_switch != ''
                 and is_state(boost_switch, 'on')
                 and season_is_winter | bool
                 and (as_timestamp(now()) - as_timestamp(states[boost_switch].last_changed)) | int(0)
                    >= ((winter_boost_minutes | int(60)) * 60) }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ boost_switch }}"
          - stop: Winter boost duration finished.
      - alias: Turn summer boost off after its duration
        conditions:
          - condition: template
            value_template: >-
              {{ boost_feature_enabled | bool
                 and boost_switch != ''
                 and is_state(boost_switch, 'on')
                 and season_is_summer | bool
                 and (as_timestamp(now()) - as_timestamp(states[boost_switch].last_changed)) | int(0)
                    >= ((summer_boost_minutes | int(60)) * 60) }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ boost_switch }}"
          - stop: Summer boost duration finished.

  # ── FORECAST FETCH (optional) ─────────────────────────────────────────────
  # Pull an hourly forecast only when the forecast-trend feature is on and a
  # weather entity is configured. continue_on_error keeps the automation
  # resilient if the weather integration can't return a forecast right now.
  - if:
      - condition: template
        value_template: >-
          {{ forecast_feature_enabled | bool and weather_forecast_entity != '' }}
    then:
      - action: weather.get_forecasts
        continue_on_error: true
        data:
          type: hourly
        target:
          entity_id: !input weather_forecast_entity
        response_variable: forecast_response

  - variables:
      now_time: "{{ now().strftime('%H:%M:%S') }}"
      season_is_winter: "{{ is_state(winter_mode_sensor, 'on') }}"
      season_is_summer: "{{ is_state(winter_mode_sensor, 'off') }}"
      # ── DEVICE CAPABILITIES ───────────────────────────────────────────────────
      # Gates every HVAC command — never attempt a mode the device doesn't have.
      supports_heat: "{{ 'heat' in supported_hvac_modes }}"
      supports_cool: "{{ 'cool' in supported_hvac_modes }}"
      supports_dry: "{{ 'dry' in supported_hvac_modes }}"
      guest_mode_is_on: "{{ guest_mode_switch != '' and is_state(guest_mode_switch, 'on') }}"
      occupied_by_entity: >-
        {% set ns = namespace(occupied=false) %}
        {% for entity_id in occupancy_entities %}
          {% set state = states(entity_id) %}
          {% if state in ['home', 'on', 'occupied', 'present', 'detected'] or (state | float(0)) > 0 %}
            {% set ns.occupied = true %}
          {% endif %}
        {% endfor %}
        {{ ns.occupied }}
      # PRESENCE OPTIONAL: when no occupancy entities and no guest-mode helper are
      # configured, the home is treated as always occupied — so a bare schedule +
      # thermal demand runs with no presence gating. Configure occupancy to make
      # heating wait until presence is detected (and to enable the away action).
      presence_configured: "{{ occupancy_entities | count > 0 or guest_mode_switch != '' }}"
      house_is_occupied: >-
        {% if not (presence_configured | bool) %}
          true
        {% else %}
          {{ guest_mode_is_on | bool or occupied_by_entity | bool }}
        {% endif %}
      # ROOM-LEVEL OCCUPANCY: when room presence entities are configured, gates
      # comfort on whether THIS room is occupied (someone may be home but in
      # another room), purely from the room sensors — guest mode is a whole-home
      # signal and does NOT force an individual room occupied. With none set, or
      # if all room sensors are unavailable, it falls back to whole-home
      # occupancy. House occupancy still drives the away context and dry's
      # "run when empty" gate.
      room_is_occupied: >-
        {% if room_presence_entities | count > 0 %}
          {% set ns = namespace(present=false, available=false) %}
          {% for entity_id in room_presence_entities %}
            {% set state = states(entity_id) %}
            {% if state not in ['unknown', 'unavailable', 'none', ''] %}
              {% set ns.available = true %}
              {% if state in ['home', 'on', 'occupied', 'present', 'detected'] or (state | float(0)) > 0 %}
                {% set ns.present = true %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if not ns.available %}
            {{ house_is_occupied | bool }}
          {% else %}
            {{ ns.present }}
          {% endif %}
        {% else %}
          {{ house_is_occupied | bool }}
        {% endif %}
      # Seconds the room has been continuously empty — the staged vacancy
      # response escalates against this. Time since the most recent room-sensor
      # change while the room is empty; 0 when occupied or no sensors configured.
      room_vacant_seconds: >-
        {% if room_presence_entities | count > 0 and not (room_is_occupied | bool) %}
          {% set ns = namespace(latest=0) %}
          {% for entity_id in room_presence_entities %}
            {% set s = states[entity_id] %}
            {% if s is not none %}
              {% set ts = as_timestamp(s.last_changed) | float(0) %}
              {% if ts > ns.latest %}{% set ns.latest = ts %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ (as_timestamp(now()) - ns.latest) | int(0) if ns.latest > 0 else 999999 }}
        {% else %}
          0
        {% endif %}
      boost_is_active: >-
        {{ boost_feature_enabled | bool
           and boost_switch != ''
           and is_state(boost_switch, 'on') }}
      # ── COMFORT PERIODS (the schedule) ────────────────────────────────────────
      # Each period is the schedule itself: when it is enabled for the active
      # season, the current time is inside its window, and today is a selected
      # day, it sets the comfort target. period_N_ago = minutes since the period
      # began (smaller = started more recently); 99999 means the period is not
      # active right now. comfort_target picks the active period that started
      # most recently, so overlaps resolve deterministically. -999 = no period
      # active (device falls back to the out-of-comfort action).
      period_1_ago: >-
        {% set now_min = now().hour * 60 + now().minute %}
        {% set s = period_1_start %}
        {% set e = period_1_end %}
        {% set start_min = (s[0:2] | int) * 60 + (s[3:5] | int) %}
        {% set end_min = (e[0:2] | int) * 60 + (e[3:5] | int) %}
        {% set in_win = (start_min <= end_min and now_min >= start_min and now_min < end_min)
                        or (start_min > end_min and (now_min >= start_min or now_min < end_min)) %}
        {% set days_map = ['mon','tue','wed','thu','fri','sat','sun'] %}
        {% set wd = now().weekday() %}
        {% set wrapped = start_min > end_min %}
        {% set ref_day = days_map[(wd - 1) % 7] if (wrapped and now_min < end_min) else days_map[wd] %}
        {% set day_ok = ref_day in period_1_days %}
        {% set season_on = (season_is_winter | bool and period_1_winter_enabled | bool)
                           or (season_is_summer | bool and period_1_summer_enabled | bool) %}
        {% if in_win and day_ok and season_on %}
          {{ (now_min - start_min) % 1440 }}
        {% else %}
          99999
        {% endif %}
      period_2_ago: >-
        {% set now_min = now().hour * 60 + now().minute %}
        {% set s = period_2_start %}
        {% set e = period_2_end %}
        {% set start_min = (s[0:2] | int) * 60 + (s[3:5] | int) %}
        {% set end_min = (e[0:2] | int) * 60 + (e[3:5] | int) %}
        {% set in_win = (start_min <= end_min and now_min >= start_min and now_min < end_min)
                        or (start_min > end_min and (now_min >= start_min or now_min < end_min)) %}
        {% set days_map = ['mon','tue','wed','thu','fri','sat','sun'] %}
        {% set wd = now().weekday() %}
        {% set wrapped = start_min > end_min %}
        {% set ref_day = days_map[(wd - 1) % 7] if (wrapped and now_min < end_min) else days_map[wd] %}
        {% set day_ok = ref_day in period_2_days %}
        {% set season_on = (season_is_winter | bool and period_2_winter_enabled | bool)
                           or (season_is_summer | bool and period_2_summer_enabled | bool) %}
        {% if in_win and day_ok and season_on %}
          {{ (now_min - start_min) % 1440 }}
        {% else %}
          99999
        {% endif %}
      period_3_ago: >-
        {% set now_min = now().hour * 60 + now().minute %}
        {% set s = period_3_start %}
        {% set e = period_3_end %}
        {% set start_min = (s[0:2] | int) * 60 + (s[3:5] | int) %}
        {% set end_min = (e[0:2] | int) * 60 + (e[3:5] | int) %}
