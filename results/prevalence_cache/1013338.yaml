blueprint:
  name: Climate Seasonal Comfort Controller (°F / Imperial)
  author: Quatermelon
  description: >
    Controls a climate entity using a winter-mode helper, occupancy and guest mode,
    a built-in comfort schedule (time periods that set the target and act as the
    permission gate), a room-and-outdoor thermal demand filter with optional
    forecast trend, timed boost, compressor minimum run/off protection, and
    condensation-aware dry sweeps.
    Imperial (°F) variant — all temperatures, offsets, and thresholds are in Fahrenheit.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    climate_section:
      name: Climate Device
      icon: mdi:heat-pump
      collapsed: true
      description: >
        The climate entity this automation controls and the HVAC modes it supports.
        This blueprint works with heat pumps (heat / cool / dry), AC units
        (heat / cool), heating-only devices, and cooling-only devices.
        Select only the modes your device actually supports — the automation
        will never attempt to use an unselected mode.
      input:
        climate_entity:
          name: Climate entity
          description: The climate entity to control.
          selector:
            entity:
              filter:
                domain: climate
        supported_hvac_modes:
          name: Supported HVAC modes
          description: >
            Select every mode your device supports. Heat-only device? Select
            Heat only. No dry/dehumidify mode? Leave Dry unticked — dry mode
            will be disabled automatically regardless of the dry mode settings.
          default:
            - heat
            - cool
            - dry
          selector:
            select:
              multiple: true
              options:
                - label: Heat
                  value: heat
                - label: Cool
                  value: cool
                - label: "Dry (dehumidify)"
                  value: dry
        minimum_run_minutes:
          name: Minimum run time
          description: Minimum minutes before heat or cool can turn off.
          default: 10
          selector:
            number:
              min: 0
              max: 120
              step: 1
              mode: box
              unit_of_measurement: min
        minimum_off_minutes:
          name: Minimum off time
          description: >
            Minimum minutes the unit must stay off before it can restart.
            Prevents short-cycling. Set to 0 to disable.
          default: 15
          selector:
            number:
              min: 0
              max: 120
              step: 1
              mode: box
              unit_of_measurement: min
        manual_takeover_minutes:
          name: Manual takeover duration
          description: >
            When the device is changed outside the automation — in Home
            Assistant, or on the unit's own remote/app if it reports its state
            back to HA — the automation pauses for this many minutes before
            resuming control. Set to 0 to disable manual takeover entirely.
          default: 60
          selector:
            number:
              min: 0
              max: 480
              step: 5
              mode: box
              unit_of_measurement: min
        manual_takeover_helper:
          name: Manual control helper (optional)
          description: >
            Optional input_boolean helper for the most reliable manual takeover
            detection. Whenever the device changes, the automation compares the
            new mode and setpoint against what it intended; if they differ,
            someone changed it, so it raises this flag and leaves the device
            alone for the takeover duration before resuming control. The flag
            clears itself when the duration elapses, you can switch it on from a
            dashboard to pause the automation on demand, and it persists across
            Home Assistant restarts. Leave it empty and the automation still
            respects manual changes with a lighter check, though that one may
            briefly pause right after a restart. Set the takeover duration to 0
            to disable manual takeover entirely.
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean
        status_helper:
          name: Status text helper (optional)
          description: >
            Optional input_text helper. When set, the automation writes a short
            one-line summary of its current decision to it on every run — the
            mode and target, which period (or boost/setback) is driving it, and
            whether the room is occupied or a manual hold is active. Handy on a
            dashboard so you can see what the controller is doing at a glance
            without opening a trace. Purely informational; leave empty to skip.
          default: ""
          selector:
            entity:
              filter:
                domain: input_text
        room_temperature_sensor:
          name: Room temperature sensor (optional)
          description: >
            Alternative temperature sensor for the room this device controls.
            When provided, this sensor is used instead of the climate entity's
            own built-in sensor for all thermal demand and comfort calculations.
            Leave empty to use the climate entity's reported temperature.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
        outdoor_temp_source:
          name: Outdoor temperature source
          description: >
            The source used as the outdoor temperature signal. Accepts either:
              • A temperature sensor entity (e.g. a weather station or
                integration sensor) — state is read directly as °F.
              • A weather entity (e.g. weather.home) — the current temperature
                attribute is used.
            Used for two purposes: the outdoor stability signal in the thermal
            demand filter (active regardless of dry mode), and as the window
            surface temperature proxy in the condensation dew-point calculation
            when dry mode is enabled.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
                - domain: weather

    season_section:
      name: Season Mode
      icon: mdi:sun-snowflake
      collapsed: true
      description: Select the helper that stores winter or summer mode.
      input:
        winter_mode_sensor:
          name: Winter mode helper
          description: Binary threshold helper. On means winter; off means summer.
          selector:
            entity:
              filter:
                domain: binary_sensor

    presence_section:
      name: Presence & Out-of-Comfort (optional)
      icon: mdi:home-account
      collapsed: true
      description: >
        Optional. With occupancy configured, comfort only runs while someone is
        home — heating starts once presence is detected — and this section sets
        what happens otherwise (no period scheduled, or away): turn off, or hold
        a setback temperature. Leave occupancy and guest mode empty to skip
        presence altogether and run on just the schedule and thermal demand
        filter; the device then follows the periods and turns off between them.
      input:
        occupancy_entities:
          name: Home occupancy entities (optional)
          description: >
            People, phones, zone.home, or sensors that mean someone is home. When
            set, heating only runs while someone is home — it starts once presence
            is detected — and the out-of-comfort action applies when away. Leave
            empty (along with guest mode) to skip presence entirely and run purely
            on the schedule and thermal demand filter.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
                - domain: device_tracker
                - domain: zone
                - domain: binary_sensor
        guest_mode_switch:
          name: Guest mode (optional)
          description: >
            On treats the home as occupied even when trackers leave. Leave empty
            if you don't use it.
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean
        room_presence_entities:
          name: Room presence entities (optional)
          description: >
            Sensors that indicate THIS room is occupied — e.g. an mmWave/presence
            sensor or a motion sensor for the room this device heats. When set,
            comfort is allowed only while the room is occupied: if a period is
            scheduled but the room is empty, the device follows the Room Vacancy
            Response below (ease back, then optionally off). Leave empty to fall
            back to whole-home occupancy (no change). Room occupancy comes only
            from these sensors — guest mode is a whole-home signal and does not
            force an individual room occupied.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                - domain: input_boolean
                - domain: sensor
        winter_away_action:
          name: Winter out-of-comfort action
          description: >
            What the device does in winter whenever it is not in active comfort
            (no period scheduled, or nobody home): turn off, or hold the setback
            temperature below.
          default: "off"
          selector:
            select:
              options:
                - label: Turn off
                  value: "off"
                - label: Hold setback
                  value: "setback"
        away_winter_setback_temperature:
          name: Winter setback temperature
          description: Winter heat target when the winter out-of-comfort action is setback.
          default: 61
          selector:
            number:
              min: 41
              max: 95
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        summer_away_action:
          name: Summer out-of-comfort action
          description: >
            What the device does in summer whenever it is not in active comfort
            (no period scheduled, or nobody home): turn off, or hold the setback
            temperature below.
          default: "off"
          selector:
            select:
              options:
                - label: Turn off
                  value: "off"
                - label: Hold setback
                  value: "setback"
        away_summer_setback_temperature:
          name: Summer setback temperature
          description: Summer cool target when the summer out-of-comfort action is setback.
          default: 82
          selector:
            number:
              min: 50
              max: 95
              step: 1
              mode: slider
              unit_of_measurement: "°F"

    room_vacancy_section:
      name: Room Vacancy Response
      icon: mdi:account-clock
      collapsed: true
      description: >
        When room presence sensors are configured (in the Presence section), this
        controls what happens during a comfort period when the HOUSE is occupied
        but THIS room is empty — someone is home, just not here. (Nobody home, or
        no period scheduled, still uses the out-of-comfort action above.) Two
        optional stages let the room ease back gradually — e.g. drop 2° after 10
        minutes empty, then turn off after 30. Adjustments are relative to the
        current comfort target: the offset drops the target in winter and raises
        it in summer.
      input:
        room_vacancy_stage1_minutes:
          name: Stage 1 delay
          description: >
            How long the room must be continuously empty (during a comfort
            period, house occupied) before the Stage 1 action applies.
          default: 10
          selector:
            number:
              min: 1
              max: 240
              step: 1
              mode: box
              unit_of_measurement: min
        winter_room_vacancy_stage1_action:
          name: Winter Stage 1 action
          description: What to do in winter once the room has been empty for the Stage 1 delay.
          default: adjust
          selector:
            select:
              options:
                - label: Adjust (drop below comfort)
                  value: adjust
                - label: Turn off
                  value: "off"
                - label: Hold comfort (no change)
                  value: hold
        winter_room_vacancy_stage1_offset:
          name: Winter Stage 1 offset
          description: Degrees to drop below the comfort target when the Winter Stage 1 action is Adjust.
          default: 4
          selector:
            number:
              min: 0
              max: 18
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        summer_room_vacancy_stage1_action:
          name: Summer Stage 1 action
          description: What to do in summer once the room has been empty for the Stage 1 delay.
          default: adjust
          selector:
            select:
              options:
                - label: Adjust (raise above comfort)
                  value: adjust
                - label: Turn off
                  value: "off"
                - label: Hold comfort (no change)
                  value: hold
        summer_room_vacancy_stage1_offset:
          name: Summer Stage 1 offset
          description: Degrees to raise above the comfort target when the Summer Stage 1 action is Adjust.
          default: 4
          selector:
            number:
              min: 0
              max: 18
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        room_vacancy_stage2_minutes:
          name: Stage 2 delay (optional)
          description: >
            Longer empty time before the deeper Stage 2 action applies. Should be
            larger than the Stage 1 delay. Set to 0 to disable Stage 2.
          default: 0
          selector:
            number:
              min: 0
              max: 480
              step: 1
              mode: box
              unit_of_measurement: min
        winter_room_vacancy_stage2_action:
          name: Winter Stage 2 action
          description: What to do in winter once the room has been empty for the Stage 2 delay.
          default: "off"
          selector:
            select:
              options:
                - label: Adjust (drop below comfort)
                  value: adjust
                - label: Turn off
                  value: "off"
                - label: Hold comfort (no change)
                  value: hold
        winter_room_vacancy_stage2_offset:
          name: Winter Stage 2 offset
          description: Degrees to drop below the comfort target when the Winter Stage 2 action is Adjust.
          default: 7
          selector:
            number:
              min: 0
              max: 18
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        summer_room_vacancy_stage2_action:
          name: Summer Stage 2 action
          description: What to do in summer once the room has been empty for the Stage 2 delay.
          default: "off"
          selector:
            select:
              options:
                - label: Adjust (raise above comfort)
                  value: adjust
                - label: Turn off
                  value: "off"
                - label: Hold comfort (no change)
                  value: hold
        summer_room_vacancy_stage2_offset:
          name: Summer Stage 2 offset
          description: Degrees to raise above the comfort target when the Summer Stage 2 action is Adjust.
          default: 7
          selector:
            number:
              min: 0
              max: 18
              step: 1
              mode: slider
              unit_of_measurement: "°F"

    window_door_section:
      name: Window / Door
      icon: mdi:window-open-variant
      collapsed: true
      description: >
        Optional. Pause or ease back the unit while a window or door is open, so
        it isn't conditioning the outdoors. A short open delay ignores brief
        openings, and an optional second stage can escalate (e.g. drop a few
        degrees after a couple of minutes, then turn off after longer). A manual
        boost still overrides this; otherwise an open window takes priority over
        comfort, room vacancy and setback, and suppresses dry sweeps. Behaviour
        resumes when everything is closed again.
      input:
        window_door_entities:
          name: Window / door sensors (optional)
          description: >
            Open/close sensors for this room (open = on). When any is open past
            the Stage 1 delay below, the per-season action applies. Leave empty
            to disable this feature.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                - domain: input_boolean
        window_door_stage1_minutes:
          name: Stage 1 delay
          description: >
            How long a window/door must be open before the Stage 1 action
            applies, to ignore brief openings. 0 acts as soon as it opens.
          default: 2
          selector:
            number:
              min: 0
              max: 120
              step: 1
              mode: box
              unit_of_measurement: min
        winter_window_door_stage1_action:
          name: Winter Stage 1 action
          description: What to do in winter once a window/door has been open for the Stage 1 delay.
          default: adjust
          selector:
            select:
              options:
                - label: Adjust (drop below the current target)
                  value: adjust
                - label: Turn off
                  value: "off"
                - label: Hold (no change)
                  value: hold
        winter_window_door_stage1_offset:
          name: Winter Stage 1 offset
          description: Degrees to drop below the would-be target when the Winter Stage 1 action is Adjust.
          default: 7
          selector:
            number:
              min: 0
              max: 27
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        summer_window_door_stage1_action:
          name: Summer Stage 1 action
          description: What to do in summer once a window/door has been open for the Stage 1 delay.
          default: adjust
          selector:
            select:
              options:
                - label: Adjust (raise above the current target)
                  value: adjust
                - label: Turn off
                  value: "off"
                - label: Hold (no change)
                  value: hold
        summer_window_door_stage1_offset:
          name: Summer Stage 1 offset
          description: Degrees to raise above the would-be target when the Summer Stage 1 action is Adjust.
          default: 7
          selector:
            number:
              min: 0
              max: 27
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        window_door_stage2_minutes:
          name: Stage 2 delay (optional)
          description: >
            Longer open time before the deeper Stage 2 action applies. Should be
            larger than the Stage 1 delay. Set to 0 to disable Stage 2.
          default: 0
          selector:
            number:
              min: 0
              max: 240
              step: 1
              mode: box
              unit_of_measurement: min
        winter_window_door_stage2_action:
          name: Winter Stage 2 action
          description: What to do in winter once a window/door has been open for the Stage 2 delay.
          default: "off"
          selector:
            select:
              options:
                - label: Adjust (drop below the current target)
                  value: adjust
                - label: Turn off
                  value: "off"
                - label: Hold (no change)
                  value: hold
        winter_window_door_stage2_offset:
          name: Winter Stage 2 offset
          description: Degrees to drop below the would-be target when the Winter Stage 2 action is Adjust.
          default: 7
          selector:
            number:
              min: 0
              max: 27
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        summer_window_door_stage2_action:
          name: Summer Stage 2 action
          description: What to do in summer once a window/door has been open for the Stage 2 delay.
          default: "off"
          selector:
            select:
              options:
                - label: Adjust (raise above the current target)
                  value: adjust
                - label: Turn off
                  value: "off"
                - label: Hold (no change)
                  value: hold
        summer_window_door_stage2_offset:
          name: Summer Stage 2 offset
          description: Degrees to raise above the would-be target when the Summer Stage 2 action is Adjust.
          default: 7
          selector:
            number:
              min: 0
              max: 27
              step: 1
              mode: slider
              unit_of_measurement: "°F"

    frost_protection_section:
      name: Frost Protection
      icon: mdi:snowflake-alert
      collapsed: true
      description: >
        A safety floor. If the room temperature drops below the minimum, the unit
        heats to that minimum regardless of schedule, occupancy, room vacancy, an
        open window, a boost, a manual change, or even the season being set to
        summer. Heat-only; it never cools. Leave disabled if you don't want it.
      input:
        frost_protection_enabled:
          name: Enable frost protection
          description: Force heating whenever the room falls below the minimum below.
          default: false
          selector:
            boolean:
        frost_minimum_temperature:
          name: Frost minimum temperature
          description: >
            The lowest the room is allowed to reach. Below this the unit heats up
            to it (with a small margin to avoid rapid cycling).
          default: 46
          selector:
            number:
              min: 37
              max: 61
              step: 1
              mode: slider
              unit_of_measurement: "°F"

    thermal_demand_section:
      name: Thermal Demand Filter
      icon: mdi:thermometer-lines
      collapsed: true
      description: >
        During an active comfort period the schedule has given permission to run;
        this filter then decides whether running is genuinely required, so the
        unit only operates when it needs to. It is not a thermostat replacement —
        the device's own thermostat holds the target once it is running.

        Two stages, based on whether the unit is already running:

        Starting (currently off) — room only: start when the room has drifted
        more than the comfort band below the target (winter) or above it (summer).

        Keeping it running (already on) — room OR outdoor OR forecast: keep going
        while the room is short of target, OR outdoor is still past the threshold,
        OR the forecast shows outdoor moving the wrong way over the next few
        hours. It switches off only once the room is satisfied AND the weather no
        longer warrants it AND the forecast isn't about to turn.

        The outdoor threshold and the forecast both sit only on the keep-running
        side, so the unit won't flip on and off as readings hover near a limit,
        and won't cut out just before a cold spell.
      input:
        winter_comfort_band:
          name: Winter comfort band
          description: >
            How far the room may drift BELOW the current heating target before
            heating starts (e.g. 2 °F → with a 70 °F target it starts at 68 °F).
            The band follows whatever target is active right now — a scheduled
            period, a setback, or a boost.
          default: 2
          selector:
            number:
              min: 1
              max: 9
              step: 0.5
              mode: slider
              unit_of_measurement: "°F"
        winter_outdoor_cold_threshold:
          name: Winter outdoor cold threshold
          description: >
            Once heating, the unit keeps running while outdoor stays below this,
            even after the room reaches its target. Low value = shuts off sooner
            when the day warms; high value = keeps running through cold nights
            (good for all-night bedroom heating). A draughty house wants a higher
            value.
          default: 57
          selector:
            number:
              min: 14
              max: 77
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        summer_comfort_band:
          name: Summer comfort band
          description: >
            How far the room may drift ABOVE the current cooling target before
            cooling starts (e.g. 2 °F → with a 75 °F target it starts at 77 °F).
          default: 2
          selector:
            number:
              min: 1
              max: 9
              step: 0.5
              mode: slider
              unit_of_measurement: "°F"
        summer_outdoor_hot_threshold:
          name: Summer outdoor hot threshold
          description: >
            Once cooling, the unit keeps running while outdoor stays above this,
            even after the room reaches its target. High value = shuts off sooner
            when the evening cools; low value = keeps running through hot days.
          default: 75
          selector:
            number:
              min: 50
              max: 104
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        forecast_feature_enabled:
          name: Enable forecast trend
          description: >
            Optional. While the unit is ALREADY running, keep it running if the
            forecast shows outdoor temperature dropping (winter) or rising
            (summer) over the next few hours — so it won't switch off just before
            a cold/hot spell. Keep-running only; it never starts the unit
            pre-emptively. Requires a weather entity below.
          default: false
          selector:
            boolean:
        weather_forecast_entity:
          name: Weather forecast entity (optional)
          description: >
            Weather entity providing an hourly forecast, used only when the
            forecast trend toggle above is on. If your outdoor source is already
            a weather entity you can select the same one.
          default: ""
          selector:
            entity:
              filter:
                domain: weather
        forecast_lookahead_hours:
          name: Forecast look-ahead window
          description: How many hours of forecast to inspect for the trend.
          default: 4
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: slider
              unit_of_measurement: h
        indoor_trend_enabled:
          name: Enable indoor temperature trend
          description: >
            Optional. Start heating/cooling a little earlier when the room itself
            is changing fast — a cold snap, an open door — instead of waiting for
            the full comfort band. Start-side only; it never changes the
            keep-running or switch-off logic. Requires the rate-of-change sensor
            below.
          default: false
          selector:
            boolean:
        indoor_trend_sensor:
          name: Indoor rate-of-change sensor (optional)
          description: >
            A sensor giving the room's temperature change in °F per hour
            (positive = warming, negative = cooling). The easiest way to get one
            is a Derivative helper on the room temperature sensor, with a time
            window of about 10-15 minutes and unit °F/h. Used only when the
            toggle above is on.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
        indoor_trend_rate:
          name: Trend rate threshold
          description: >
            How fast the room must be changing to trigger the early start, in °F
            per hour. e.g. 2 means begin as soon as the room is dropping
            (winter) or rising (summer) faster than 2 °F/hour, rather than
            waiting for it to drift a full band past the target.
          default: 2
          selector:
            number:
              min: 0.5
              max: 9
              step: 0.5
              mode: slider
              unit_of_measurement: "°F/h"

    boost_section:
      name: Timed Boost
      icon: mdi:rocket-launch
      collapsed: true
      description: >
        Boost temporarily shifts the target by your adjustment (warmer in
        winter, cooler in summer) for a set duration, then turns itself off.
        It deviates from the current scheduled period target; when no period is
        active it deviates from the setback temperature, so it still works out of
        hours. Entirely optional — leave the feature toggle off if unused.
        Enable the toggle, create an input_boolean helper, and select it below.
      input:
        boost_feature_enabled:
          name: Enable boost feature
          description: >
            Master toggle for boost. When off all boost settings are ignored
            and the switch helper below is not required.
          default: false
          selector:
            boolean:
        boost_switch:
          name: Boost switch helper (optional)
          description: >
            Input boolean helper used to activate boost from a dashboard button
            or automation. Only used when the feature toggle above is on.
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean
        winter_boost_adjustment:
          name: Winter boost adjustment
          description: Added to the active winter target. Positive heats more.
          default: 4
          selector:
            number:
              min: -18
              max: 18
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        winter_boost_minutes:
          name: Winter boost duration
          description: Minutes before boost automatically turns itself off in winter.
          default: 60
          selector:
            number:
              min: 5
              max: 240
              step: 5
              mode: slider
              unit_of_measurement: min
        summer_boost_adjustment:
          name: Summer boost adjustment
          description: Added to the active summer target. Negative cools more.
          default: -4
          selector:
            number:
              min: -18
              max: 18
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        summer_boost_minutes:
          name: Summer boost duration
          description: Minutes before boost automatically turns itself off in summer.
          default: 60
          selector:
            number:
              min: 5
              max: 240
              step: 5
              mode: slider
              unit_of_measurement: min

    condensation_section:
      name: Condensation & Dry Mode
      icon: mdi:water-percent
      collapsed: true
      description: >
        Dry mode is a moisture mitigation mode — it runs opportunistically in
        winter when dew-point physics indicate condensation is likely on windows.
        It is NOT a comfort or temperature control mode. It never overrides
        heating logic; heating always takes priority.

        Condensation rule: risk is TRUE when
          dew_point ≥ outdoor_temperature + condensation_margin
        where dew_point = indoor_temp − ((100 − indoor_humidity) × 0.36)

        Dry mode may run ONLY when:
          • the feature toggle below is ON (and the optional runtime switch,
            if one is configured, is also ON)
          • the device supports Dry mode (selected in Climate Device section)
          • winter mode is active
          • condensation risk is TRUE
          • it is allowed right now — when the house is empty (if "run when
            empty" is on) and/or inside the scheduled time window (if "run
            during window" is on)
          • no physical window or door is open (the window/door feature is
            not inhibiting)
          • nobody has recently taken manual control of the unit
          • the room is not already below its comfort floor
          • it has been out of dry mode for the minimum off time

        It stops, but only after the minimum runtime has elapsed, when
        condensation clears, winter mode ends, the scheduled time window
        closes, the house becomes occupied (where that was the permission it
        was running under), or the maximum runtime is reached.

        It stops immediately, overriding the minimum runtime, if a physical
        window or door is opened, someone takes manual control, or indoor
        temperature drops to its comfort floor.
      input:
        dry_mode_feature_enabled:
          name: Enable dry mode feature
          description: >
            Master toggle for the entire dry mode feature. Set to OFF to
            completely disable dry sweeps without removing any other settings.
            When OFF all dry mode inputs below are ignored.
          default: false
          selector:
            boolean:
        dry_mode_switch:
          name: Dry mode runtime switch (optional)
          description: >
            Optional input_boolean helper for dashboard on/off control at
            runtime. When provided this switch must also be ON for dry mode
            to run. Leave empty if you prefer to control dry mode solely
            through the feature toggle above.
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean
        indoor_temperature_sensor:
          name: Indoor temperature sensor
          description: >
            Used for dew point calculation and comfort protection.
            Only required when the dry mode feature is enabled.
            Leave empty if dry mode is not in use.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
        indoor_humidity_sensor:
          name: Indoor humidity sensor
          description: >
            Used to calculate the indoor dew point.
            Only required when the dry mode feature is enabled.
            Leave empty if dry mode is not in use.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
                device_class: humidity
        condensation_margin:
          name: Condensation trigger margin
          description: >
            Dry mode triggers when: dew_point ≥ outdoor_temp + this value.
            0 = trigger exactly at dew point.
            Positive = trigger earlier (more aggressive moisture control).
            Negative = trigger only when condensation is very likely.
          default: 2
          selector:
            number:
              min: -6
              max: 9
              step: 0.5
              mode: slider
              unit_of_measurement: "°F"
        dry_allow_when_empty:
          name: Run dry mode when the house is empty
          description: >
            Allow dry sweeps whenever nobody is home, at any time of day.
            Turn this OFF if you only want dry mode during the scheduled window.
          default: true
          selector:
            boolean:
        dry_allow_in_window:
          name: Run dry mode during the scheduled window
          description: >
            Allow dry sweeps during the time window below, whether or not anyone
            is home. Turn this OFF if you only want dry mode while the house is
            empty (e.g. a bedroom). These two toggles are independent — enable
            either, both, or (to disable dry scheduling entirely) neither.
          default: true
          selector:
            boolean:
        dry_mode_window_start:
          name: Dry mode window — start
          description: >
            Start of the dry-mode window. Only used when "Run dry mode during the
            scheduled window" above is on.
          default: "22:00:00"
          selector:
            time:
        dry_mode_window_end:
          name: Dry mode window — end
          description: >
            End of the dry-mode window. Wraps midnight if end is before start
            (e.g. 22:00 → 07:00 = overnight). Only used when "Run dry mode during
            the scheduled window" is on.
          default: "07:00:00"
          selector:
            time:
        max_dry_cool_delta:
          name: Maximum cooling tolerance
          description: >
            Inside a comfort period, dry mode stops if indoor temperature drops
            more than this below the scheduled target. Protects comfort —
            prevents moisture control from making the house cold.
          default: 5.5
          selector:
            number:
              min: 2
              max: 11
              step: 0.5
              mode: slider
              unit_of_measurement: "°F"
        dry_minimum_temperature:
          name: Dry mode minimum temperature
          description: >
            Absolute floor used when dry mode runs OUTSIDE any comfort period
            (e.g. overnight). Dry mode stops if indoor temperature falls below
            this. Inside a period the cooling tolerance above is used instead.
          default: 61
          selector:
            number:
              min: 41
              max: 77
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        dry_minimum_run_minutes:
          name: Minimum dry mode runtime
          description: >
            Once started, dry mode cannot stop early (except for the comfort
            protection limit above). Prevents short on/off cycling.
          default: 10
          selector:
            number:
              min: 5
              max: 60
              step: 5
              mode: slider
              unit_of_measurement: min
        dry_minimum_off_minutes:
          name: Minimum dry mode off time
          description: >
            After a dry sweep ends, the unit must stay out of dry mode for at
            least this long before another sweep can begin. Separate from the
            heating minimum off time — set higher if dry mode is cycling on and
            off too often. Set to 0 to disable.
          default: 15
          selector:
            number:
              min: 0
              max: 120
              step: 5
              mode: slider
              unit_of_measurement: min
        dry_sweep_minutes:
          name: Maximum dry mode runtime
          description: >
            Dry mode is force-stopped after this duration even if condensation
            risk persists. Acts as a safety cap.
          default: 30
          selector:
            number:
              min: 10
              max: 180
              step: 5
              mode: slider
              unit_of_measurement: min

    mould_protection_section:
      name: Mould Protection
      icon: mdi:home-flood
      collapsed: true
      description: >
        Independent of dry mode. Where dry mode dehumidifies to stop condensation,
        this is a humidity-driven warmth floor: when relative humidity stays high,
        it holds the room at a minimum temperature so it doesn't sit cold and
        damp (warmer air carries the same moisture at a lower RH). It's a floor —
        a higher comfort or boost target always wins — and it only adds heat when
        the room would otherwise be off or cooler than the minimum. It yields to
        an open window and to active cooling, and frost protection still overrides
        it. Enable this, dry mode, both, or neither, as you like.
      input:
        mould_protection_enabled:
          name: Enable mould protection
          description: Hold a minimum temperature whenever humidity stays high.
          default: false
          selector:
            boolean:
        mould_humidity_threshold:
          name: Humidity threshold
          description: >
            Relative humidity at or above which mould protection engages. It
            releases 3% below this to avoid flapping.
          default: 70
          selector:
            number:
              min: 50
              max: 90
              step: 1
              mode: slider
              unit_of_measurement: "%"
        mould_humidity_sensor:
          name: Humidity sensor (optional)
          description: >
            The humidity source for mould protection. Point it at a mean-RH
            statistics helper (e.g. average over 2-3 hours) to act on sustained
            dampness rather than brief spikes, or leave it empty to use the
            instantaneous indoor humidity sensor from the Condensation section.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
        mould_minimum_temperature:
          name: Mould minimum temperature
          description: >
            The temperature to hold while humidity is high. A higher scheduled or
            boost target takes precedence; this only lifts the room when it would
            otherwise be cooler.
          default: 61
          selector:
            number:
              min: 50
              max: 72
              step: 1
              mode: slider
              unit_of_measurement: "°F"

    comfort_period_1_section:
      name: Comfort Period 1
      icon: mdi:calendar-clock
      collapsed: true
      description: >
        A scheduled comfort period. When enabled and the current time is inside
        its window on a selected day, it sets the comfort target for the active
        season. Periods ARE the schedule — outside every enabled period the
        device follows the out-of-comfort action. If periods overlap, the one
        that started most recently wins. Enable per season.
      input:
        period_1_winter_enabled:
          name: Period 1 — active in winter
          description: Use this period during winter mode.
          default: false
          selector:
            boolean:
        period_1_summer_enabled:
          name: Period 1 — active in summer
          description: Use this period during summer mode.
          default: false
          selector:
            boolean:
        period_1_name:
          name: Period 1 name
          description: Display name for this period.
          default: "Period 1"
          selector:
            text:
        period_1_start:
          name: Period 1 start time
          description: Time this period begins.
          default: "06:00:00"
          selector:
            time:
        period_1_end:
          name: Period 1 end time
          description: Time this period ends.
          default: "22:00:00"
          selector:
            time:
        period_1_days:
          name: Period 1 active days
          description: >
            Days this period applies. For overnight windows (start later than
            end) the selected day is the day the window begins.
          default:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        period_1_winter_temperature:
          name: Period 1 winter target
          description: Winter heat target during this period.
          default: 70
          selector:
            number:
              min: 41
              max: 95
              step: 1
              mode: slider
              unit_of_measurement: "°F"
        period_1_summer_temperature:
          name: Period 1 summer target
          description: Summer cool target during this period.
          default: 75
          selector:
            number:
              min: 50
              max: 95
              step: 1
              mode: slider
              unit_of_measurement: "°F"

