      windowed_hvac_mode: >-
        {% set m = base_hvac_mode | trim %}
        {% if window_door_inhibit | bool and not (boost_is_active | bool) and window_door_off | bool %}
          off
        {% else %}
          {{ m }}
        {% endif %}
      windowed_temperature: >-
        {% set base = base_temperature | float %}
        {% set t = namespace(v=base) %}
        {% if window_door_inhibit | bool and not (boost_is_active | bool)
              and (window_door_action | trim) == 'adjust' and base > 0 %}
          {% set t.v = (base - (window_door_offset | float)) if season_is_winter | bool
                       else (base + (window_door_offset | float)) %}
        {% endif %}
        {% if windowed_hvac_mode | trim in ['heat', 'cool'] %}
          {{ t.v }}
        {% else %}
          0
        {% endif %}
      # ── MOULD PROTECTION (warmth floor) ───────────────────────────────────────
      # A humidity-driven heat FLOOR (distinct from dry mode, which dehumidifies
      # for condensation). When relative humidity stays high, hold at least the
      # mould minimum so the room doesn't sit cold and damp. RH comes from the
      # optional mould humidity sensor (point it at a mean-RH helper for sustained
      # tracking) or, if unset, the condensation section's instantaneous sensor.
      # It composes with the other targets as a max (a higher comfort/boost target
      # wins), yields to an open window and to active cooling, and sits below
      # frost. A 3% RH hysteresis (while already heating) avoids flapping.
      mould_effective_humidity: >-
        {% set s = mould_humidity_sensor if mould_humidity_sensor != '' else indoor_humidity_sensor %}
        {% if s != '' and states(s) not in ['unknown', 'unavailable', 'none', ''] %}
          {{ states(s) | float(-1) }}
        {% else %}
          -1
        {% endif %}
      mould_risk_active: >-
        {% if not (mould_protection_enabled | bool) or not (supports_heat | bool)
              or (mould_effective_humidity | float(-1)) < 0 %}
          false
        {% elif current_hvac_mode == 'heat' %}
          {{ (mould_effective_humidity | float) >= ((mould_humidity_threshold | float) - 3) }}
        {% else %}
          {{ (mould_effective_humidity | float) >= (mould_humidity_threshold | float) }}
        {% endif %}
      mould_floor_applies: >-
        {{ mould_risk_active | bool
           and not (window_door_inhibit | bool)
           and (windowed_hvac_mode | trim) != 'cool' }}
      # ── DESIRED (frost + mould floors over the windowed target) ───────────────
      desired_hvac_mode: >-
        {% if frost_protection_active | bool %}
          heat
        {% elif mould_floor_applies | bool %}
          heat
        {% else %}
          {{ windowed_hvac_mode | trim }}
        {% endif %}
      desired_temperature: >-
        {% if desired_hvac_mode | trim == 'heat' %}
          {% set t = namespace(v=0) %}
          {% if windowed_hvac_mode | trim == 'heat' %}
            {% set t.v = windowed_temperature | float %}
          {% endif %}
          {% if frost_protection_active | bool %}
            {% set t.v = [t.v, frost_minimum_temperature | float] | max %}
          {% endif %}
          {% if mould_floor_applies | bool %}
            {% set t.v = [t.v, mould_minimum_temperature | float] | max %}
          {% endif %}
          {{ [[t.v, device_max_temp | float] | min, device_min_temp | float] | max }}
        {% elif desired_hvac_mode | trim == 'cool' %}
          {{ [[windowed_temperature | float, device_max_temp | float] | min, device_min_temp | float] | max }}
        {% else %}
          0
        {% endif %}
      # ── FORECAST TREND (keep-running only) ────────────────────────────────────
      # Optional. While the unit is already running, the forecast can hold it on
      # if outdoor is heading the wrong way. We scan the next forecast_lookahead
      # hours for the lowest (winter) / highest (summer) outdoor temperature.
      # Sentinels keep the trend false when the feature is off or no data is
      # available: min defaults high (999), max defaults low (-999).
      forecast_outdoor_min: >-
        {% if not (forecast_feature_enabled | bool) or weather_forecast_entity == '' %}
          999
        {% else %}
          {% set fc = forecast_response.get(weather_forecast_entity, {}).get('forecast', [])
                      if forecast_response is defined else [] %}
          {% set hours = forecast_lookahead_hours | int(4) %}
          {% set ns = namespace(lo=999, n=0) %}
          {% for item in fc %}
            {% if ns.n < hours %}
              {% set t = item.temperature | float(999) %}
              {% if t < ns.lo %}{% set ns.lo = t %}{% endif %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.lo }}
        {% endif %}
      forecast_outdoor_max: >-
        {% if not (forecast_feature_enabled | bool) or weather_forecast_entity == '' %}
          -999
        {% else %}
          {% set fc = forecast_response.get(weather_forecast_entity, {}).get('forecast', [])
                      if forecast_response is defined else [] %}
          {% set hours = forecast_lookahead_hours | int(4) %}
          {% set ns = namespace(hi=-999, n=0) %}
          {% for item in fc %}
            {% if ns.n < hours %}
              {% set t = item.temperature | float(-999) %}
              {% if t > ns.hi %}{% set ns.hi = t %}{% endif %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.hi }}
        {% endif %}
      # Falling/rising require a meaningful move (1 °F) past the current reading.
      forecast_falling: >-
        {{ (forecast_outdoor_min | float(999)) < ((outdoor_temp | float) - 1) }}
      forecast_rising: >-
        {{ (forecast_outdoor_max | float(-999)) > ((outdoor_temp | float) + 1) }}
      # ── INDOOR TEMPERATURE TREND (start-side only) ────────────────────────────
      # Optional. With a rate-of-change sensor (°F/hour) on the room, start
      # without waiting for the full comfort band when the room itself is moving
      # fast: heat as soon as it is below target while falling faster than the
      # threshold; cool as soon as it is above target while rising that fast.
      # Disabled / no sensor / unavailable → value 0 → no effect. Keep-running
      # and switch-off behaviour are untouched.
      indoor_trend_value: >-
        {% if indoor_trend_enabled | bool and indoor_trend_sensor != ''
              and states(indoor_trend_sensor) not in ['unknown', 'unavailable', 'none', ''] %}
          {{ states(indoor_trend_sensor) | float(0) }}
        {% else %}
          0
        {% endif %}
      indoor_falling_fast: "{{ (indoor_trend_value | float) < -(indoor_trend_rate | float(1)) }}"
      indoor_rising_fast: "{{ (indoor_trend_value | float) > (indoor_trend_rate | float(1)) }}"
      # ── THERMAL DEMAND ────────────────────────────────────────────────────────
      # Two-state hysteresis keyed on the desired mode and target:
      #
      #   START (unit currently off) — ROOM only: heat when the room is more than
      #     the comfort band below the target; cool when more than the band above.
      #
      #   KEEP RUNNING (already on) — room OR outdoor OR forecast: keep heating
      #     while room < target, OR outdoor still below the cold threshold, OR the
      #     forecast is falling. Summer mirrors with the hot threshold and a
      #     rising forecast. Switch off only once room is satisfied AND outdoor
      #     has crossed the threshold AND the forecast isn't turning.
      #
      # The band follows the active target (period, setback, or boost). The
      # outdoor threshold and forecast sit only on the keep-running side, which
      # prevents short-cycling and stops the unit cutting out before a cold snap.
      # If sensors are unavailable demand defaults TRUE so the unit is never
      # blindly shut off on a missing reading.
      thermal_demand: >-
        {% if frost_protection_active | bool %}
          true
        {% elif not (thermal_sensors_available | bool) %}
          true
        {% elif desired_hvac_mode | trim == 'heat' %}
          {% if current_hvac_mode == 'heat' %}
            {{ (room_temp | float) < (desired_temperature | float)
               or (outdoor_temp | float) < (winter_outdoor_cold_threshold | float)
               or forecast_falling | bool }}
          {% else %}
            {{ (room_temp | float) < ((desired_temperature | float)
                 - (0 if indoor_falling_fast | bool else (winter_comfort_band | float)))
               or (mould_floor_applies | bool and (room_temp | float) < (mould_minimum_temperature | float)) }}
          {% endif %}
        {% elif desired_hvac_mode | trim == 'cool' %}
          {% if current_hvac_mode == 'cool' %}
            {{ (room_temp | float) > (desired_temperature | float)
               or (outdoor_temp | float) > (summer_outdoor_hot_threshold | float)
               or forecast_rising | bool }}
          {% else %}
            {{ (room_temp | float) > ((desired_temperature | float)
                 + (0 if indoor_rising_fast | bool else (summer_comfort_band | float))) }}
          {% endif %}
        {% else %}
          false
        {% endif %}
      # ── MINIMUM RUN PROTECTION ────────────────────────────────────────────────
      minimum_run_seconds: "{{ (minimum_run_minutes | int(0)) * 60 }}"
      climate_runtime_seconds: >-
        {% set climate_state = states[climate_entity] %}
        {% if climate_state is not none %}
          {{ (as_timestamp(now()) - as_timestamp(climate_state.last_changed)) | int(0) }}
        {% else %}
          999999
        {% endif %}
      remaining_minimum_run_seconds: >-
        {% set remaining = (minimum_run_seconds | int(0)) - (climate_runtime_seconds | int(0)) %}
        {{ [remaining, 0] | max }}
      minimum_run_delay_needed: >-
        {{ current_hvac_mode in ['heat', 'cool', 'heat_cool']
           and (remaining_minimum_run_seconds | int(0)) > 0
           and (desired_hvac_mode | trim == 'off' or not (thermal_demand | bool)) }}
      # ── MINIMUM OFF PROTECTION ────────────────────────────────────────────────
      # After the unit turns off it must stay off for at least minimum_off_minutes
      # before it can restart. climate_runtime_seconds doubles as time-since-off
      # when the current state is off. This gates only the start branches.
      minimum_off_seconds: "{{ (minimum_off_minutes | int(0)) * 60 }}"
      minimum_off_delay_needed: >-
        {{ current_hvac_mode in ['off', 'unavailable', 'unknown']
           and ((minimum_off_seconds | int(0)) - (climate_runtime_seconds | int(0))) > 0 }}
      # ── CONDENSATION & DRY MODE ───────────────────────────────────────────────
      # SIGNAL 1 — Dew point (moisture content of indoor air)
      #   estimated_dew_point = indoor_temp − ((100 − indoor_humidity) × 0.36)
      # SIGNAL 2 — Surface temperature proxy
      #   outdoor_temp ≈ window glass temperature (thermal bridging / no insulation)
      # RISK RULE — condensation forms when dew point ≥ surface temp + margin
      estimated_dew_point: >-
        {% if indoor_temperature_sensor == '' or indoor_humidity_sensor == '' %}
          -99
        {% else %}
          {% set temp = states(indoor_temperature_sensor) | float(0) %}
          {% set humidity = states(indoor_humidity_sensor) | float(0) %}
          {{ (temp - ((100 - humidity) * 9 / 25)) | round(2) }}
        {% endif %}
      condensation_risk: >-
        {% if indoor_temperature_sensor == '' or indoor_humidity_sensor == '' %}
          false
        {% else %}
          {% set temp = states(indoor_temperature_sensor) %}
          {% set humidity = states(indoor_humidity_sensor) %}
          {% if (outdoor_temp | float(-99)) == -99
                or temp in ['unknown', 'unavailable', 'none', '']
                or humidity in ['unknown', 'unavailable', 'none', ''] %}
            false
          {% else %}
            {% set dew_point = (temp | float) - ((100 - (humidity | float)) * 9 / 25) %}
            {{ dew_point >= ((outdoor_temp | float) + (condensation_margin | float(0))) }}
          {% endif %}
        {% endif %}
      # ALLOWED-TO-RUN — two independent permissions, OR'd together:
      #   • when empty   : house unoccupied AND "run when empty" toggle on
      #   • during window: inside the time window AND "run in window" toggle on
      # within_dry_window is the raw time-of-day test used by the window branch.
      within_dry_window: >-
        {% if dry_mode_window_start <= dry_mode_window_end %}
          {{ now_time >= dry_mode_window_start and now_time < dry_mode_window_end }}
        {% else %}
          {{ now_time >= dry_mode_window_start or now_time < dry_mode_window_end }}
        {% endif %}
      dry_window_eligible: >-
        {{ (dry_allow_when_empty | bool and not (house_is_occupied | bool))
           or (dry_allow_in_window | bool and within_dry_window | bool) }}
      # COMFORT PROTECTION — room must not drop too far during a dry sweep.
      # Inside an active comfort period the floor is the scheduled target minus
      # the cooling tolerance. Outside any period (e.g. overnight) it is the
      # absolute dry-mode minimum temperature, so dry mode still has a hard floor.
      dry_comfort_safe: >-
        {% if comfort_period_active | bool %}
          {{ (room_temp | float) >= ((comfort_target | float) - (max_dry_cool_delta | float(3))) }}
        {% else %}
          {{ (room_temp | float) >= (dry_minimum_temperature | float) }}
        {% endif %}
      # RUNTIME TRACKING — derived from how long the climate entity has been in
      # dry mode. No timer helper required.
      dry_is_active: "{{ states(climate_entity) == 'dry' }}"
      dry_mode_runtime_seconds: >-
        {% if states(climate_entity) == 'dry' %}
          {{ (as_timestamp(now()) - as_timestamp(states[climate_entity].last_changed)) | int(0) }}
        {% else %}
          0
        {% endif %}
      dry_minimum_elapsed: >-
        {{ (dry_mode_runtime_seconds | int) >= ((dry_minimum_run_minutes | int(10)) * 60) }}
      dry_maximum_exceeded: >-
        {{ (dry_mode_runtime_seconds | int) >= ((dry_sweep_minutes | int(30)) * 60) }}
      # MINIMUM OFF — time since the unit left dry mode (measured from the last
      # mode change while not in dry). Gates re-starting a sweep too soon.
      dry_off_seconds: >-
        {% if dry_is_active | bool %}
          0
        {% else %}
          {{ (as_timestamp(now()) - as_timestamp(states[climate_entity].last_changed)) | int(0) }}
        {% endif %}
      dry_minimum_off_elapsed: >-
        {{ (dry_off_seconds | int) >= ((dry_minimum_off_minutes | int(15)) * 60) }}
      # EXIT — conditions that should end dry mode (checked after minimum run)
      dry_should_exit: >-
        {{ not (condensation_risk | bool)
           or not (season_is_winter | bool)
           or not (dry_window_eligible | bool)
           or dry_maximum_exceeded | bool }}
      # FEATURE GATE — blueprint toggle + optional runtime switch
      # If dry_mode_switch is not configured (empty string), only the feature
      # toggle matters. If it is configured, both must be on.
      dry_feature_gate: >-
        {{ dry_mode_feature_enabled | bool
           and supports_dry | bool
           and (dry_mode_switch == ''
                or is_state(dry_mode_switch, 'on')) }}
      # START ELIGIBILITY — all conditions required before dry mode may begin
      dry_eligible_to_start: >-
        {{ dry_feature_gate | bool
           and season_is_winter | bool
           and condensation_risk | bool
           and dry_window_eligible | bool
           and dry_comfort_safe | bool
           and dry_minimum_off_elapsed | bool
           and not (window_door_inhibit | bool)
           and not (desired_hvac_mode | trim == 'heat' and thermal_demand | bool) }}
      # ── MANUAL TAKEOVER STATE ─────────────────────────────────────────────────
      # Two detection paths:
      #
      # 1. HELPER PATH (recommended) — when a helper is configured, the recording
      #    step (which runs just after this variables block) compares any change
      #    to what the automation intended and raises the helper when they differ.
      #    The flag persists across restarts and clears after manual_takeover_minutes.
      #    Works even on integrations (e.g. IR) that don't preserve change context.
      #
      # 2. FALLBACK PATH (no helper) — inspects the context of the climate
      #    entity's current state: automation commands carry a parent_id, manual
      #    changes generally don't. Less robust (it can briefly false-positive
      #    right after a restart, which the homeassistant_start guard suppresses),
      #    but it still catches a manual change without any helper configured.
      # effective_hvac_mode — what the automation would actually command right
      # now, accounting for dry mode and thermal demand. Used to decide whether
      # the device's current state genuinely disagrees with the automation.
      effective_hvac_mode: >-
        {% if dry_is_active | bool %}
          dry
        {% elif desired_hvac_mode | trim in ['heat', 'cool'] and thermal_demand | bool %}
          {{ desired_hvac_mode | trim }}
        {% else %}
          off
        {% endif %}
      # automation_target_mode — the mode the automation would CHOOSE on its own,
      # independent of the current state. Unlike effective_hvac_mode it treats dry
      # as intended only when the automation would actually START a sweep
      # (dry_eligible_to_start = real condensation risk etc.), not merely because
      # the device happens to be in dry. This lets the takeover detector tell
      # "the automation put it in dry" from "a human put it in dry": a manual
      # switch to dry with no condensation reason no longer matches intent and is
      # flagged as a takeover, while a sweep the automation itself wanted is not.
      automation_target_mode: >-
        {% if dry_eligible_to_start | bool %}
          dry
        {% elif desired_hvac_mode | trim in ['heat', 'cool'] and thermal_demand | bool %}
          {{ desired_hvac_mode | trim }}
        {% else %}
          off
        {% endif %}
      climate_seconds_since_change: >-
        {% set s = states[climate_entity] %}
        {{ (as_timestamp(now()) - as_timestamp(s.last_changed)) | int(0) if s is not none else 999999 }}
      climate_change_was_external: >-
        {% set s = states[climate_entity] %}
        {% if s is none or s.context is none %}
          false
        {% else %}
          {{ s.context.parent_id is none }}
        {% endif %}
      manual_takeover_seconds: >-
        {% if manual_takeover_helper != '' and is_state(manual_takeover_helper, 'on') %}
          {{ (as_timestamp(now()) - as_timestamp(states[manual_takeover_helper].last_changed)) | int(0) }}
        {% else %}
          999999
        {% endif %}
      # OCCUPANCY OVERRIDE: a manual switch-on means "we want heat while we're
      # here". The moment the house is unoccupied the manual session stands down
      # so the normal away logic (turn off / setback) takes over immediately,
      # rather than the takeover keeping the unit running in an empty house until
      # the timer lapses. Applies to both the helper and no-helper paths.
      manual_takeover_active: >-
        {% if (manual_takeover_minutes | int(0)) == 0
              or not (house_is_occupied | bool)
              or (frost_protection_active | bool) %}
          false
        {% elif manual_takeover_helper != '' %}
          {{ is_state(manual_takeover_helper, 'on')
             and (manual_takeover_seconds | int(999999)) < ((manual_takeover_minutes | int(0)) * 60) }}
        {% else %}
          {{ trigger_id != 'homeassistant_start'
             and current_hvac_mode != (effective_hvac_mode | trim)
             and climate_change_was_external | bool
             and current_hvac_mode not in ['unavailable', 'unknown']
             and (climate_seconds_since_change | int(999999)) < ((manual_takeover_minutes | int(0)) * 60) }}
        {% endif %}
      # ── STATUS LINE (optional dashboard output) ───────────────────────────────
      # One-line summary of the current decision, written to status_helper (if
      # set) by the status output step below. Comparisons trim/float the helper
      # vars because their multi-line templates carry surrounding whitespace.
      status_text: >-
        {% set occ = 'room occupied' if room_is_occupied | bool else 'room empty' %}
        {% set src = ('boost' if boost_is_active | bool
                      else (active_period_name if (comfort_period_active | bool and (active_period_name | trim) != '')
                            else ('comfort period' if comfort_period_active | bool
                                  else ('setback' if (winter_setback_is_active | bool or summer_setback_is_active | bool)
                                        else 'no period')))) %}
        {% set mode = effective_hvac_mode | trim %}
        {% set vac_min = (room_vacant_seconds | int(0)) // 60 %}
        {% if frost_protection_active | bool %}
          Frost protect → {{ desired_temperature | float | round(1) }}°
        {% elif manual_takeover_active | bool %}
          {% set left = (((manual_takeover_minutes | int(0)) * 60 - (manual_takeover_seconds | int(0))) // 60) %}
          Manual hold · {{ [left, 0] | max }}m left
        {% elif dry_is_active | bool %}
          Dry sweep running
        {% elif window_door_inhibit | bool and not (boost_is_active | bool) %}
          {% if mode in ['heat', 'cool'] %}
            Window open → {{ desired_temperature | float | round(1) }}° (stage {{ window_door_stage | int(0) }})
          {% else %}
            Window open → off (stage {{ window_door_stage | int(0) }})
          {% endif %}
        {% elif mould_floor_applies | bool and (windowed_hvac_mode | trim) != 'heat' %}
          Mould guard → {{ desired_temperature | float | round(1) }}°
        {% elif room_vacant_active | bool and (room_vacancy_stage | int(0)) >= 1 %}
          {% if mode in ['heat', 'cool'] %}
            Room empty {{ vac_min }}m → {{ desired_temperature | float | round(1) }}° (stage {{ room_vacancy_stage | int(0) }})
          {% else %}
            Room empty {{ vac_min }}m → off (stage {{ room_vacancy_stage | int(0) }})
          {% endif %}
        {% elif room_vacant_active | bool %}
          Room empty {{ vac_min }}m · holding {{ desired_temperature | float | round(1) }}°
        {% elif mode == 'heat' %}
          Heating to {{ desired_temperature | float | round(1) }}° · {{ src }} · {{ occ }}
        {% elif mode == 'cool' %}
          Cooling to {{ desired_temperature | float | round(1) }}° · {{ src }} · {{ occ }}
        {% else %}
          Idle · {{ src }} · {{ occ }}
        {% endif %}

  # ── STATUS OUTPUT ─────────────────────────────────────────────────────────────
  # Write the one-line status to the helper if one is configured. Runs every
  # evaluation, before the takeover recording's possible stop, so it always
  # reflects the latest decision.
  - if:
      - condition: template
        value_template: "{{ status_helper != '' }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ status_helper }}"
        data:
          value: "{{ status_text | trim }}"

  # ── MANUAL TAKEOVER RECORDING ─────────────────────────────────────────────────
  # Fires only on a climate state-change trigger. Detects a genuine external
  # change WITHOUT relying on the change's context — some integrations (notably
  # IR / SmartIR) don't preserve it, which would make the automation flag its own
  # commands. Instead it compares the new state against what the automation itself
  # intends right now: if the mode (and, for heat/cool, the setpoint) match the
  # automation's own target, it was our command and is ignored; if they differ, a
  # human changed it — in HA, or on the unit's own app/remote for two-way devices
  # — so raise the helper flag. Duration is tracked from the helper's last_changed.
  # Runs after the variables block so effective_hvac_mode / desired_temperature
  # (the automation's intent) are available.
  - choose:
      - alias: Flag manual takeover when the device no longer matches intent
        conditions:
          - condition: trigger
            id: climate_changed
          - condition: template
            value_template: >-
              {{ manual_takeover_helper != ''
                 and (manual_takeover_minutes | int(0)) > 0
                 and trigger.from_state is not none
                 and trigger.to_state is not none
                 and (
                   trigger.from_state.state != trigger.to_state.state
                   or trigger.from_state.attributes.get('temperature')
                      != trigger.to_state.attributes.get('temperature')
                 )
                 and not (
                   trigger.to_state.state == automation_target_mode
                   and (
                     automation_target_mode not in ['heat', 'cool']
                     or (((trigger.to_state.attributes.get('temperature') | float(-99))
                          - (desired_temperature | float)) | abs) < 1
                   )
                 ) }}
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ manual_takeover_helper }}"
          - stop: Manual takeover flagged — external change detected.

  # ── MANUAL TAKEOVER CLEANUP ───────────────────────────────────────────────────
  # Clear the helper once the takeover duration has elapsed OR the house has been
  # vacated. Clearing it on vacate ends the manual session cleanly, so returning
  # home within the original window resumes normal automatic control instead of
  # the (now stale) manual flag re-suppressing the automation.
  - choose:
      - alias: Clear manual takeover flag when expired or house vacated
        conditions:
          - condition: template
            value_template: >-
              {{ manual_takeover_helper != ''
                 and is_state(manual_takeover_helper, 'on')
                 and ( (manual_takeover_seconds | int(0)) >= ((manual_takeover_minutes | int(0)) * 60)
                       or not (house_is_occupied | bool) ) }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ manual_takeover_helper }}"

  # ── DRY MODE MANAGEMENT ──────────────────────────────────────────────────────
  # No timer helper required — runtime is tracked from the climate entity's
  # own last_changed timestamp while it is in dry mode.
  #
  # Two-branch choose block:
  #   Branch A — Start: eligible + not already running → set dry mode + stop
  #   Branch B — Maintain: already in dry mode + comfort safe + not (exit AND min elapsed)
  #              The stop prevents the main HVAC blocks below from interfering.
  #
  # Exit paths (neither branch fires → main HVAC logic runs + overrides dry mode):
  #   • Comfort protection: dry_comfort_safe = false
  #     → Branch B condition fails → main HVAC sends heat → exits dry naturally
  #   • Normal exit: dry_should_exit = true AND dry_minimum_elapsed = true
  #     → Branch B condition fails → main HVAC takes over
  #   • Minimum run lock: dry_should_exit = true AND dry_minimum_elapsed = false
  #     → Branch B still fires (lock respected) → dry mode maintained

  - choose:
      - alias: Start dry mode
        conditions:
          - condition: template
            value_template: >-
              {{ dry_eligible_to_start | bool
                 and not (dry_is_active | bool)
                 and not (manual_takeover_active | bool) }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: dry
          - stop: Dry mode started.

      - alias: Maintain dry mode (comfort safe; exit gate not yet cleared)
        conditions:
          - condition: template
            value_template: >-
              {{ dry_is_active | bool
                 and not (manual_takeover_active | bool)
                 and not (window_door_inhibit | bool)
                 and dry_comfort_safe | bool
                 and not (dry_should_exit | bool and dry_minimum_elapsed | bool) }}
        sequence:
          - stop: Dry mode running — suppressing main HVAC logic.

  # ── CLIMATE COMMANDS ────────────────────────────────────────────────────────
  # All branches are gated by three cross-cutting concerns:
  #   thermal_demand   — is HVAC action genuinely required?
  #   manual_takeover_active — has a human recently overridden the device?
  # Commands are split by whether the mode needs to change (sends hvac_mode +
  # temperature in one call) or only the setpoint shifted (temperature only,
  # avoids a redundant mode IR packet on devices that beep per command).

  - choose:
      - alias: Switch to heat mode (demand active, mode change needed)
        conditions:
          - condition: template
            value_template: >-
              {{ desired_hvac_mode | trim == 'heat'
                 and thermal_demand | bool
                 and not (manual_takeover_active | bool)
                 and not (minimum_off_delay_needed | bool)
                 and current_hvac_mode != 'heat' }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: heat
              temperature: "{{ desired_temperature | float }}"

      - alias: Adjust heat setpoint (already in heat mode, demand active, target shifted)
        conditions:
          - condition: template
            value_template: >-
              {{ desired_hvac_mode | trim == 'heat'
                 and thermal_demand | bool
                 and not (manual_takeover_active | bool)
                 and current_hvac_mode == 'heat'
                 and (current_temperature | float) != (desired_temperature | float) }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ desired_temperature | float }}"

      - alias: Switch to cool mode (demand active, mode change needed)
        conditions:
          - condition: template
            value_template: >-
              {{ desired_hvac_mode | trim == 'cool'
                 and thermal_demand | bool
                 and not (manual_takeover_active | bool)
                 and not (minimum_off_delay_needed | bool)
                 and current_hvac_mode != 'cool' }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: cool
              temperature: "{{ desired_temperature | float }}"

      - alias: Adjust cool setpoint (already in cool mode, demand active, target shifted)
        conditions:
          - condition: template
            value_template: >-
              {{ desired_hvac_mode | trim == 'cool'
                 and thermal_demand | bool
                 and not (manual_takeover_active | bool)
                 and current_hvac_mode == 'cool'
                 and (current_temperature | float) != (desired_temperature | float) }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ desired_temperature | float }}"

      - alias: Hard off — schedule or occupancy explicitly demands it
        conditions:
          - condition: template
            value_template: >-
              {{ desired_hvac_mode | trim == 'off'
                 and not (manual_takeover_active | bool)
                 and current_hvac_mode not in ['off', 'unavailable', 'unknown']
                 and not (minimum_run_delay_needed | bool) }}
        sequence:
          - action: climate.turn_off
            target:
              entity_id: !input climate_entity

      - alias: Soft off — thermal demand satisfied (indoor comfortable, outdoor stable)
        conditions:
          - condition: template
            value_template: >-
              {{ desired_hvac_mode | trim in ['heat', 'cool']
                 and not (thermal_demand | bool)
                 and not (manual_takeover_active | bool)
                 and current_hvac_mode not in ['off', 'unavailable', 'unknown']
                 and not (minimum_run_delay_needed | bool) }}
        sequence:
          - action: climate.turn_off
            target:
              entity_id: !input climate_entity

mode: restart
max_exceeded: silent