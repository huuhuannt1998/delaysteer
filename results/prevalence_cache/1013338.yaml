        {% elif (window_door_open_seconds | int(0)) >= (window_door_stage1_minutes | int(0)) * 60 %}
          1
        {% else %}
          0
        {% endif %}
      window_door_action: >-
        {% set s = window_door_stage | int(0) %}
        {% if s == 2 %}
          {{ winter_window_door_stage2_action if season_is_winter | bool else summer_window_door_stage2_action }}
        {% elif s == 1 %}
          {{ winter_window_door_stage1_action if season_is_winter | bool else summer_window_door_stage1_action }}
        {% else %}
          hold
        {% endif %}
      window_door_offset: >-
        {% set s = window_door_stage | int(0) %}
        {% if s == 2 %}
          {{ winter_window_door_stage2_offset if season_is_winter | bool else summer_window_door_stage2_offset }}
        {% elif s == 1 %}
          {{ winter_window_door_stage1_offset if season_is_winter | bool else summer_window_door_stage1_offset }}
        {% else %}
          0
        {% endif %}
      window_door_inhibit: "{{ (window_door_action | trim) != 'hold' }}"
      window_door_off: "{{ (window_door_action | trim) == 'off' }}"
