blueprint:
  name: "IKEA BILRESA - Licht-Controller (v1.5)"
  description: >
    Lichtsteuerung für IKEA BILRESA (Matter). Unterstützt dynamisches Scrollen, Szenen-Wechsel und Multi-Klicks für bis zu drei Kanäle.
  domain: automation

  # Thank you so much for your feedback and suggestions!
  # The current version includes suggestions, improvements and fixes provided by:
  # - dhoerner-git
  # - red-advoto
  # - Mikcx
  # - xantrk
  # - divicoulderico
  # - wdoor5325
  # - Cikkajes
  # - 3jam3

  input:
    remote_device:
      name: "Fernbedienung"
      description: "Das IKEA BILRESA Scrollrad (Matter), das als Auslöser dient."
      selector:
        device:
          filter:
            - manufacturer: "IKEA of Sweden"
              model: "BILRESA scroll wheel"

    # --- KANAL 1 ---
    header_1:
      name: "Kanal 1"
      default: ""
      selector:
        constant:
          value: ""

    group_scroll_1:
      name: "Scrollrad-Einstellungen"
      icon: "mdi:rotate-right"
      collapsed: true
      input:
        input_light_1:
          name: "Licht / Lichtgruppe"
          description: "Wähle das Licht oder die Gruppe aus, die gesteuert werden soll."
          default: {}
          selector: { target: { entity: { domain: light } } }
        input_mode_1:
          name: "Funktion beim Scrollen"
          description: "Lege fest, welcher Wert durch das Drehen des Rads geändert wird."
          default: "brightness"
          selector:
            select:
              mode: dropdown
              options:
                - { label: "Helligkeit", value: "brightness" }
                - { label: "Farbton", value: "hs_color" }
                - { label: "Farbtemperatur", value: "temp_kelvin" }
        input_sens_1:
          name: "Multiplikator"
          description: "Bestimme, wie stark sich der Wert bei jedem Scroll-Schritt ändern soll."
          default: 5
          selector:
            number:
              min: 1
              max: 50
              unit_of_measurement: "x"
              mode: slider
        input_transition_1:
          name: "Übergangsdauer"
          description: "Bestimme, wie lange der Übergang zwischen Änderungen dauern soll."
          default: 200
          selector:
            number:
              min: 0
              max: 5000
              unit_of_measurement: "ms"
              mode: slider

    group_single_click_1:
      name: "Einfacher Tastendruck"
      icon: "mdi:gesture-tap"
      collapsed: true
      input:
        input_click_mode_1:
          name: "Druck-Modus"
          description: "Wähle zwischen einer einzelnen Aktion oder dem Durchwechseln von Szenen."
          default: "action"
          selector:
            select:
              mode: dropdown
              options:
                - { label: "Einzelne Aktion ausführen", value: "action" }
                - { label: "Szenen-Wechsler", value: "scene_cycle" }
        input_scenes_1:
          name: "Szenen-Auswahl"
          description: "Wähle die Szenen aus, durch die nacheinander gewechselt werden soll."
          default: []
          selector: { entity: { domain: scene, multiple: true } }
        input_click_1:
          name: "Aktion bei Tastendruck"
          description: "Aktion, die im Modus 'Einzelne Aktion' ausgeführt wird."
          default: []
          selector: { action: {} }

    group_multi_click_1:
      name: "Weitere Tasten-Funktionen"
      icon: "mdi:plus-circle-outline"
      collapsed: true
      input:
        input_double_1:
          {
            name: "Doppel-Klick",
            description: "Aktion bei zweimaligem Drücken.",
            default: [],
            selector: { action: {} },
          }
        input_triple_1:
          {
            name: "Dreifach-Klick",
            description: "Aktion bei dreimaligem Drücken.",
            default: [],
            selector: { action: {} },
          }
        input_long_1:
          {
            name: "Halten",
            description: "Aktion beim langen Drücken der Taste.",
            default: [],
            selector: { action: {} },
          }
        input_release_1:
          {
            name: "Loslassen",
            description: "Aktion beim Loslassen der Taste nach langem Drücken.",
            default: [],
            selector: { action: {} },
          }

    # --- KANAL 2 ---
    header_2:
      name: "Kanal 2"
      default: ""
      selector:
        constant:
          value: ""

    group_scroll_2:
      name: "Scrollrad-Einstellungen"
      icon: "mdi:rotate-right"
      collapsed: true
      input:
        input_light_2:
          name: "Licht / Lichtgruppe"
          description: "Wähle das Licht oder die Gruppe aus, die gesteuert werden soll."
          default: {}
          selector: { target: { entity: { domain: light } } }
        input_mode_2:
          name: "Funktion beim Scrollen"
          description: "Lege fest, welcher Wert durch das Drehen des Rads geändert wird."
          default: "brightness"
          selector:
            select:
              mode: dropdown
              options:
                - { label: "Helligkeit", value: "brightness" }
                - { label: "Farbton", value: "hs_color" }
                - { label: "Farbtemperatur", value: "temp_kelvin" }
        input_sens_2:
          name: "Multiplikator"
          description: "Bestimme, wie stark sich der Wert bei jedem Scroll-Schritt ändern soll."
          default: 5
          selector:
            number:
              min: 1
              max: 50
              unit_of_measurement: "x"
              mode: slider
        input_transition_2:
          name: "Übergangsdauer"
          description: "Bestimme, wie lange der Übergang zwischen Änderungen dauern soll."
          default: 200
          selector:
            number:
              min: 0
              max: 5000
              unit_of_measurement: "ms"
              mode: slider

    group_single_click_2:
      name: "Einfacher Tastendruck"
      icon: "mdi:gesture-tap"
      collapsed: true
      input:
        input_click_mode_2:
          {
            name: "Druck-Modus",
            description: "Wähle zwischen einer einzelnen Aktion oder dem Durchwechseln von Szenen.",
            default: "action",
            selector:
              {
                select:
                  {
                    mode: dropdown,
                    options:
                      [
                        { label: "Einzelne Aktion ausführen", value: "action" },
