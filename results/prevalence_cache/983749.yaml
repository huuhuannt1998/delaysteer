            select:
              mode: dropdown
              options:
                - { label: "Helligkeit", value: "brightness" }
                - { label: "Farbton", value: "hs_color" }
                - { label: "Farbtemperatur", value: "temp_kelvin" }
        input_sens_3:
          name: "Multiplikator"
          description: "Bestimme, wie stark sich der Wert bei jedem Scroll-Schritt ändern soll."
          default: 5
          selector:
            number:
              min: 1
              max: 50
              unit_of_measurement: "x"
              mode: slider
        input_transition_3:
          name: "Übergangsdauer"
          description: "Bestimme, wie lange der Übergang zwischen Änderungen dauern soll."
          default: 200
          selector:
            number:
              min: 0
              max: 5000
              unit_of_measurement: "ms"
              mode: slider

    group_single_click_3:
      name: "Einfacher Tastendruck"
      icon: "mdi:gesture-tap"
      collapsed: true
      input:
        input_click_mode_3:
          {
