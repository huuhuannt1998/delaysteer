condition: []
action:
  - choose:
      - conditions:
          - condition: trigger
            id: knx_playpause
        sequence:
          - if:
              - condition: template
                value_template: "{{trigger.payload == 0}}"
            then:
              - if:
                  - condition: template
                    value_template: "{{stop_instead_of_pause == 0}}"
                then:
                  - action: media_player.media_pause
                    metadata: {}
                    data: {}
                    target:
                      entity_id: "{{ mediaplayer_entity }}"
                else:
                  - action: media_player.media_stop
                    metadata: {}
                    data: {}
                    target:
                      entity_id: "{{ mediaplayer_entity }}"
              - if:
                  - condition: template
                    value_template: "{{send_text_when_paused == true}}"
                then:
                  - action: knx.send
                    data:
                      response: false
                      address: "{{ knx_title_address }}"
                      type: string
                      payload:
                        "{% if (paused_title_text != None) %} {{paused_title_text[:13]}}
                        {% endif %}"
                  - action: knx.send
                    data:
                      response: false
                      address: "{{ knx_artist_address }}"
                      type: string
                      payload:
                        "{% if (paused_artist_text != None) %} {{paused_artist_text[:13]}}
                        {% endif %}"
                  - action: knx.send
                    data:
                      response: false
                      address: "{{ knx_album_address }}"
                      type: string
                      payload:
                        "{% if (paused_album_text != None) %} {{paused_album_text[:13]}}
                        {% endif %}"
            else:
              - if:
                  - condition: template
                    value_template: '{{states(mediaplayer_entity) == "playing"}}'
                  - condition: template
                    value_template: "{{secondary_play_command_nexttrack == true}}"
                then:
                  - action: media_player.media_next_track
                    metadata: {}
                    data: {}
                    target:
                      entity_id: "{{ mediaplayer_entity }}"
                else:
                  - action: media_player.media_play
                    metadata: {}
                    data: {}
                    target:
                      entity_id: "{{ mediaplayer_entity }}"
                  - if:
                      - condition: template
                        value_template: "{{send_text_when_buffering == true}}"
                    then:
                      - action: knx.send
                        data:
                          response: false
                          address: "{{ knx_title_address }}"
                          type: string
                          payload:
                            "{% if (buffering_title_text != None) %} {{buffering_title_text[:13]}}
                            {% endif %}"
                      - action: knx.send
                        data:
                          response: false
                          address: "{{ knx_artist_address }}"
                          type: string
                          payload:
                            "{% if (buffering_artist_text != None) %} {{buffering_artist_text[:13]}}
                            {% endif %}"
                      - action: knx.send
                        data:
                          response: false
                          address: "{{ knx_album_address }}"
                          type: string
                          payload:
                            "{% if (buffering_album_text != None) %} {{buffering_album_text[:13]}}
                            {% endif %}"
      - conditions:
          - condition: trigger
            id: knx_onoff
        sequence:
          - if:
              - condition: template
                value_template: "{{trigger.payload == 0}}"
            then:
              - action: media_player.turn_off
                metadata: {}
                data: {}
                target:
                  entity_id: "{{ mediaplayer_entity }}"
          - if:
              - condition: template
                value_template: "{{send_text_when_turned_off == true}}"
            then:
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_title_address }}"
                  type: string
                  payload:
                    "{% if (turned_off_title_text|length > 13) %} {{turned_off_title_text[:13]}}
                    {% else %} {{turned_off_title_text}} {% endif %}"
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_artist_address }}"
                  type: string
                  payload:
                    "{% if (turned_off_artist_text|length > 13) %} {{turned_off_artist_text[:13]}}
                    {% else %} {{turned_off_artist_text}} {% endif %}"
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_album_address }}"
                  type: string
                  payload:
                    "{% if (turned_off_album_text|length > 13) %} {{turned_off_album_text[:13]}}
                    {% else %} {{turned_off_album_text}} {% endif %}"
            else:
              - action: media_player.turn_on
                metadata: {}
                data: {}
                target:
                  entity_id: "{{ mediaplayer_entity }}"
          - if:
              - condition: template
                value_template: "{{send_text_when_turned_off == true}}"
            then:
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_title_address }}"
                  type: string
                  payload: "{{(state_attr(mediaplayer_entity,'media_title'))[:13]}}"
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_artist_address }}"
                  type: string
                  payload: "{{(state_attr(mediaplayer_entity,'media_artist'))[:13]}}"
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_album_address }}"
                  type: string
                  payload: "{{(state_attr(mediaplayer_entity,'media_album_name'))[:13]}}"
      - conditions:
          - condition: trigger
            id: knx_forwardbackward
        sequence:
          - if:
              - condition: template
                value_template: "{{trigger.payload == 0}}"
            then:
              - action: media_player.media_previous_track
                metadata: {}
                data: {}
                target:
                  entity_id: "{{ mediaplayer_entity }}"
            else:
              - action: media_player.media_next_track
                metadata: {}
                data: {}
                target:
                  entity_id: "{{ mediaplayer_entity }}"
      - conditions:
          - condition: trigger
            id: knx_mute
        sequence:
          - action: media_player.volume_mute
            metadata: {}
            data:
              is_volume_muted: "{{trigger.payload == 1}}"
            target:
              entity_id: "{{ mediaplayer_entity }}"
      - conditions:
          - condition: trigger
            id: knx_volume
        sequence:
          - action: media_player.volume_set
            target:
              entity_id: "{{ mediaplayer_entity }}"
            data:
              volume_level: "{{trigger.value * 0.01 |float}}"
      - conditions:
          - condition: trigger
            id: knx_volume_step
        sequence:
          - action: media_player.volume_set
            target:
              entity_id: "{{ mediaplayer_entity }}"
            data:
              volume_level:
                "{% if (knx_volume_step_up_value)|float == trigger.payload %}\n
                \ {{(state_attr(mediaplayer_entity,'volume_level') + ((knx_volume_step_size*
                0.01) |float))|float}}\n{% else %}\n  {{(state_attr(mediaplayer_entity,'volume_level')
                - ((knx_volume_step_size* 0.01) |float))|float}}\n{% endif %}"
      - conditions:
          - condition: trigger
            id: sonos_volume
        sequence:
          - action: knx.send
            data:
              response: false
              address: "{{ knx_volume_status_address }}"
              type: percent
              payload: "{{state_attr(mediaplayer_entity,'volume_level')*100}}"
      - conditions:
          - condition: trigger
            id: sonos_state
        sequence:
          - action: knx.send
            data:
              response: false
              address: "{{ knx_playpause_status_address }}"
              payload:
                "{% if states(mediaplayer_entity) == \"playing\" %}\n1 \n{% else
                %}\n0\n{% endif %}"
          - action: knx.send
            data:
              response: false
              address: "{{ knx_onoff_status_address }}"
              payload:
                "{% if states(mediaplayer_entity) == \"off\" %}\n0 \n{% else %}\n1\n{%
                endif %}"
          - if:
              - condition: template
                value_template:
                  '{{send_text_when_paused == true and (states(mediaplayer_entity)
                  != "playing")}}'
            then:
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_title_address }}"
                  type: string
                  payload:
                    "{% if (paused_title_text != None) %} {{paused_title_text[:13]}}
                    {% endif %}"
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_artist_address }}"
                  type: string
                  payload:
                    "{% if (paused_artist_text != None) %} {{paused_artist_text[:13]}}
                    {% endif %}"
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_album_address }}"
                  type: string
                  payload:
                    "{% if (paused_album_text != None) %} {{paused_album_text[:13]}}
                    {% endif %}"
            else:
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_title_address }}"
                  type: string
                  payload: "{{(state_attr(mediaplayer_entity,'media_title'))[:13]}}"
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_artist_address }}"
                  type: string
                  payload: "{{(state_attr(mediaplayer_entity,'media_artist'))[:13]}}"
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_album_address }}"
                  type: string
                  payload: "{{(state_attr(mediaplayer_entity,'media_album_name'))[:13]}}"
      - conditions:
          - condition: trigger
            id: sonos_title
          - condition: template
            value_template:
              "{{ (state_attr(mediaplayer_entity, 'media_title') != none)
              }}"
        sequence:
          - action: knx.send
            data:
              response: false
              address: "{{ knx_title_address }}"
              type: string
              payload: "{{(state_attr(mediaplayer_entity,'media_title'))[:13]}}"
      - conditions:
          - condition: trigger
            id: sonos_album
          - condition: template
            value_template:
              "{{ (state_attr(mediaplayer_entity, 'media_album_name') !=
              none) }}"
        sequence:
          - action: knx.send
            data:
              response: false
              address: "{{ knx_album_address }}"
              type: string
              payload: "{{(state_attr(mediaplayer_entity,'media_album_name'))[:13]}}"
      - conditions:
          - condition: trigger
            id: sonos_artist
          - condition: template
            value_template:
              "{{ (state_attr(mediaplayer_entity, 'media_artist') != none)
              }}"
        sequence:
          - action: knx.send
            data:
              response: false
              address: "{{ knx_artist_address }}"
              type: string
              payload: "{{(state_attr(mediaplayer_entity,'media_artist'))[:13]}}"
      - conditions:
          - condition: trigger
            id: sonos_muted
        sequence:
          - action: knx.send
            data:
              response: false
              address: "{{ knx_mute_status_address }}"
              payload: "{{(state_attr(mediaplayer_entity,'is_volume_muted'))}}"
      - conditions:
          - condition: trigger
            id: knx_scenes
          - condition: template
            value_template:
              "{% set a = knx_scene_numbers %}\n{% set b = trigger.payload
              %}\n{% set result = namespace(value=false) %}\n{% for item in a %}\n  {% if
              (b[0]+1) == item %} {% set result.value = true %} {% endif %}\n{% endfor %}\n{{result.value}}"
        sequence:
          - variables:
              scene_action:
                "{% set a = knx_scene_numbers %}\n{% set b = trigger.payload
                %}\n{% set result = namespace(value=false) %}\n{% set counter = namespace(value=0)
                %}\n{% for item in a %}\n  {% if (b[0]+1) == item %} {% set result.value
                = counter.value %} {% else %} {% set counter.value = counter.value +1 %}
                {% endif %}\n{% endfor %}\n{{scene_number_actions[result.value]|string}}"
          - if:
              - condition: template
                value_template: "{{send_text_when_buffering == true}}"
            then:
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_title_address }}"
                  type: string
                  payload:
                    "{% if (buffering_title_text != None) %} {{buffering_title_text[:13]}}
                    {% endif %}"
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_artist_address }}"
                  type: string
                  payload:
                    "{% if (buffering_artist_text != None) %} {{buffering_artist_text[:13]}}
                    {% endif %}"
              - action: knx.send
                data:
                  response: false
                  address: "{{ knx_album_address }}"
                  type: string
                  payload:
                    "{% if (buffering_album_text != None) %} {{buffering_album_text[:13]}}
                    {% endif %}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{scenes_mediaplayer_type == 'Music-Assistant'}}"
                sequence:
                  - action: music_assistant.play_media
                    target:
                      entity_id: "{{ mediaplayer_entity }}"
                    data:
                      media_id: "{{scene_action}}"
                  - action: knx.send
                    data:
                      response: false
                      address: "{{ knx_volume_status_address }}"
                      type: percent
                      payload: "{{state_attr(mediaplayer_entity,'volume_level')*100}}"
              - conditions:
                  - condition: template
                    value_template: "{{scenes_mediaplayer_type == 'Squeezebox'}}"
                sequence:
                  - action: squeezebox.call_method
                    target:
                      entity_id: "{{ mediaplayer_entity }}"
                    data:
                      command: favorites
                      parameters: "{{['playlist', 'play', 'item_id:'+scene_action]}}"
              - conditions:
                  - condition: template
                    value_template: "{{scenes_mediaplayer_type == 'Denon Home'}}"
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ mediaplayer_entity }}"
                    data:
                      media_content_type: favorite
                      media_content_id: "{{scene_action}}"
            default:
              - action: media_player.select_source
                target:
                  entity_id: "{{ mediaplayer_entity }}"
                data:
                  source: "{{scene_action}}"
          - if:
              - condition: template
                value_template:
                  "{% set a = knx_scene_numbers %}\n{% set b = trigger.payload
                  %}\n{% set result = namespace(value=false) %}\n{% set counter = namespace(value=0)
                  %}\n{% for item in a %}\n  {% if (b[0]+1) == item %} {% set result.value
                  = counter.value %} {% else %} {% set counter.value = counter.value +1 %}
                  {% endif %}\n{% endfor %}\n{{scene_number_volume[result.value] <= 100}}"
            then:
              - action: media_player.volume_set
                target:
                  entity_id: "{{ mediaplayer_entity }}"
                data:
                  volume_level:
                    "{% set a = knx_scene_numbers %}\n{% set b = trigger.payload
                    %}\n{% set result = namespace(value=false) %}\n{% set counter = namespace(value=0)
                    %}\n{% for item in a %}\n  {% if (b[0]+1) == item %} {% set result.value
                    = counter.value %} {% else %} {% set counter.value = counter.value +1
                    %} {% endif %}\n{% endfor %}\n{{scene_number_volume[result.value]*0.01
                    |float}}"
      - conditions:
          - condition: trigger
            id: knx_relative
          - condition: template
            value_template: "{{ not not relative_helper_entity }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.payload == 0  or trigger.payload == 8 }}"
                sequence:
                  - service: input_boolean.turn_on
                    data: {}
                    target:
                      entity_id: !input __relative_helper_entity
              - conditions:
                  - condition: template
                    value_template: "{{ 9 <= trigger.payload <= 15 }}"
                sequence:
                  - service: input_boolean.turn_off
                    data: {}
                    target:
                      entity_id: !input __relative_helper_entity
                  - repeat:
                      while:
                        - condition: state
                          entity_id: !input __relative_helper_entity
                          state: "off"
                        - condition: template
                          value_template: "{{ repeat.index <= dimm_steps }}"
                      sequence:
                        - action: media_player.volume_set
                          target:
                            entity_id: "{{ mediaplayer_entity }}"
                          data:
                            volume_level:
                              "{{(state_attr(mediaplayer_entity,'volume_level')
                              + ((dimm_step* 0.01) |float))|float}}"
                        - delay:
                            milliseconds: "{{ dimm_delay |float }}"
              - conditions:
                  - condition: template
                    value_template: "{{ 1 <= trigger.payload <= 7 }}"
                sequence:
                  - service: input_boolean.turn_off
                    data: {}
                    target:
                      entity_id: !input __relative_helper_entity
                  - repeat:
                      while:
                        - condition: state
                          entity_id: !input __relative_helper_entity
                          state: "off"
                        - condition: template
                          value_template: "{{ repeat.index <= dimm_steps }}"
                      sequence:
                        - action: media_player.volume_set
                          target:
                            entity_id: "{{ mediaplayer_entity }}"
                          data:
                            volume_level:
                              "{{(state_attr(mediaplayer_entity,'volume_level')
                              - ((dimm_step* 0.01) |float))|float}}"
                        - delay:
                            milliseconds: "{{ dimm_delay |float }}"
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: knx_scene1
              - condition: trigger
                id: knx_scene2
              - condition: trigger
                id: knx_scene3
              - condition: trigger
                id: knx_scene4
              - condition: trigger
                id: knx_scene5
              - condition: trigger
                id: knx_scene6
              - condition: trigger
                id: knx_scene7
        sequence:
          - if:
              - condition: template
                value_template: "{{trigger.payload == 0}}"
            then:
              - if:
                  - condition: template
                    value_template: "{{stop_instead_of_pause == 0}}"
                then:
                  - action: media_player.media_pause
                    metadata: {}
                    data: {}
                    target:
                      entity_id: "{{ mediaplayer_entity }}"
                else:
                  - action: media_player.media_stop
                    metadata: {}
                    data: {}
                    target:
                      entity_id: "{{ mediaplayer_entity }}"
            else:
              - variables:
                  scene_action: "{{scene_number_actions[(trigger.id [-1] |int)-1]|string}}"
              - if:
                  - condition: template
                    value_template: "{{send_text_when_buffering == true}}"
                then:
                  - action: knx.send
                    data:
                      response: false
                      address: "{{ knx_title_address }}"
                      type: string
                      payload:
                        "{% if (buffering_title_text != None) %} {{buffering_title_text[:13]}}
                        {% endif %}"
                  - action: knx.send
                    data:
                      response: false
                      address: "{{ knx_artist_address }}"
                      type: string
                      payload:
                        "{% if (buffering_artist_text != None) %} {{buffering_artist_text[:13]}}
                        {% endif %}"
                  - action: knx.send
                    data:
                      response: false
                      address: "{{ knx_album_address }}"
                      type: string
                      payload:
                        "{% if (buffering_album_text != None) %} {{buffering_album_text[:13]}}
                        {% endif %}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{scenes_mediaplayer_type == 'Music-Assistant'}}"
                    sequence:
                      - action: music_assistant.play_media
                        target:
                          entity_id: "{{ mediaplayer_entity }}"
                        data:
                          media_id: "{{scene_action}}"
                      - action: knx.send
                        data:
                          response: false
                          address: "{{ knx_volume_status_address }}"
                          type: percent
                          payload: "{{state_attr(mediaplayer_entity,'volume_level')*100}}"
                  - conditions:
                      - condition: template
                        value_template: "{{scenes_mediaplayer_type == 'Squeezebox'}}"
                    sequence:
                      - action: squeezebox.call_method
                        target:
                          entity_id: "{{ mediaplayer_entity }}"
                        data:
                          command: favorites
                          parameters: "{{['playlist', 'play', 'item_id:'+scene_action]}}"
                  - conditions:
                      - condition: template
                        value_template: "{{scenes_mediaplayer_type == 'Denon Home'}}"
                    sequence:
                      - action: media_player.play_media
                        target:
                          entity_id: "{{ mediaplayer_entity }}"
                        data:
                          media_content_type: favorite
                          media_content_id: "{{scene_action}}"
                default:
                  - action: media_player.select_source
                    target:
                      entity_id: "{{ mediaplayer_entity }}"
                    data:
                      source: "{{scene_action}}"
              - if:
                  - condition: template
                    value_template: "{{scene_number_volume[(trigger.id [-1] |int)-1] <= 100}}"
                then:
                  - action: media_player.volume_set
                    target:
                      entity_id: "{{ mediaplayer_entity }}"
                    data:
                      volume_level: "{{scene_number_volume[(trigger.id [-1] |int)-1]*0.01|float}}"
      - conditions:
          - condition: trigger
            id: knx_read_playpause_status
        sequence:
          - action: knx.send
            data:
              response: true
              address: "{{ knx_playpause_status_address }}"
              payload:
                "{% if states(mediaplayer_entity) == \"playing\" %}\n1 \n{% else
                %}\n0\n{% endif %}"
      - conditions:
