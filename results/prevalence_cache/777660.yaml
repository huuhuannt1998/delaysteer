blueprint:
  name: KNX - Mediaplayer Control
  description:
    Use KNX to control a media player entity. Including Feedback from the
    media player to KNX - V1.4.3
  author: torbenledermann
  homeassistant:
    min_version: 2024.6.0
  domain: automation
  input:
    __mediaplayer_entity:
      name: Mediaplayer
      description: The Media player entity, that should be controlled
      selector:
        entity:
          filter:
            - domain:
                - media_player
          multiple: false
          reorder: false
    playback controls:
      collapsed: true
      name: Playback Controls
      input:
        __knx_playpause_address:
          name: Play/Pause Group Address
          description:
            "[DPT 1.xx] - The Value 1 triggers the Play action. The Value
            0 triggers the Pause action"
          default:
        __secondary_play_command_nexttrack:
          name: Next Track if music is already playing
          description:
            If the music is already playing and a telegram with the value
            1 and the group address of Play/Pause is beeing send, the next track is
            beeing played
          selector:
            boolean: {}
          default: false
        __stop_instead_of_pause:
          name: Stop instead of pause
          description: Use the stop command instead of the pause Command
          selector:
            boolean: {}
          default: false
        __knx_playpause_status_address:
          name: Play/Pause Status Group Address
          description: "[DPT 1.xx]"
          default:
        __knx_onoff_address:
          name: On/Off Group Address
          description:
            "[DPT 1.xx] - Some media players use cant use the play pause
            action. There you have to use the On/Off Action"
          default:
        __knx_onoff_status_address:
          name: On/Off Status Group Address
          description: "[DPT 1.xx]"
          default:
        __knx_forwardbackward_address:
          name: Forward/Backward Group Address
          description:
            "[DPT 1.xx] - The Value 1 triggers the Forward action. The
            Value 0 triggers the Backward action"
          default:
    volume:
      collapsed: true
      name: Volume Control
      input:
        __knx_volume_address:
          name: Volume Control Group Address
          description:
            "[DPT 5.001 Percent] - The group address to control the volume
            in percent"
          default:
        __knx_volume_step_address:
          name: Volume Step Control Group Address
          description:
            "[DPT 1.xxx] - The group address to control the volume in stepwise
            via a 1bit object"
          default:
        __knx_volume_step_up_value:
          name: Turn Up - Value
          description: Define which Value turns up the volume
          selector:
            select:
              options:
                - "1"
                - "0"
              sort: false
              custom_value: false
              multiple: false
          default: "1"
        __knx_volume_step_size:
          name: Volume Group Address
          description:
            Define how much the volume should be turned up ord down with
            each step
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 1.0
              mode: slider
          default: 5.0
        __knx_volume_status_address:
          name: Volume Status Group Address
          description: "[DPT 5.001 Percent]"
          default:
        __knx_mute_address:
          name: Mute Group Address
          description: "[DPT 1.xx] - The Value 1 triggers the Mute action."
          default:
        __knx_mute_status_address:
          name: Mute Status Group Address
          description: "[DPT 1.xx]"
          default:
    relative_volume:
      collapsed: true
      name: Relative Volume Control [Dimming]
      description:
        Kudos to @kalhimeo for his 'KNX - Light entities control' Blueprint
        from which I inherited the code for relative dimming
      input:
        __relative_helper_entity:
          name: Helper for relative volume control
          description:
            If you intend to use the relative Volume control, it is necessary
            to manually create a 'toggle helper' specificly for this automation (don't
            change if unused)
          selector:
            entity:
              domain:
                - input_boolean
              multiple: false
              reorder: false
          default: {}
        __knx_relative_address:
          name: Relative Volume Control Group Address
          description: "[DPT 3.xx]"
          default:
        __dimm_time:
          name: Dimm time
          description: Define how long it should take to go from 0% to 100%.
          selector:
            number:
              min: 1.0
              max: 40.0
              step: 0.1
              unit_of_measurement: seconds
              mode: slider
          default: 15
        __dimm_steps:
          name: Dimm steps
          description: How many steps should be used to dimm from 0 to 100%.
          selector:
            number:
              min: 2.0
              max: 255.0
              step: 1.0
              unit_of_measurement: steps
              mode: slider
          default: 50
    status:
      collapsed: true
      name: Status
      input:
        __knx_title_address:
          name: Title Group Address
          description:
            "[DPT 16.001 - String ISO8859-1] - Due to limitations with
            the DPT only the first 14 Characters can be displayed"
          default:
        __knx_artist_address:
          name: Artist Group Address
          description:
            "[DPT 16.001 - String ISO8859-1] - Due to limitations with
            the DPT only the first 14 Characters can be displayed"
          default:
        __knx_album_address:
          name: Album Group Address
          description:
            "[DPT 16.001 - String ISO8859-1] - Due to limitations with
            the DPT only the first 14 Characters can be displayed"
          default:
        __send_text_when_paused:
          name: Send special text, if paused?
          description: This allows to display a "music paused" state on the device.
          selector:
            boolean: {}
          default: false
        __paused_title_text:
          name: Paused - Title text
          description: Text to display for the title, if paused.
          default:
        __paused_artist_text:
          name: Paused - Artist text
          description: Text to display for the artist, if paused.
          default:
        __paused_album_text:
          name: Paused - Album text
          description: Text to display for the album, if paused.
          default:
        __send_text_when_turned_off:
          name: Send special text, if turned off?
          description: This allows to display a "turned off" state on the device.
          selector:
            boolean: {}
          default: false
        __turned_off_title_text:
          name: Turned Off - Title text
          description: Text to display for the title, if turned off.
          default:
        __turned_off_artist_text:
          name: Turned Off - Artist text
          description: Text to display for the artist, if turned off
          default:
        __turned_off_album_text:
          name: Turned Off - Album text
          description: Text to display for the album, if turned off
          default:
        __send_text_when_buffering:
          name: Send special text, if buffering?
          description:
            This allows to display a "Buffering" state on the device, when
            switching between scenes.
          selector:
            boolean: {}
          default: false
        __buffering_title_text:
          name: Buffering - Title text
          description: Text to display for the title, if buffering.
          default:
        __buffering_artist_text:
          name: Buffering - Artist text
          description: Text to display for the artist, if buffering
          default:
        __buffering_album_text:
          name: Buffering - Album text
          description: Text to display for the album, if buffering
          default:
    scenes:
      name: Scene Control
      description:
        "The Action to be performed with each scene depends on your media
        player. \nFor Sonos you have to add the playlist/radio to your favourites.
        Watch out for typos.\n"
      collapsed: true
      input:
        __knx_scenes_address:
          name: Scenes Group Address
          description: "[DPT 17.001 - Scene Number]"
          default:
        __scenes_mediaplayer_type:
          name: Mediaplayer type
          description: Defines the type of media player used
          selector:
            select:
              options:
                - Standard
                - Music-Assistant
                - Squeezebox
                - Denon Home
              sort: false
              custom_value: false
              multiple: false
          default: Standard
        __knx_scene_number1:
          name: Scenes Number 1
          description: Define which Scene Number shall be reacted to
          selector:
            number:
              min: 1.0
              max: 65.0
              step: 1.0
              mode: slider
          default: 65
        __scene_number1_action:
          name: Scenes Number 1 Action
          description: The Song/Playlist/Radio to be started
          default: ""
        __scene_number1_volume:
          name: Scenes Number 1 Volume
          description:
            Define the Volume that should be set (101 means don't change
            volume)
          selector:
            number:
              min: 1.0
              max: 101.0
              step: 1.0
              mode: slider
          default: 101.0
        __knx_scene1_address_1bit:
          name: Scene 1 Group Address
          description:
            "[DPT 1.001 - Switch] - With a '1' the scene is activated,
            a '0' pauses the music"
          default:
