                          - condition: template
                            value_template: "{{ wait.trigger.event.data.action == alert_action_bypass }}"
                        sequence:
                          - variables:
                              _current_bypass_is_on: >
                                {% set bypass = autoclose_bypass_entity if autoclose_bypass_entity is defined else [] %}
                                {% if bypass | length > 0 %}
                                  {{ bypass | select('string') | map('states') | select('eq', 'on') | list | count > 0 }}
                                {% else %}
                                  false
                                {% endif %}
                          - repeat:
                              for_each: >
                                {{ autoclose_bypass_entity if autoclose_bypass_entity is defined else [] }}
                              sequence:
                                - service: "homeassistant.{{ 'turn_off' if _current_bypass_is_on else 'turn_on' }}"
                                  target:
                                    entity_id: "{{ repeat.item }}"
                      # 🔒 Close Garage Now
                      - conditions:
                          - condition: template
