                        message: "{{ stopped_notification_message }}"
                        title: "{{ stopped_notification_title }}"
                        data:
                          clickAction: "{{ stopped_notification_click_url }}"
                          url: "{{ stopped_notification_click_url }}"
                          tag: "{{ notification_tag }}"
                          color: "{{ stopped_notification_color }}"
                          notification_icon: "mdi:{{ stopped_notification_icon }}"
                          push:
                            interruption-level: "{{ stopped_notification_interruption }}"
                          persistent: "{{ stopped_notification_persistent }}"
                          sticky: "{{ stopped_notification_persistent }}"
                          actions: >
                            {% set ns = namespace(acts=[]) %}
                            {% if _btn_close_now_enabled %}
                              {% set ns.acts = ns.acts + [{'action': stopped_action_close_now, 'title': _btn_close_now_title, 'destructive': true}] %}
                            {% endif %}
                            {% if _btn_custom_enabled %}
                              {% set ns.acts = ns.acts + [{'action': stopped_action_custom, 'title': _btn_custom_title, 'destructive': false}] %}
                            {% endif %}
                            {{ ns.acts }}
              # Wait for stopped notification action tap
              - wait_for_trigger:
                  - platform: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ stopped_action_close_now }}"
                  - platform: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ stopped_action_custom }}"
                timeout:
                  minutes: 10
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ wait.trigger is not none }}"
                then:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ wait.trigger.event.data.action == stopped_action_close_now }}"
                        sequence:
                          - service: cover.close_cover
                            target:
                              entity_id: !input garage_door_entity
                      - conditions:
                          - condition: template
                            value_template: "{{ wait.trigger.event.data.action == stopped_action_custom }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: "{{ stopped_custom_action is defined and stopped_custom_action | length > 0 }}"
                            then:
                              - choose: []
                                default: !input stopped_custom_action
              
              # Execute custom action
              - if:
                  - condition: template
                    value_template: "{{ stopped_custom_action is defined and stopped_custom_action | length > 0 }}"
                then:
                  - choose: []
                    default: !input stopped_custom_action
              
              # Handle repeat notifications if enabled
              - if:
                  - condition: template
                    value_template: "{{ stopped_repeat_notification }}"
                then:
                  - variables:
                      repeat_counter: 0
                  - repeat:
                      while:
                        - condition: template
                          value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) not in ['open', 'opening', 'closed', 'closing'] }}"
                        - condition: template
                          value_template: "{{ stopped_max_repeat_count == 0 or repeat_counter < stopped_max_repeat_count }}"
                      sequence:
                        - delay: "{{ stopped_time_between_repeats }}"
                        - if:
                            - condition: template
                              value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) not in ['open', 'opening', 'closed', 'closing'] }}"
                            - condition: template
                              value_template: "{{ stopped_max_repeat_count == 0 or repeat_counter < stopped_max_repeat_count }}"
                          then:
                            - variables:
                                stopped_rpt_action_close_now: "STOPPED_RPT_CLOSE_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                                stopped_rpt_action_custom: "STOPPED_RPT_CUSTOM_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                            - repeat:
                                for_each: "{{ stopped_notify_devices if stopped_notify_devices is defined else [] }}"
                                sequence:
                                  - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                    data:
                                      message: "{{ stopped_notification_message }}"
                                      title: "{{ stopped_notification_title }}"
                                      data:
                                        clickAction: "{{ stopped_notification_click_url }}"
                                        url: "{{ stopped_notification_click_url }}"
                                        tag: "{{ notification_tag }}"
                                        color: "{{ stopped_notification_color }}"
                                        notification_icon: "mdi:{{ stopped_notification_icon }}"
                                        push:
                                          interruption-level: "{{ stopped_notification_interruption }}"
                                        persistent: "{{ stopped_notification_persistent }}"
                                        sticky: "{{ stopped_notification_persistent }}"
                                        actions: >
                                          {% set ns = namespace(acts=[]) %}
                                          {% if _btn_close_now_enabled %}
                                            {% set ns.acts = ns.acts + [{'action': stopped_rpt_action_close_now, 'title': _btn_close_now_title, 'destructive': true}] %}
                                          {% endif %}
                                          {% if _btn_custom_enabled %}
                                            {% set ns.acts = ns.acts + [{'action': stopped_rpt_action_custom, 'title': _btn_custom_title, 'destructive': false}] %}
                                          {% endif %}
                                          {{ ns.acts }}
                            - wait_for_trigger:
                                - platform: event
                                  event_type: mobile_app_notification_action
                                  event_data:
                                    action: "{{ stopped_rpt_action_close_now }}"
                                - platform: event
                                  event_type: mobile_app_notification_action
                                  event_data:
                                    action: "{{ stopped_rpt_action_custom }}"
                              timeout:
                                minutes: 10
                              continue_on_timeout: true
                            - if:
                                - condition: template
                                  value_template: "{{ wait.trigger is not none }}"
                              then:
                                - choose:
                                    - conditions:
                                        - condition: template
                                          value_template: "{{ wait.trigger.event.data.action == stopped_rpt_action_close_now }}"
                                      sequence:
                                        - service: cover.close_cover
                                          target:
                                            entity_id: !input garage_door_entity
                                    - conditions:
                                        - condition: template
                                          value_template: "{{ wait.trigger.event.data.action == stopped_rpt_action_custom }}"
                                      sequence:
                                        - if:
                                            - condition: template
                                              value_template: "{{ stopped_custom_action is defined and stopped_custom_action | length > 0 }}"
                                          then:
                                            - choose: []
                                              default: !input stopped_custom_action
                            - if:
                                - condition: template
                                  value_template: "{{ stopped_custom_action is defined and stopped_custom_action | length > 0 }}"
                              then:
                                - choose: []
                                  default: !input stopped_custom_action
                        - variables:
                            repeat_counter: "{{ repeat_counter + 1 }}"
          
          # Handle lighting control for STOPPED state
          - if:
              - condition: template
                value_template: "{{ enable_lighting_control }}"
              - condition: template
                value_template: "{{ 'stopped' in lighting_triggers }}"
              - condition: template
                value_template: >
                  {% if lighting_schedule_enabled %}
                    {% set lighting_schedule_days = lighting_schedule_days if lighting_schedule_days is defined else [] %}
                    {% set day_match = current_day in lighting_schedule_days %}
                    {% if day_match %}
                      {% if lighting_schedule_start_time <= lighting_schedule_end_time %}
                        {{ not (current_time >= lighting_schedule_start_time and current_time <= lighting_schedule_end_time) }}
                      {% else %}
                        {{ not (current_time >= lighting_schedule_start_time or current_time <= lighting_schedule_end_time) }}
                      {% endif %}
                    {% else %}
                      true
                    {% endif %}
                  {% else %}
                    true
                  {% endif %}
            then:
              # Debug notification for lighting control
              - if:
                  - condition: template
                    value_template: "{{ debug_enabled }}"
                  - condition: template
                    value_template: >
                      {% if 'all' in debug_trigger_types %}
                        true
                      {% else %}
                        {{ 'lighting' in debug_trigger_types }}
                      {% endif %}
                then:
                  - variables:
