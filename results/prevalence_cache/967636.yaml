                                      message: |
                                        ⚡ Trigger: {{ trigger_time }}
                                        💡 Lights: {{ outdoor_light_entities | length }} light(s)
                                        ⏱️ Timer Duration: {{ outdoor_light_off_timer }} ({{ timer_seconds }}s)
                                        ℹ️ mode:restart means any new trigger resets this timer
                                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
                              
                              - delay:
                                  seconds: "{{ timer_seconds }}"
                              
