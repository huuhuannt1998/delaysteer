                  {% else %}
                    true
                  {% endif %}
            then:
              # Turn outdoor lights on with specified settings
              - if:
                  - condition: template
                    value_template: "{{ outdoor_light_entities is defined and outdoor_light_entities | length > 0 }}"
                then:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ outdoor_light_entities }}"
                    data:
                      brightness_pct: "{{ outdoor_light_brightness }}"
                      color_temp_kelvin: "{{ outdoor_light_color_temp }}"
                  
                  # Execute custom outdoor lighting action
                  - if:
                      - condition: template
                        value_template: "{{ outdoor_lighting_custom_action is defined and outdoor_lighting_custom_action | length > 0 }}"
                    then:
                      - choose: []
                        default: !input outdoor_lighting_custom_action

                  # Outdoor Light Off Timer - inline so mode:restart resets it on every new trigger
                  - variables:
                      timer_seconds: >
                        {% set timer = outdoor_light_off_timer if outdoor_light_off_timer is defined else {} %}
                        {{ timer.hours|default(0) * 3600 + timer.minutes|default(0) * 60 + timer.seconds|default(0) + timer.days|default(0) * 86400 }}
                  
                  - if:
                      - condition: template
                        value_template: "{{ timer_seconds > 0 }}"
                    then:
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ outdoor_lighting_bypass_timer_enabled }}"
                              - condition: template
                                value_template: >
                                  {% if outdoor_lighting_bypass_timer_entity is defined and outdoor_lighting_bypass_timer_entity %}
                                    {{ outdoor_lighting_bypass_timer_entity | select('string') | map('states') | select('eq', 'on') | list | count > 0 }}
                                  {% else %}
                                    false
                                  {% endif %}
                            sequence:
                              - if:
                                  - condition: template
                                    value_template: "{{ debug_enabled }}"
                                then:
                                  - service: persistent_notification.create
                                    data:
                                      title: "🐛 {{ automation_friendly_name }} - Outdoor Light Off Timer BYPASSED (OPEN)"
                                      message: |
                                        ⏱️ Timer Bypassed: Yes (bypass condition is true)
                                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
                        default:
                          - delay:
                              seconds: "{{ timer_seconds }}"
                          - service: light.turn_off
                            target:
                              entity_id: "{{ outdoor_light_entities }}"
                          - if:
                              - condition: template
                                value_template: "{{ debug_enabled }}"
                            then:
                              - service: persistent_notification.create
                                data:
                                  title: "🐛 {{ automation_friendly_name }} - Outdoor Lights OFF Timer Expired (OPEN)"
                                  message: |
                                    ⏱️ Timer expired with no new trigger - outdoor lights off
                                  notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
          
          # Handle Auto-Close Default
          - if:
              - condition: template
                value_template: "{{ autoclose_default_enabled }}"
              - condition: template
                value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'open' }}"
            then:
              # Debug notification for auto-close
              - if:
                  - condition: template
                    value_template: "{{ debug_enabled }}"
                  - condition: template
                    value_template: >
                      {% if 'all' in debug_trigger_types %}
                        true
                      {% else %}
                        {{ 'door_states' in debug_trigger_types }}
                      {% endif %}
                then:
                  - variables:
                      action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                  - service: persistent_notification.create
                    data:
                      title: "🐛 {{ automation_friendly_name }} - Auto-Close Started"
                      message: |
                        ⚡ Trigger: {{ trigger_time }}
                        🕒 Start Time: {{ action_time }}
                        🚪 Door: {{ friendly_name }}
                        ⏱️ Close Delay: {{ autoclose_default_delay }}
                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
              
              - if:
                  - condition: template
                    value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'open' }}"
                  - condition: template
                    value_template: >
                      {% set bypass = autoclose_bypass_entity if autoclose_bypass_entity is defined else [] %}
                      {% if bypass | length > 0 %}
                        {{ not (bypass | select('string') | map('states') | select('eq', 'on') | list | count > 0) }}
                      {% else %}
                        true
                      {% endif %}
                then:
                  # Debug notification for auto-close action
                  - if:
                      - condition: template
                        value_template: "{{ debug_enabled }}"
                      - condition: template
                        value_template: >
                          {% if 'all' in debug_trigger_types %}
                            true
                          {% else %}
                            {{ 'door_states' in debug_trigger_types }}
                          {% endif %}
                    then:
                      - variables:
                          action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                      - service: persistent_notification.create
                        data:
                          title: "🐛 {{ automation_friendly_name }} - Auto-Close Executing"
                          message: |
                            ⚡ Trigger: {{ trigger_time }}
                            🕒 Close Time: {{ action_time }}
                            🚪 Door: {{ friendly_name }}
                            📊 Door State: {{ states(garage_door_entity) }}
                          notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
                  
                  - service: cover.close_cover
                    target:
                      entity_id: !input garage_door_entity

      # Handle AUTO-CLOSE NOTIFICATION trigger
      - conditions:
          - condition: trigger
            id: trigger_autoclose_notify
        sequence:
          - variables:
              trigger_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
              friendly_name: "{{ open_friendly_name }}"
              autoclose_notify_tag: "garage-autoclose-notify-{{ garage_door_entity }}"

          # Only proceed if auto-close is enabled, notifications are enabled, door is still open, and bypass is not active
          - if:
              - condition: template
                value_template: "{{ autoclose_default_enabled }}"
              - condition: template
                value_template: "{{ autoclose_notify_enabled }}"
              - condition: template
                value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'open' }}"
              - condition: template
                value_template: >
                  {% set bypass = autoclose_bypass_entity if autoclose_bypass_entity is defined else [] %}
                  {% if bypass | length > 0 %}
                    {{ not (bypass | select('string') | map('states') | select('eq', 'on') | list | count > 0) }}
                  {% else %}
                    true
                  {% endif %}
            then:
              # Debug notification for auto-close warning
              - if:
                  - condition: template
                    value_template: "{{ debug_enabled }}"
                  - condition: template
                    value_template: >
                      {% if 'all' in debug_trigger_types %}
                        true
                      {% else %}
                        {{ 'door_states' in debug_trigger_types }}
                      {% endif %}
                then:
                  - variables:
                      action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                  - service: persistent_notification.create
                    data:
                      title: "🐛 {{ automation_friendly_name }} - Auto-Close Notification Sending"
                      message: |
                        ⚡ Trigger: {{ trigger_time }}
                        🕒 Notify Time: {{ action_time }}
                        🚪 Door: {{ friendly_name }}
                        📱 Devices: {{ autoclose_notify_devices | length }} device(s)
                        🛡️ Bypass Entity: {{ autoclose_bypass_entity }}
                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"

              # Build a unique action ID for this firing so we can match the response
              - variables:
                  autoclose_action_id: "AUTOCLOSE_BYPASS_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"

              # Send auto-close warning notification with "Keep Open" action button to all selected devices
              - repeat:
                  for_each: "{{ autoclose_notify_devices if autoclose_notify_devices is defined else [] }}"
                  sequence:
                    - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                      data:
                        message: "{{ autoclose_notify_message }}"
                        title: "{{ autoclose_notify_title }}"
                        data:
                          clickAction: "{{ autoclose_notify_click_url }}"
                          url: "{{ autoclose_notify_click_url }}"
                          tag: "{{ autoclose_notify_tag }}"
                          color: "{{ autoclose_notify_color }}"
                          notification_icon: "mdi:{{ autoclose_notify_icon }}"
                          push:
                            interruption-level: "{{ autoclose_notify_interruption }}"
                          persistent: "{{ autoclose_notify_persistent }}"
                          sticky: "{{ autoclose_notify_persistent }}"
                          actions:
                            - action: "{{ autoclose_action_id }}"
                              title: "🛡️ Keep Open (Enable Bypass)"
                              destructive: false

              # Wait for the user to tap "Keep Open" until the door is no longer open
              - wait_for_trigger:
                  - platform: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ autoclose_action_id }}"
                timeout:
                  # Wait until just before the auto-close fires (remaining time = autoclose_delay - notify_delay)
                  # We use the full autoclose delay as a safe upper bound so the wait always expires cleanly
                  seconds: >
                    {% set ac = autoclose_default_delay if autoclose_default_delay is defined else {} %}
                    {% set an = autoclose_notify_delay if autoclose_notify_delay is defined else {} %}
                    {% set ac_sec = ac.days|default(0)*86400 + ac.hours|default(0)*3600 + ac.minutes|default(0)*60 + ac.seconds|default(0) %}
                    {% set an_sec = an.days|default(0)*86400 + an.hours|default(0)*3600 + an.minutes|default(0)*60 + an.seconds|default(0) %}
                    {% set remaining = ac_sec - an_sec %}
                    {{ [remaining, 10] | max }}
                continue_on_timeout: true

              # If the user tapped "Keep Open" — turn on each bypass entity
              - if:
                  - condition: template
                    value_template: "{{ wait.trigger is not none }}"
                  - condition: template
                    value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'open' }}"
                then:
                  # Debug notification for bypass being enabled
                  - if:
                      - condition: template
                        value_template: "{{ debug_enabled }}"
                    then:
                      - variables:
                          action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                      - service: persistent_notification.create
                        data:
                          title: "🐛 {{ automation_friendly_name }} - Auto-Close Bypass Activated by User"
                          message: |
                            ⚡ Trigger: {{ trigger_time }}
                            🕒 Action Time: {{ action_time }}
                            🚪 Door: {{ friendly_name }}
                            🛡️ Enabling Bypass: {{ autoclose_bypass_entity }}
                          notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"

                  # Turn ON every entity in the bypass list
                  - repeat:
                      for_each: "{{ autoclose_bypass_entity if autoclose_bypass_entity is defined else [] }}"
                      sequence:
                        - service: homeassistant.turn_on
                          target:
                            entity_id: "{{ repeat.item }}"

                  # Dismiss the notification on all devices now that bypass is active
                  - repeat:
                      for_each: "{{ autoclose_notify_devices if autoclose_notify_devices is defined else [] }}"
                      sequence:
                        - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                          data:
                            message: "clear_notification"
                            data:
                              tag: "{{ autoclose_notify_tag }}"

      # Handle OPENING trigger
      - conditions:
          - condition: trigger
            id: trigger_opening
        sequence:
          # Capture trigger time at the beginning of the sequence
          - variables:
              trigger_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
          
          # Debug notification
          - if:
              - condition: template
                value_template: "{{ debug_enabled }}"
              - condition: template
                value_template: >
                  {% if 'all' in debug_trigger_types %}
                    true
                  {% else %}
                    {{ 'door_states' in debug_trigger_types }}
                  {% endif %}
            then:
              - variables:
                  action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
              - service: persistent_notification.create
                data:
                  title: "🐛 {{ automation_friendly_name }} - OPENING Triggered"
                  message: |
                    ⚡ Trigger: {{ trigger_time }}
                    🕒 Action Start: {{ action_time }}
                    🚪 Door Entity: {{ garage_door_entity }}
                    📊 Door State: {{ states(garage_door_entity) if states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] else 'unavailable' }}
                    {% if debug_include_variables %}
                    📋 Variables:
                      - enable_opening_notification: {{ enable_opening_notification }}
                      - opening_friendly_name: {{ opening_friendly_name }}
                    {% endif %}
                  notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
          
          - variables:
              friendly_name: "{{ opening_friendly_name }}"
              notification_tag: "garage-opening-{{ garage_door_entity }}"
              current_day: "{{ now().strftime('%a').lower() }}"
              current_time: "{{ now().strftime('%H:%M:%S') }}"
          
          # Check if opening notifications are enabled and conditions met
          - if:
              - condition: template
                value_template: "{{ enable_opening_notification }}"
              - condition: template
                value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'opening' }}"
              - condition: template
                value_template: >
                  {% set opening_bypass_entities = opening_bypass_entities if opening_bypass_entities is defined else [] %}
                  {% if opening_bypass_entities | length > 0 %}
                    {{ not (opening_bypass_entities | select('string') | map('states') | select('eq', 'on') | list | count > 0) }}
                  {% else %}
                    true
                  {% endif %}
            then:
              # Debug notification for sending opening notifications
              - if:
                  - condition: template
                    value_template: "{{ debug_enabled }}"
                  - condition: template
                    value_template: >
                      {% if 'all' in debug_trigger_types %}
                        true
                      {% else %}
                        {{ 'door_states' in debug_trigger_types }}
                      {% endif %}
                then:
                  - variables:
                      action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                  - service: persistent_notification.create
                    data:
                      title: "🐛 {{ automation_friendly_name }} - Sending OPENING Notifications"
                      message: |
                        ⚡ Trigger: {{ trigger_time }}
                        🕒 Notification Time: {{ action_time }}
                        🚪 Door: {{ friendly_name }}
                        📱 Devices: {{ opening_notify_devices | length }} device(s)
                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
              
              # OPENING - Send notifications to all selected devices
              - repeat:
                  for_each: "{{ opening_notify_devices if opening_notify_devices is defined else [] }}"
                  sequence:
                    - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                      data:
                        message: "{{ opening_notification_message }}"
                        title: "{{ opening_notification_title }}"
                        data:
                          clickAction: "{{ opening_notification_click_url }}"
                          url: "{{ opening_notification_click_url }}"
                          tag: "{{ notification_tag }}"
                          color: "{{ opening_notification_color }}"
                          notification_icon: "mdi:{{ opening_notification_icon }}"
                          push:
                            interruption-level: "{{ opening_notification_interruption }}"
                          persistent: "{{ opening_notification_persistent }}"
                          sticky: "{{ opening_notification_persistent }}"
              
              # Execute custom action
              - if:
                  - condition: template
                    value_template: "{{ opening_custom_action is defined and opening_custom_action | length > 0 }}"
                then:
                  - choose: []
                    default: !input opening_custom_action
              
              # Handle repeat notifications if enabled
              - if:
                  - condition: template
                    value_template: "{{ opening_repeat_notification }}"
                then:
                  - variables:
                      repeat_counter: 0
                  - repeat:
                      while:
                        - condition: template
                          value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'opening' }}"
                        - condition: template
                          value_template: "{{ opening_max_repeat_count == 0 or repeat_counter < opening_max_repeat_count }}"
                      sequence:
                        - delay: "{{ opening_time_between_repeats }}"
                        - if:
                            - condition: template
                              value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'opening' }}"
                            - condition: template
                              value_template: "{{ opening_max_repeat_count == 0 or repeat_counter < opening_max_repeat_count }}"
                          then:
                            - repeat:
                                for_each: "{{ opening_notify_devices if opening_notify_devices is defined else [] }}"
                                sequence:
                                  - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                    data:
                                      message: "{{ opening_notification_message }}"
                                      title: "{{ opening_notification_title }}"
                                      data:
                                        clickAction: "{{ opening_notification_click_url }}"
                                        url: "{{ opening_notification_click_url }}"
                                        tag: "{{ notification_tag }}"
                                        color: "{{ opening_notification_color }}"
                                        notification_icon: "mdi:{{ opening_notification_icon }}"
                                        push:
                                          interruption-level: "{{ opening_notification_interruption }}"
                                        persistent: "{{ opening_notification_persistent }}"
                                        sticky: "{{ opening_notification_persistent }}"
                            - if:
                                - condition: template
                                  value_template: "{{ opening_custom_action is defined and opening_custom_action | length > 0 }}"
                              then:
                                - choose: []
                                  default: !input opening_custom_action
                        - variables:
                            repeat_counter: "{{ repeat_counter + 1 }}"
          
          # Handle alert notification for OPENING based on conditions
          - if:
              - condition: template
                value_template: "{{ alert_enable_notification }}"
              - condition: or
                conditions:
                  # Schedule condition
                  - condition: and
                    conditions:
                      - condition: template
                        value_template: "{{ alert_enable_schedule }}"
                      - condition: template
                        value_template: >
                          {% set alert_days = alert_days if alert_days is defined else [] %}
                          {{ current_day in alert_days }}
                      - condition: template
                        value_template: >
                          {% if alert_start_time <= alert_end_time %}
                            {{ current_time >= alert_start_time and current_time <= alert_end_time }}
                          {% else %}
                            {{ current_time >= alert_start_time or current_time <= alert_end_time }}
                          {% endif %}
                  # Entity condition
                  - condition: and
                    conditions:
                      - condition: template
                        value_template: "{{ alert_enable_entity }}"
                      - condition: template
                        value_template: "{{ alert_entity != '' }}"
                      - condition: template
                        value_template: >
                          {% if alert_enable_entity and alert_entity != '' and alert_entity_states != '' %}
                            {% set states_list = alert_entity_states.split(',') | map('trim') | list %}
                            {% if states(alert_entity) not in ['unavailable', 'unknown', 'none'] %}
                              {{ states(alert_entity) in states_list }}
                            {% else %}
                              false
                            {% endif %}
                          {% else %}
                            false
                          {% endif %}
            then:
              # Debug notification for alert
              - if:
                  - condition: template
                    value_template: "{{ debug_enabled }}"
                  - condition: template
                    value_template: >
                      {% if 'all' in debug_trigger_types %}
                        true
                      {% else %}
                        {{ 'alerts' in debug_trigger_types }}
                      {% endif %}
                then:
                  - variables:
                      action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                  - service: persistent_notification.create
                    data:
                      title: "🐛 {{ automation_friendly_name }} - Sending ALERT Notifications (Opening)"
                      message: |
                        ⚡ Trigger: {{ trigger_time }}
                        🕒 Alert Time: {{ action_time }}
                        🚪 Door: {{ friendly_name }}
                        📅 Schedule Match: {{ alert_enable_schedule and current_day in alert_days and ((alert_start_time <= alert_end_time and current_time >= alert_start_time and current_time <= alert_end_time) or (alert_start_time > alert_end_time and (current_time >= alert_start_time or current_time <= alert_end_time))) }}
                        ⚙️ Entity Match: {{ alert_enable_entity and alert_entity != '' and (states(alert_entity) in alert_entity_states.split(',')) if states(alert_entity) not in ['unavailable', 'unknown', 'none'] else false }}
                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
              
              # Send alert notifications to all selected devices
              - repeat:
                  for_each: "{{ alert_notify_devices if alert_notify_devices is defined else [] }}"
                  sequence:
                    - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                      data:
                        message: "{{ alert_notification_message }}"
                        title: "{{ alert_notification_title }}"
                        data:
                          clickAction: "{{ alert_notification_click_url }}"
                          url: "{{ alert_notification_click_url }}"
                          tag: "garage-alert-{{ garage_door_entity }}"
                          color: "{{ alert_notification_color }}"
                          notification_icon: "mdi:{{ alert_notification_icon }}"
                          push:
                            interruption-level: "{{ alert_notification_interruption }}"
                          persistent: "{{ alert_notification_persistent }}"
                          sticky: "{{ alert_notification_persistent }}"
              
              # Execute alert custom action
              - if:
                  - condition: template
                    value_template: "{{ alert_custom_action is defined and alert_custom_action | length > 0 }}"
                then:
                  - choose: []
                    default: !input alert_custom_action
          
          # Handle lighting control for OPENING state
          - if:
              - condition: template
                value_template: "{{ enable_lighting_control }}"
              - condition: template
                value_template: "{{ 'opening' in lighting_triggers }}"
              - condition: template
                value_template: >
                  {% if lighting_schedule_enabled %}
                    {% set lighting_schedule_days = lighting_schedule_days if lighting_schedule_days is defined else [] %}
                    {% set day_match = current_day in lighting_schedule_days %}
                    {% if day_match %}
                      {% if lighting_schedule_start_time <= lighting_schedule_end_time %}
                        {{ not (current_time >= lighting_schedule_start_time and current_time <= lighting_schedule_end_time) }}
                      {% else %}
                        {{ not (current_time >= lighting_schedule_start_time or current_time <= lighting_schedule_end_time) }}
                      {% endif %}
                    {% else %}
                      true
                    {% endif %}
                  {% else %}
                    true
                  {% endif %}
            then:
              # Debug notification for lighting control
              - if:
                  - condition: template
                    value_template: "{{ debug_enabled }}"
                  - condition: template
                    value_template: >
                      {% if 'all' in debug_trigger_types %}
                        true
                      {% else %}
                        {{ 'lighting' in debug_trigger_types }}
                      {% endif %}
                then:
                  - variables:
                      action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                  - service: persistent_notification.create
                    data:
                      title: "🐛 {{ automation_friendly_name }} - OPENING Lighting Control"
                      message: |
                        ⚡ Trigger: {{ trigger_time }}
                        🕒 Action Time: {{ action_time }}
                        💡 Lights: {{ light_entities | length }} light(s)
                        🔆 Brightness: {{ light_brightness }}%
                        🎨 Color Temp: {{ light_color_temp }}K
                        ⏱️ Off Timer: {{ light_off_timer }}
                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
              
              - if:
                  - condition: template
                    value_template: "{{ light_entities is defined and light_entities | length > 0 }}"
                then:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ light_entities }}"
                    data:
                      brightness_pct: "{{ light_brightness }}"
                      color_temp_kelvin: "{{ light_color_temp }}"
                  
                  # Execute custom lighting action
                  - if:
                      - condition: template
                        value_template: "{{ lighting_custom_action is defined and lighting_custom_action | length > 0 }}"
                    then:
                      - choose: []
                        default: !input lighting_custom_action

                  # Light Off Timer - inline so mode:restart resets it on every new trigger
                  - variables:
                      timer_seconds: >
                        {% set timer = light_off_timer if light_off_timer is defined else {} %}
                        {{ timer.hours|default(0) * 3600 + timer.minutes|default(0) * 60 + timer.seconds|default(0) + timer.days|default(0) * 86400 }}
                  
                  - if:
                      - condition: template
                        value_template: "{{ timer_seconds > 0 }}"
                    then:
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ lighting_bypass_timer_enabled }}"
                              - condition: template
                                value_template: >
                                  {% if lighting_bypass_timer_entity is defined and lighting_bypass_timer_entity %}
                                    {{ lighting_bypass_timer_entity | select('string') | map('states') | select('eq', 'on') | list | count > 0 }}
                                  {% else %}
                                    false
                                  {% endif %}
                            sequence:
