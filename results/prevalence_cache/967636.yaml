                        ⚙️ Entity Match: {{ alert_enable_entity and alert_entity != '' and (states(alert_entity) in alert_entity_states.split(',')) if states(alert_entity) not in ['unavailable', 'unknown', 'none'] else false }}
                        📱 Alert Devices: {{ alert_notify_devices | length }} device(s)
                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
              
              # ALERT - Send alert notifications to all selected devices
              - variables:
                  open_bypass_is_on: >
                    {% set bypass = autoclose_bypass_entity if autoclose_bypass_entity is defined else [] %}
