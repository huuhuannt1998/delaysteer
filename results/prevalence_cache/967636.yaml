action:
  # Clear previous debug notification at start with safe check
  - if:
      - condition: template
        value_template: "{{ debug_enabled and debug_notification_id is defined }}"
    then:
      - service: persistent_notification.dismiss
        data:
          notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
  
  # Start of main choose block
  - choose:
      # Handle OPEN trigger
      - conditions:
          - condition: trigger
            id: trigger_open
        sequence:
          # Capture trigger time at the beginning of the sequence
          - variables:
              trigger_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
          
          # Debug notification with safe checks
          - if:
              - condition: template
                value_template: "{{ debug_enabled }}"
              - condition: template
                value_template: >
                  {% if 'all' in debug_trigger_types %}
                    true
                  {% else %}
                    {{ 'door_states' in debug_trigger_types }}
                  {% endif %}
            then:
              - variables:
                  action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
              - service: persistent_notification.create
                data:
                  title: "🐛 {{ automation_friendly_name }} - OPEN Triggered"
                  message: |
                    ⚡ Trigger: {{ trigger_time }}
                    🕒 Action Start: {{ action_time }}
                    🚪 Door Entity: {{ garage_door_entity }}
                    📊 Door State: {{ states(garage_door_entity) if states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] else 'unavailable' }}
                    {% if debug_include_variables %}
                    📋 Variables:
                      - enable_open_notification: {{ enable_open_notification }}
                      - open_friendly_name: {{ open_friendly_name }}
                      - open_duration_before_alert: {{ open_duration_before_alert }}
                      - open_notify_devices count: {{ open_notify_devices | length }}
                    {% endif %}
                  notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
          
          # Set variables for this trigger
          - variables:
              friendly_name: "{{ open_friendly_name }}"
              notification_tag: "garage-open-{{ garage_door_entity }}"
              current_day: "{{ now().strftime('%a').lower() }}"
              current_time: "{{ now().strftime('%H:%M:%S') }}"
          
          # Check if open notifications are enabled and conditions met
          - if:
              - condition: template
                value_template: "{{ enable_open_notification }}"
              - condition: template
                value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'open' }}"
              - condition: template
                value_template: >
                  {% set open_bypass_entities = open_bypass_entities if open_bypass_entities is defined else [] %}
                  {% if open_bypass_entities | length > 0 %}
                    {{ not (open_bypass_entities | select('string') | map('states') | select('eq', 'on') | list | count > 0) }}
                  {% else %}
                    true
                  {% endif %}
              - condition: template
                value_template: >
                  {% if open_bypass_schedule_enabled %}
                    {% set open_bypass_days = open_bypass_days if open_bypass_days is defined else [] %}
                    {% set day_match = current_day in open_bypass_days %}
                    {% if day_match %}
                      {% if open_bypass_start_time <= open_bypass_end_time %}
                        {{ not (current_time >= open_bypass_start_time and current_time <= open_bypass_end_time) }}
                      {% else %}
                        {{ not (current_time >= open_bypass_start_time or current_time <= open_bypass_end_time) }}
                      {% endif %}
                    {% else %}
                      true
                    {% endif %}
                  {% else %}
                    true
                  {% endif %}
            then:
              # Debug notification for sending open notifications
              - if:
                  - condition: template
                    value_template: "{{ debug_enabled }}"
                  - condition: template
                    value_template: >
                      {% if 'all' in debug_trigger_types %}
                        true
                      {% else %}
                        {{ 'door_states' in debug_trigger_types }}
                      {% endif %}
                then:
                  - variables:
                      action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                  - service: persistent_notification.create
                    data:
                      title: "🐛 {{ automation_friendly_name }} - Sending OPEN Notifications"
                      message: |
                        ⚡ Trigger: {{ trigger_time }}
                        🕒 Notification Time: {{ action_time }}
                        🚪 Door: {{ friendly_name }}
                        📱 Devices: {{ open_notify_devices | length }} device(s)
                        💬 Title: {{ open_notification_title }}
                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
              
              # OPEN - Send notifications to all selected devices
              - variables:
                  open_bypass_is_on: >
                    {% set bypass = autoclose_bypass_entity if autoclose_bypass_entity is defined else [] %}
                    {% if bypass | length > 0 %}
                      {{ bypass | select('string') | map('states') | select('eq', 'on') | list | count > 0 }}
                    {% else %}
                      false
                    {% endif %}
                  open_action_bypass_toggle: "OPEN_BYPASS_TOGGLE_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                  open_action_close_now: "OPEN_CLOSE_NOW_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                  open_action_custom: "OPEN_CUSTOM_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                  # Resolve enabled buttons from multi-select (default all on)
                  _enabled_btns: "{{ open_btn_enabled_buttons if open_btn_enabled_buttons is defined else ['bypass_toggle','close_now','custom_action'] }}"
                  _btn_bypass_enabled: "{{ 'bypass_toggle' in _enabled_btns }}"
                  _btn_close_now_enabled: "{{ 'close_now' in _enabled_btns }}"
                  _btn_custom_enabled: "{{ 'custom_action' in _enabled_btns }}"
                  # Resolve button labels with user-defined overrides
                  _btn_bypass_title_on: "{{ open_btn_bypass_toggle_title_on if open_btn_bypass_toggle_title_on is defined and open_btn_bypass_toggle_title_on != '' else '🟢 Auto-Close' }}"
                  _btn_bypass_title_off: "{{ open_btn_bypass_toggle_title_off if open_btn_bypass_toggle_title_off is defined and open_btn_bypass_toggle_title_off != '' else '🔴 Keep Open' }}"
                  _btn_bypass_title: "{{ _btn_bypass_title_on if open_bypass_is_on else _btn_bypass_title_off }}"
                  _btn_close_now_title: "{{ open_btn_close_now_title if open_btn_close_now_title is defined and open_btn_close_now_title != '' else '🔒 Close Now' }}"
                  _btn_custom_title: "{{ open_btn_custom_title if open_btn_custom_title is defined and open_btn_custom_title != '' else '⚡ Action' }}"
              - repeat:
                  for_each: "{{ open_notify_devices if open_notify_devices is defined else [] }}"
                  sequence:
                    - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                      data:
                        message: "{{ open_notification_message }}"
                        title: "{{ open_notification_title }}"
                        data:
                          clickAction: "{{ open_notification_click_url }}"
