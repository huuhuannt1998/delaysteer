                          notification_icon: "mdi:{{ alert_notification_icon }}"
                          push:
                            interruption-level: "{{ alert_notification_interruption }}"
                          persistent: "{{ alert_notification_persistent }}"
                          sticky: "{{ alert_notification_persistent }}"
                          actions: >
                            {% set ns = namespace(acts=[]) %}
                            {% if _btn_bypass_enabled %}
                              {% set ns.acts = ns.acts + [{'action': alert_action_bypass, 'title': _btn_bypass_title, 'destructive': false}] %}
                            {% endif %}
                            {% if _btn_close_now_enabled %}
                              {% set ns.acts = ns.acts + [{'action': alert_action_close_now, 'title': _btn_close_now_title, 'destructive': true}] %}
                            {% endif %}
                            {% if _btn_custom_enabled %}
                              {% set ns.acts = ns.acts + [{'action': alert_action_custom, 'title': _btn_custom_title, 'destructive': false}] %}
                            {% endif %}
                            {{ ns.acts }}
              # Wait for alert action tap
              - wait_for_trigger:
                  - platform: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ alert_action_bypass }}"
                  - platform: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ alert_action_close_now }}"
                  - platform: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ alert_action_custom }}"
                timeout:
