                  - service: persistent_notification.create
                    data:
                      title: "🐛 {{ automation_friendly_name }} - STOPPED Lighting Control"
                      message: |
                        ⚡ Trigger: {{ trigger_time }}
                        🕒 Action Time: {{ action_time }}
                        💡 Lights: {{ light_entities | length }} light(s)
                        🔆 Brightness: {{ light_brightness }}%
                        🎨 Color Temp: {{ light_color_temp }}K
                        ⏱️ Off Timer: {{ light_off_timer }}
                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
              
              - if:
                  - condition: template
                    value_template: "{{ light_entities is defined and light_entities | length > 0 }}"
