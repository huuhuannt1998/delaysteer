                  _btn_bypass_title_off: "{{ open_btn_bypass_toggle_title_off if open_btn_bypass_toggle_title_off is defined and open_btn_bypass_toggle_title_off != '' else '🔴 Keep Open' }}"
                  _btn_bypass_title: "{{ _btn_bypass_title_on if open_bypass_is_on else _btn_bypass_title_off }}"
                  _btn_close_now_title: "{{ open_btn_close_now_title if open_btn_close_now_title is defined and open_btn_close_now_title != '' else '🔒 Close Now' }}"
                  _btn_custom_title: "{{ open_btn_custom_title if open_btn_custom_title is defined and open_btn_custom_title != '' else '⚡ Action' }}"
                  alert_action_bypass: "ALERT_BYPASS_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                  alert_action_close_now: "ALERT_CLOSE_NOW_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                  alert_action_custom: "ALERT_CUSTOM_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
              - repeat:
