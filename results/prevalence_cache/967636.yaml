                                _btn_close_now_enabled: "{{ 'close_now' in _enabled_btns }}"
                                _btn_custom_enabled: "{{ 'custom_action' in _enabled_btns }}"
                                _btn_bypass_title_on: "{{ open_btn_bypass_toggle_title_on if open_btn_bypass_toggle_title_on is defined and open_btn_bypass_toggle_title_on != '' else '🟢 Auto-Close' }}"
                                _btn_bypass_title_off: "{{ open_btn_bypass_toggle_title_off if open_btn_bypass_toggle_title_off is defined and open_btn_bypass_toggle_title_off != '' else '🔴 Keep Open' }}"
                                _btn_bypass_title: "{{ _btn_bypass_title_on if open_bypass_is_on else _btn_bypass_title_off }}"
                                _btn_close_now_title: "{{ open_btn_close_now_title if open_btn_close_now_title is defined and open_btn_close_now_title != '' else '🔒 Close Now' }}"
                                _btn_custom_title: "{{ open_btn_custom_title if open_btn_custom_title is defined and open_btn_custom_title != '' else '⚡ Action' }}"
                                _rpt_action_bypass: "{{ 'RPT_BYPASS_TOGGLE_' ~ garage_door_entity | upper | replace('.','_') ~ '_' ~ now().strftime('%Y%m%d%H%M%S') }}"
                                _rpt_action_close_now: "{{ 'RPT_CLOSE_NOW_' ~ garage_door_entity | upper | replace('.','_') ~ '_' ~ now().strftime('%Y%m%d%H%M%S') }}"
                                _rpt_action_custom: "{{ 'RPT_CUSTOM_' ~ garage_door_entity | upper | replace('.','_') ~ '_' ~ now().strftime('%Y%m%d%H%M%S') }}"
                            - repeat:
                                for_each: "{{ open_notify_devices if open_notify_devices is defined else [] }}"
                                sequence:
                                  - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                    data:
                                      message: "{{ open_notification_message }}"
                                      title: "{{ open_notification_title }}"
                                      data:
                                        clickAction: "{{ open_notification_click_url }}"
                                        url: "{{ open_notification_click_url }}"
                                        tag: "{{ notification_tag }}"
                                        color: "{{ open_notification_color }}"
                                        notification_icon: "mdi:{{ open_notification_icon }}"
                                        push:
                                          interruption-level: "{{ open_notification_interruption }}"
                                        persistent: "{{ open_notification_persistent }}"
                                        sticky: "{{ open_notification_persistent }}"
                                        actions: >
                                          {% set ns = namespace(acts=[]) %}
                                          {% if _btn_bypass_enabled %}
                                            {% set ns.acts = ns.acts + [{'action': _rpt_action_bypass, 'title': _btn_bypass_title, 'destructive': false}] %}
                                          {% endif %}
                                          {% if _btn_close_now_enabled %}
                                            {% set ns.acts = ns.acts + [{'action': _rpt_action_close_now, 'title': _btn_close_now_title, 'destructive': true}] %}
                                          {% endif %}
                                          {% if _btn_custom_enabled %}
                                            {% set ns.acts = ns.acts + [{'action': _rpt_action_custom, 'title': _btn_custom_title, 'destructive': false}] %}
                                          {% endif %}
                                          {{ ns.acts }}
                  # Wait for action tap on repeat notification
                            - wait_for_trigger:
                                - platform: event
                                  event_type: mobile_app_notification_action
                                  event_data:
                                    action: "{{ _rpt_action_bypass }}"
                                - platform: event
                                  event_type: mobile_app_notification_action
                                  event_data:
                                    action: "{{ _rpt_action_close_now }}"
                                - platform: event
                                  event_type: mobile_app_notification_action
                                  event_data:
                                    action: "{{ _rpt_action_custom }}"
                              timeout:
                                minutes: 10
                              continue_on_timeout: true
                            - if:
                                - condition: template
                                  value_template: "{{ wait.trigger is not none }}"
                              then:
                                - choose:
                                    - conditions:
                                        - condition: template
                                          value_template: "{{ wait.trigger.event.data.action == _rpt_action_bypass }}"
                                      sequence:
                                        - variables:
                                            _current_bypass_is_on: >
                                              {% set bypass = autoclose_bypass_entity if autoclose_bypass_entity is defined else [] %}
                                              {% if bypass | length > 0 %}
                                                {{ bypass | select('string') | map('states') | select('eq', 'on') | list | count > 0 }}
                                              {% else %}
                                                false
                                              {% endif %}
                                        - repeat:
                                            for_each: >
