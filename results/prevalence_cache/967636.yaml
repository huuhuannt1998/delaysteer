blueprint:
  name: 🚗 Smart Garage - Door, Lighting, and Alerts by LTek
  description: |
    
    🚗 **Smart Garage - Door, Lighting, and Alerts**
    
    Comprehensive Garage Automation for Door States, Notifications, Alerts, Lighting, and Auto-Close/Open

    🚀 Version 2026.06.05.13c

    - FIXED: Auto-Close did not work when bypass entity field was empty.
    
    📖 Community Discussion, Help, and Details... https://community.home-assistant.io/t/smart-garage-control-doors-lighting-and-alerts/967636
    
    source_url: https://gist.github.com/Ltek/f58bbbde02471437ef863c334572a320
    
    Important Note: this made to work with garage doors that report as Covers entities. 
    
    **FEATURES**
    🚪 Monitors all 5 garage door states - open, opening, closed, closing, stopped
    📢 Notifications per door state with configurable title, message, icon, color, and interruption level (iOS/Android)
    📢 Notification Action Buttons - Bypass Toggle, Close Now, Custom Action for Open, Repeat, Alert, and Stopped. Bypass button logic on those notifications to toggle the auto-close bypass entity directly from the notification.
    🔁 Repeat notifications per state with configurable delay and max repeat count
    🚨 Alert notifications when door opens during restricted schedules or when a monitored entity is in a specific state
    🛡️ Notification bypass - suppress alerts by entity state or time schedule
    ⚙️ Custom actions for each door state, alert, and lighting trigger
    ⏱️ Auto-close default timer - 24/7, no schedule required
    with a configurable warning delay, so users get a heads-up before the door auto-closes. 
    📅 Door Schedules to automatically open or close at specific days/times
    💡 Independant Indoor and Outdoor lighting controls - lights, triggers, brightness, color temp, disable schedule, and timer bypass
    🔦 Lighting triggers include door states (opening, open, closing, stopped, closed) and additional entities (motion sensors, switches, locks, covers)
    ⏲️ Light Off Timer resets on every new trigger - works correctly with motion sensors and mode:restart
    🐛 Debug notifications to Persistent UI with per-trigger-type filtering and optional variable dump
    
  domain: automation
  input:
    # ========================================
    # GARAGE DOOR ENTITY (STANDALONE)
    # ========================================
    garage_door_entity:
      name: Garage Door Entity
      description: The garage door cover entity to monitor
      selector:
        entity:
          domain: cover
          multiple: false

    # ========================================
    # ALERT NOTIFICATION SECTION
    # ========================================
    alert_notification_section:
      name: "Alert Notification Settings"
      description: "Alerts when OPENs during specific day/time schedules or based on entity state. Intended for getting an alert when the door opens during periods it should not be."
      icon: mdi:bell-alert
      collapsed: true
      input:
        alert_enable_notification:
          name: ❗ Enable Alert Notifications
          description: Send when Time or Entity conditions are met
          default: false
          selector:
            boolean: {}

        # Alert Schedule Condition
        alert_enable_schedule:
          name: 📅 Enable Schedule Condition
          description: Send alerts when door opens during specific days/times
          default: true
          selector:
            boolean: {}

        alert_days:
          name: 🗓️ Alert Days
          description: Days when alerts should be sent during specified times (only if schedule condition is enabled)
          default:
            - mon
            - tue
            - wed
            - thu
            - fri
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun

        alert_start_time:
          name: 🟢 Start Time
          description: Start time for alert schedule when enabled. For 24-hour coverage, set both start and end times to 00:00:00.
          default: "22:00:00"
          selector:
            time: {}

        alert_end_time:
          name: 🔴 End Time
          description: End time for alert schedule when enabled. For 24-hour coverage, set both start and end times to 00:00:00.
          default: "06:00:00"
          selector:
            time: {}

        # Entity State Condition
        alert_enable_entity:
          name: ⚙️ Enable Entity State Condition
          description: Send alerts when specific entity is in specific state
          default: false
          selector:
            boolean: {}

        alert_entity:
          name: 👀 Monitored Entity
          description: Entity to monitor for alert condition (only if entity condition is enabled)
          default: ""
          selector:
            entity:
              multiple: false

        alert_entity_states:
          name: 📊 Monitored Entity State
          description: Comma-separated list of states that trigger alert (e.g., "Sleep,Away,Vacation"). If any state matches, alert is triggered.
          default: "on"
          selector:
            text:
              multiline: false

        alert_notify_devices:
          name: 📲 Mobile Notification Devices
          description: Mobile devices to receive alert notifications
          default: []
          selector:
            device:
              integration: mobile_app
              multiple: true

        alert_notification_title:
          name: 💬 Alert Notification Title
          default: '⚠️ Garage Door Alert'
          selector:
            text: {}

        alert_notification_message:
          name: 📢 Alert Notification Message
          default: '{{ state_attr(garage_door_entity, "friendly_name") | default("Garage Door") }} was opened during alert hours at {{ now().strftime("%I:%M:%S %p") }}'
          selector:
            text:
              multiline: true

        alert_notification_click_url:
          name: 🔗 Alert Click URL
          default: /dashboard-garage
          selector:
            text: {}

        alert_notification_icon:
          name: 🚨 Alert Notification Icon (Android)
          default: "bell-alert"
          selector:
            select:
              options:
                - label: "Bell Alert"
                  value: "bell-alert"
                - label: "Alert Circle"
                  value: "alert-circle"
                - label: "Security"
                  value: "security"
                - label: "Garage Alert"
                  value: "garage-alert"
                - label: "Home Alert"
                  value: "home-alert"

        alert_notification_color:
          name: 🎨 Alert Notification Color (Android)
          description: Hex color codes that work on both Android and iOS
          default: "#F44336"
          selector:
            select:
              options:
                - label: "Red (Alert)"
                  value: "#F44336"
                - label: "Orange (Warning)"
                  value: "#FF9800"
                - label: "Yellow"
                  value: "#FFEB3B"
                - label: "Purple"
                  value: "#9C27B0"
                - label: "Pink"
                  value: "#E91E63"
                - label: "Blue (Info)"
                  value: "#2196F3"
                - label: "Green (Success)"
                  value: "#4CAF50"
                - label: "Teal"
                  value: "#009688"
                - label: "Brown"
                  value: "#795548"
                - label: "Grey"
                  value: "#9E9E9E"

        alert_notification_persistent:
          name: 📌 Alert Persistent (Android)
          default: true
          selector:
            boolean: {}

        alert_notification_interruption:
          name: 🔔 Alert Interruption Level (iOS)
          default: "critical"
          selector:
            select:
              options:
                - label: "Passive"
                  value: "passive"
                - label: "Active"
                  value: "active"
                - label: "Time Sensitive"
                  value: "time-sensitive"
                - label: "Critical"
                  value: "critical"

        alert_custom_action:
          name: ⚙️ Alert Custom Action
          default: []
          selector:
            action: {}

