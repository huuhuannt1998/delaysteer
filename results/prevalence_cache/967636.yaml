                        target:
                          entity_id: !input garage_door_entity
          
          # Check Schedule 3
          - if:
              - condition: template
                value_template: "{{ schedule3_enabled }}"
              - condition: template
                value_template: >
                  {% set schedule3_days = schedule3_days if schedule3_days is defined else [] %}
                  {{ current_day in schedule3_days }}
              - condition: template
                value_template: >
                  {% if schedule3_start_time < schedule3_end_time %}
                    {{ current_time >= schedule3_start_time and current_time <= schedule3_end_time }}
                  {% else %}
                    {{ current_time >= schedule3_start_time or current_time <= schedule3_end_time }}
                  {% endif %}
            then:
              # Debug notification for Schedule 3 check
              - if:
                  - condition: template
                    value_template: "{{ debug_enabled }}"
                  - condition: template
                    value_template: >
                      {% if 'all' in debug_trigger_types %}
                        true
                      {% else %}
                        {{ 'schedules' in debug_trigger_types }}
                      {% endif %}
                then:
                  - variables:
                      action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                  - service: persistent_notification.create
                    data:
                      title: "🐛 {{ automation_friendly_name }} - Schedule 3 Active"
                      message: |
                        ⚡ Trigger: {{ trigger_time }}
                        🕒 Check Time: {{ action_time }}
                        📅 Schedule 3 Active
                        ⚙️ Action: {{ schedule3_action }}
                        ⏱️ Delay: {{ schedule3_delay }}
                        🚪 Door State: {{ states(garage_door_entity) if states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] else 'unavailable' }}
                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
              
              # Handle OPEN action for Schedule 3
              - if:
                  - condition: template
                    value_template: "{{ schedule3_action == 'open' }}"
                  - condition: template
                    value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'closed' }}"
                then:
                  - delay: "{{ schedule3_delay }}"
                  - if:
                      - condition: template
                        value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'closed' }}"
                      - condition: template
                        value_template: >
                          {% if schedule3_start_time < schedule3_end_time %}
                            {{ current_time >= schedule3_start_time and current_time <= schedule3_end_time }}
                          {% else %}
                            {{ current_time >= schedule3_start_time or current_time <= schedule3_end_time }}
                          {% endif %}
                    then:
                      # Debug notification for Schedule 3 open action
                      - if:
                          - condition: template
                            value_template: "{{ debug_enabled }}"
                          - condition: template
                            value_template: >
                              {% if 'all' in debug_trigger_types %}
                                true
                              {% else %}
                                {{ 'schedules' in debug_trigger_types }}
                              {% endif %}
                        then:
                          - variables:
                              action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                          - service: persistent_notification.create
                            data:
                              title: "🐛 {{ automation_friendly_name }} - Schedule 3 Opening Door"
                              message: |
                                ⚡ Trigger: {{ trigger_time }}
                                🕒 Action Time: {{ action_time }}
                                📅 Schedule 3 Executing
                                ⚙️ Action: OPEN door
                                🚪 Door State Before: {{ states(garage_door_entity) }}
                              notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
                      
                      - service: cover.open_cover
                        target:
                          entity_id: !input garage_door_entity
              
              # Handle CLOSE action for Schedule 3
              - if:
                  - condition: template
                    value_template: "{{ schedule3_action == 'close' }}"
                  - condition: template
                    value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'open' }}"
                then:
                  - delay: "{{ schedule3_delay }}"
                  - if:
                      - condition: template
                        value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'open' }}"
                      - condition: template
                        value_template: >
                          {% if schedule3_start_time < schedule3_end_time %}
                            {{ current_time >= schedule3_start_time and current_time <= schedule3_end_time }}
                          {% else %}
                            {{ current_time >= schedule3_start_time or current_time <= schedule3_end_time }}
                          {% endif %}
                    then:
                      # Debug notification for Schedule 3 close action
                      - if:
                          - condition: template
                            value_template: "{{ debug_enabled }}"
                          - condition: template
                            value_template: >
                              {% if 'all' in debug_trigger_types %}
                                true
                              {% else %}
                                {{ 'schedules' in debug_trigger_types }}
                              {% endif %}
                        then:
                          - variables:
                              action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                          - service: persistent_notification.create
                            data:
                              title: "🐛 {{ automation_friendly_name }} - Schedule 3 Closing Door"
                              message: |
                                ⚡ Trigger: {{ trigger_time }}
                                🕒 Action Time: {{ action_time }}
                                📅 Schedule 3 Executing
                                ⚙️ Action: CLOSE door
                                🚪 Door State Before: {{ states(garage_door_entity) }}
                              notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
                      
                      - service: cover.close_cover
                        target:
                          entity_id: !input garage_door_entity