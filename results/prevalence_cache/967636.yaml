                      message: |
                        ⚡ Trigger: {{ trigger_time }}
                        🕒 Action Time: {{ action_time }}
                        💡 Lights: {{ light_entities | length }} light(s)
                        🔆 Brightness: {{ light_brightness }}%
                        🎨 Color Temp: {{ light_color_temp }}K
                        ⏱️ Off Timer: {{ light_off_timer }}
                        📅 Schedule Enabled: {{ lighting_schedule_enabled }}
                        📅 Schedule Active: {{ not (lighting_schedule_enabled and current_day in lighting_schedule_days and ((lighting_schedule_start_time <= lighting_schedule_end_time and current_time >= lighting_schedule_start_time and current_time <= lighting_schedule_end_time) or (lighting_schedule_start_time > lighting_schedule_end_time and (current_time >= lighting_schedule_start_time or current_time <= lighting_schedule_end_time)))) }}
                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
              
              # Turn lights on with specified settings
              - if:
                  - condition: template
                    value_template: "{{ light_entities is defined and light_entities | length > 0 }}"
                then:
                  - service: light.turn_on
