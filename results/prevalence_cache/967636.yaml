                              - condition: template
                                value_template: >
                                  {% if outdoor_lighting_bypass_timer_entity is defined and outdoor_lighting_bypass_timer_entity %}
                                    {{ outdoor_lighting_bypass_timer_entity | select('string') | map('states') | select('eq', 'on') | list | count > 0 }}
                                  {% else %}
                                    false
                                  {% endif %}
                            sequence:
                              - if:
                                  - condition: template
                                    value_template: "{{ debug_enabled }}"
                                then:
                                  - service: persistent_notification.create
                                    data:
                                      title: "🐛 {{ automation_friendly_name }} - Outdoor Light Off Timer BYPASSED (STOPPED)"
                                      message: |
                                        ⏱️ Timer Bypassed: Yes (bypass condition is true)
                                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
                        default:
                          - delay:
                              seconds: "{{ timer_seconds }}"
                          - service: light.turn_off
                            target:
                              entity_id: "{{ outdoor_light_entities }}"
                          - if:
                              - condition: template
                                value_template: "{{ debug_enabled }}"
                            then:
                              - service: persistent_notification.create
                                data:
                                  title: "🐛 {{ automation_friendly_name }} - Outdoor Lights OFF Timer Expired (STOPPED)"
                                  message: |
                                    ⏱️ Timer expired with no new trigger - outdoor lights off
                                  notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"

      # Handle AUTO-CLOSE trigger (dedicated trigger for auto-close)
      - conditions:
          - condition: trigger
            id: trigger_autoclose
        sequence:
          - variables:
              trigger_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
              autoclose_bypass_tag: "garage-autoclose-bypass-{{ garage_door_entity }}"
              bypass_is_active: >
                {% set bypass = autoclose_bypass_entity if autoclose_bypass_entity is defined else [] %}
                {% if bypass | length > 0 %}
                  {{ bypass | select('string') | map('states') | select('eq', 'on') | list | count > 0 }}
                {% else %}
                  {{ false }}
                {% endif %}

          # ── PATH A: Bypass is ON — skip close, optionally notify ──────────
          - if:
              - condition: template
                value_template: "{{ autoclose_default_enabled }}"
              - condition: template
                value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'open' }}"
              - condition: template
                value_template: "{{ bypass_is_active }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ autoclose_bypass_notify_enabled }}"
                  - condition: template
                    value_template: "{{ autoclose_bypass_notify_devices | length > 0 }}"
                then:
                  - variables:
                      bypass_action_enable_autoclose: "BYPASS_ENABLE_AC_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                      bypass_action_close_now: "BYPASS_CLOSE_NOW_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                      bypass_action_custom: "BYPASS_CUSTOM_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                  - repeat:
                      for_each: "{{ autoclose_bypass_notify_devices if autoclose_bypass_notify_devices is defined else [] }}"
                      sequence:
                        - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                          data:
                            message: "{{ autoclose_bypass_notify_message }}"
                            title: "{{ autoclose_bypass_notify_title }}"
                            data:
                              clickAction: "{{ autoclose_bypass_notify_click_url }}"
                              url: "{{ autoclose_bypass_notify_click_url }}"
                              tag: "{{ autoclose_bypass_tag }}"
                              color: "{{ autoclose_bypass_notify_color }}"
                              notification_icon: "mdi:{{ autoclose_bypass_notify_icon }}"
                              push:
                                interruption-level: "{{ autoclose_bypass_notify_interruption }}"
                              persistent: "{{ autoclose_bypass_notify_persistent }}"
                              sticky: "{{ autoclose_bypass_notify_persistent }}"
                              actions:
                                - action: "{{ bypass_action_enable_autoclose }}"
                                  title: "🟢 Enable Auto-Close"
                                  destructive: false
                                - action: "{{ bypass_action_close_now }}"
                                  title: "🔒 Close Garage Now"
                                  destructive: true
                                - action: "{{ bypass_action_custom }}"
                                  title: "⚡ Custom Action"
                                  destructive: false
                  - wait_for_trigger:
                      - platform: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: "{{ bypass_action_enable_autoclose }}"
                      - platform: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: "{{ bypass_action_close_now }}"
                      - platform: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: "{{ bypass_action_custom }}"
                    timeout:
                      minutes: 10
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: "{{ wait.trigger is not none }}"
                    then:
                      - choose:
                          # 🟢 Enable Auto-Close — turn bypass OFF, restart countdown
                          - conditions:
                              - condition: template
                                value_template: "{{ wait.trigger.event.data.action == bypass_action_enable_autoclose }}"
                            sequence:
                              - repeat:
                                  for_each: >
                                    {{ autoclose_bypass_entity if autoclose_bypass_entity is defined else [] }}
                                  sequence:
                                    - service: input_boolean.turn_off
                                      target:
                                        entity_id: "{{ repeat.item }}"
                              # trigger_bypass_disabled will fire and restart the countdown
                          # 🔒 Close Garage Now — turn bypass OFF and close immediately
                          - conditions:
                              - condition: template
                                value_template: "{{ wait.trigger.event.data.action == bypass_action_close_now }}"
                            sequence:
                              - repeat:
                                  for_each: >
                                    {{ autoclose_bypass_entity if autoclose_bypass_entity is defined else [] }}
                                  sequence:
                                    - service: input_boolean.turn_off
                                      target:
                                        entity_id: "{{ repeat.item }}"
                              - service: cover.close_cover
                                target:
                                  entity_id: !input garage_door_entity
                          # ⚡ Custom Action
                          - conditions:
                              - condition: template
                                value_template: "{{ wait.trigger.event.data.action == bypass_action_custom }}"
                            sequence:
                              - if:
                                  - condition: template
                                    value_template: "{{ autoclose_bypass_custom_action is defined and autoclose_bypass_custom_action | length > 0 }}"
                                then:
                                  - choose: []
                                    default: !input autoclose_bypass_custom_action
              - if:
                  - condition: template
                    value_template: >
                      {{ not autoclose_bypass_notify_enabled and
                         autoclose_bypass_custom_action is defined and
                         autoclose_bypass_custom_action | length > 0 }}
                then:
                  - choose: []
                    default: !input autoclose_bypass_custom_action

          # ── PATH B: Bypass is OFF — close the door ────────────────────────
          - if:
              - condition: template
                value_template: "{{ autoclose_default_enabled }}"
              - condition: template
                value_template: "{{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and states(garage_door_entity) == 'open' }}"
              - condition: template
                value_template: "{{ not bypass_is_active }}"
            then:
              - service: cover.close_cover
                target:
                  entity_id: !input garage_door_entity

      # Handle BYPASS DISABLED — restart auto-close countdown from full delay
      - conditions:
          - condition: trigger
            id: trigger_bypass_disabled
        sequence:
          - variables:
              trigger_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"

          # Only act if auto-close is enabled and door is currently open
          - if:
              - condition: template
                value_template: >
                  {{ autoclose_default_enabled and
                     states(garage_door_entity) not in ['unavailable', 'unknown', 'none'] and
                     states(garage_door_entity) == 'open' }}
            then:
              # Send notification — bypass is off, door will close soon
              - if:
                  - condition: template
                    value_template: "{{ autoclose_bypass_notify_enabled }}"
                  - condition: template
                    value_template: "{{ autoclose_bypass_notify_devices | length > 0 }}"
                then:
                  - variables:
                      bd_action_disable_autoclose: "BD_DISABLE_AC_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                      bd_action_close_now: "BD_CLOSE_NOW_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                      bd_action_custom: "BD_CUSTOM_{{ garage_door_entity | upper | replace('.', '_') }}_{{ now().strftime('%Y%m%d%H%M%S') }}"
                      bd_notify_tag: "garage-bypass-disabled-{{ garage_door_entity }}"
                  - repeat:
                      for_each: "{{ autoclose_bypass_notify_devices if autoclose_bypass_notify_devices is defined else [] }}"
                      sequence:
                        - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                          data:
                            title: "{{ autoclose_bypass_notify_title }}"
                            message: "{{ autoclose_bypass_notify_message }}"
                            data:
                              clickAction: "{{ autoclose_bypass_notify_click_url }}"
                              url: "{{ autoclose_bypass_notify_click_url }}"
                              tag: "{{ bd_notify_tag }}"
                              color: "{{ autoclose_bypass_notify_color }}"
                              notification_icon: "mdi:{{ autoclose_bypass_notify_icon }}"
                              push:
                                interruption-level: "{{ autoclose_bypass_notify_interruption }}"
                              persistent: "{{ autoclose_bypass_notify_persistent }}"
                              sticky: "{{ autoclose_bypass_notify_persistent }}"
                              actions:
                                - action: "{{ bd_action_disable_autoclose }}"
                                  title: "🔴 Disable Auto-Close (Keep Open)"
                                  destructive: false
                                - action: "{{ bd_action_close_now }}"
                                  title: "🔒 Close Garage Now"
                                  destructive: true
                                - action: "{{ bd_action_custom }}"
                                  title: "⚡ Custom Action"
                                  destructive: false
                  # Wait for tap — if someone taps before the delay expires, handle it
                  - wait_for_trigger:
                      - platform: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: "{{ bd_action_disable_autoclose }}"
                      - platform: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: "{{ bd_action_close_now }}"
                      - platform: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: "{{ bd_action_custom }}"
                    timeout: !input autoclose_default_delay
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: "{{ wait.trigger is not none }}"
                    then:
                      - choose:
                          # 🔴 Disable Auto-Close — turn bypass ON, door stays open
                          - conditions:
                              - condition: template
                                value_template: "{{ wait.trigger.event.data.action == bd_action_disable_autoclose }}"
                            sequence:
                              - repeat:
                                  for_each: >
                                    {{ autoclose_bypass_entity if autoclose_bypass_entity is defined else [] }}
                                  sequence:
                                    - service: input_boolean.turn_on
                                      target:
                                        entity_id: "{{ repeat.item }}"
                          # 🔒 Close Garage Now — close immediately, skip the delay
                          - conditions:
                              - condition: template
                                value_template: "{{ wait.trigger.event.data.action == bd_action_close_now }}"
                            sequence:
                              - service: cover.close_cover
                                target:
                                  entity_id: !input garage_door_entity
                          # ⚡ Custom Action
                          - conditions:
                              - condition: template
                                value_template: "{{ wait.trigger.event.data.action == bd_action_custom }}"
                            sequence:
                              - if:
                                  - condition: template
                                    value_template: "{{ autoclose_bypass_custom_action is defined and autoclose_bypass_custom_action | length > 0 }}"
                                then:
                                  - choose: []
                                    default: !input autoclose_bypass_custom_action
                    else:
                      # Timeout — no tap, proceed with delayed close below
                      - if:
                          - condition: template
                            value_template: >
                              {{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none']
                                 and states(garage_door_entity) == 'open' }}
                          - condition: template
                            value_template: >
                              {% set bypass = autoclose_bypass_entity if autoclose_bypass_entity is defined else [] %}
                              {% if bypass | length > 0 %}
                                {{ not (bypass | select('string') | map('states') | select('eq', 'on') | list | count > 0) }}
                              {% else %}
                                true
                              {% endif %}
                        then:
                          - service: cover.close_cover
                            target:
                              entity_id: !input garage_door_entity

              # No notification configured — just wait the delay then close
              - if:
                  - condition: template
                    value_template: "{{ not autoclose_bypass_notify_enabled or autoclose_bypass_notify_devices | length == 0 }}"
                then:
                  - delay: !input autoclose_default_delay
                  - if:
                      - condition: template
                        value_template: >
                          {{ states(garage_door_entity) not in ['unavailable', 'unknown', 'none']
                             and states(garage_door_entity) == 'open' }}
                      - condition: template
                        value_template: >
                          {% set bypass = autoclose_bypass_entity if autoclose_bypass_entity is defined else [] %}
                          {% if bypass | length > 0 %}
                            {{ not (bypass | select('string') | map('states') | select('eq', 'on') | list | count > 0) }}
                          {% else %}
                            true
                          {% endif %}
                    then:
                      - service: cover.close_cover
                        target:
                          entity_id: !input garage_door_entity

      # Handle LIGHTING trigger entities
      - conditions:
          - condition: trigger
            id: trigger_lighting_entities
        sequence:
          # Capture trigger time at the beginning of the sequence
          - variables:
              trigger_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
          
          # Debug notification
          - if:
              - condition: template
                value_template: "{{ debug_enabled }}"
              - condition: template
                value_template: >
                  {% if 'all' in debug_trigger_types %}
                    true
                  {% else %}
                    {{ 'lighting' in debug_trigger_types }}
                  {% endif %}
            then:
              - variables:
                  action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
              - service: persistent_notification.create
                data:
                  title: "🐛 {{ automation_friendly_name }} - Lighting Entity Triggered"
                  message: |
                    ⚡ Trigger: {{ trigger_time }}
                    🕒 Action Start: {{ action_time }}
                    ⚡ Trigger Entity: {{ trigger.entity_id }}
                    📊 Trigger State: {{ trigger.to_state.state if trigger.to_state.state not in ['unavailable', 'unknown', 'none'] else 'unavailable' }}
                    {% if debug_include_variables %}
                    📋 Variables:
                      - enable_lighting_control: {{ enable_lighting_control }}
                      - light_entities count: {{ light_entities | length }}
                    {% endif %}
                  notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
          
          # Check if the trigger entity changed to an active state
          - variables:
              trigger_entity: "{{ trigger.entity_id }}"
              trigger_state: "{{ trigger.to_state.state }}"
              current_day: "{{ now().strftime('%a').lower() }}"
              current_time: "{{ now().strftime('%H:%M:%S') }}"
          
          # Shared schedule condition used by both active and inactive branches
          - variables:
              schedule_allows_lighting: >
                {% if lighting_schedule_enabled %}
                  {% set lighting_schedule_days = lighting_schedule_days if lighting_schedule_days is defined else [] %}
                  {% set day_match = current_day in lighting_schedule_days %}
                  {% if day_match %}
                    {% if lighting_schedule_start_time <= lighting_schedule_end_time %}
                      {{ not (current_time >= lighting_schedule_start_time and current_time <= lighting_schedule_end_time) }}
                    {% else %}
                      {{ not (current_time >= lighting_schedule_start_time or current_time <= lighting_schedule_end_time) }}
                    {% endif %}
                  {% else %}
                    true
                  {% endif %}
                {% else %}
                  true
                {% endif %}

          # Shared timer logic extracted as a sub-sequence via choose
          # Branch A: trigger went ACTIVE (on/open/unlocked) — turn lights ON then start timer
          # Branch B: trigger went INACTIVE (off/closed/locked) — skip turn-on, only start timer
          - choose:

              # ── Branch A: Active state — turn lights on + start timer ──
              - conditions:
                  - condition: template
                    value_template: "{{ enable_lighting_control }}"
                  - condition: template
                    value_template: >
                      {% set active_states = ['on', 'open', 'unlocked'] %}
                      {{ trigger_state in active_states }}
                  - condition: template
                    value_template: "{{ trigger.to_state.context.parent_id is none }}"
                  - condition: template
                    value_template: >
                      {% set is_light_entity = trigger.entity_id in (light_entities if light_entities is iterable else [light_entities]) %}
                      {{ not is_light_entity or lighting_manual_control_timer }}
                  - condition: template
                    value_template: "{{ schedule_allows_lighting }}"
                sequence:
                  # Debug notification for lighting action
                  - if:
                      - condition: template
                        value_template: "{{ debug_enabled }}"
                      - condition: template
                        value_template: >
                          {% if 'all' in debug_trigger_types %}
                            true
                          {% else %}
                            {{ 'lighting' in debug_trigger_types }}
                          {% endif %}
                    then:
                      - variables:
                          action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                      - service: persistent_notification.create
                        data:
                          title: "🐛 {{ automation_friendly_name }} - Triggering Lights ON"
                          message: |
                            ⚡ Trigger: {{ trigger_time }}
                            🕒 Action Time: {{ action_time }}
                            ⚡ Trigger Entity: {{ trigger_entity }}
                            📊 Trigger State: {{ trigger_state }}
                            💡 Lights: {{ light_entities | length }} light(s)
                            🔆 Brightness: {{ light_brightness }}%
                            🎨 Color Temp: {{ light_color_temp }}K
                            ⏱️ Off Timer: {{ light_off_timer }}
                          notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
                  
                  # Turn lights on
                  - if:
                      - condition: template
                        value_template: "{{ light_entities is defined and light_entities | length > 0 }}"
                    then:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ light_entities }}"
                        data:
                          brightness_pct: "{{ light_brightness }}"
                          color_temp_kelvin: "{{ light_color_temp }}"
                      
                      # Execute custom lighting action
                      - if:
                          - condition: template
                            value_template: "{{ lighting_custom_action is defined and lighting_custom_action | length > 0 }}"
                        then:
                          - choose: []
                            default: !input lighting_custom_action
                      
                      # Light Off Timer
                      - variables:
                          timer_seconds: >
                            {% set timer = light_off_timer if light_off_timer is defined else {} %}
                            {{ timer.hours|default(0) * 3600 + timer.minutes|default(0) * 60 + timer.seconds|default(0) + timer.days|default(0) * 86400 }}
                      
                      - if:
                          - condition: template
                            value_template: "{{ timer_seconds > 0 }}"
                        then:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ lighting_bypass_timer_enabled }}"
                                  - condition: template
                                    value_template: >
                                      {% if lighting_bypass_timer_entity is defined and lighting_bypass_timer_entity %}
                                        {{ lighting_bypass_timer_entity | select('string') | map('states') | select('eq', 'on') | list | count > 0 }}
                                      {% else %}
                                        false
                                      {% endif %}
                                sequence:
                                  - if:
                                      - condition: template
                                        value_template: "{{ debug_enabled }}"
                                    then:
                                      - service: persistent_notification.create
                                        data:
                                          title: "🐛 {{ automation_friendly_name }} - Light Off Timer BYPASSED"
                                          message: |
                                            ⚡ Trigger: {{ trigger_time }}
                                            💡 Lights: {{ light_entities | length }} light(s)
                                            ⏱️ Timer Bypassed: Yes (bypass condition is true)
                                          notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
                            default:
                              - if:
                                  - condition: template
                                    value_template: "{{ debug_enabled }}"
                                then:
                                  - service: persistent_notification.create
                                    data:
                                      title: "🐛 {{ automation_friendly_name }} - Light Off Timer Started (Active)"
                                      message: |
                                        ⚡ Trigger: {{ trigger_time }}
                                        💡 Lights: {{ light_entities | length }} light(s)
                                        ⏱️ Timer Duration: {{ light_off_timer }} ({{ timer_seconds }}s)
                                        ℹ️ mode:restart means any new trigger resets this timer
                                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
                              
                              - delay:
                                  seconds: "{{ timer_seconds }}"
                              
                              - service: light.turn_off
                                target:
                                  entity_id: "{{ light_entities }}"
                              
                              - if:
                                  - condition: template
                                    value_template: "{{ debug_enabled }}"
                                then:
                                  - service: persistent_notification.create
                                    data:
                                      title: "🐛 {{ automation_friendly_name }} - Lights Turned OFF (Timer Expired)"
                                      message: |
                                        ⚡ Original Trigger: {{ trigger_time }}
                                        💡 Lights: {{ light_entities | length }} light(s)
                                        ⏱️ Timer expired after active trigger - lights off
                                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"

              # ── Branch B: Inactive state (e.g. motion cleared) — timer only, no turn-on ──
              - conditions:
                  - condition: template
                    value_template: "{{ enable_lighting_control }}"
                  - condition: template
                    value_template: >
                      {% set inactive_states = ['off', 'closed', 'locked'] %}
                      {{ trigger_state in inactive_states }}
                  - condition: template
                    value_template: "{{ trigger.to_state.context.parent_id is none }}"
                  - condition: template
                    value_template: "{{ schedule_allows_lighting }}"
                  - condition: template
                    value_template: >
                      {# Only start the timer if at least one of the controlled lights is currently on #}
                      {{ light_entities | select('is_state', 'on') | list | count > 0 }}
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ debug_enabled }}"
                      - condition: template
                        value_template: >
                          {% if 'all' in debug_trigger_types %}
                            true
                          {% else %}
                            {{ 'lighting' in debug_trigger_types }}
                          {% endif %}
                    then:
                      - variables:
                          action_time: "{{ now().strftime('%H:%M:%S.%f')[:-3] }}"
                      - service: persistent_notification.create
                        data:
                          title: "🐛 {{ automation_friendly_name }} - Trigger Inactive, Starting Off Timer"
                          message: |
                            ⚡ Trigger: {{ trigger_time }}
                            🕒 Action Time: {{ action_time }}
                            ⚡ Trigger Entity: {{ trigger_entity }}
                            📊 Trigger State: {{ trigger_state }} (inactive — timer only, no turn-on)
                            💡 Lights on: {{ light_entities | select('is_state', 'on') | list | count }}
                            ⏱️ Off Timer: {{ light_off_timer }}
                          notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
                  
                  # Timer only — lights are already on, just start the countdown
                  - variables:
                      timer_seconds: >
                        {% set timer = light_off_timer if light_off_timer is defined else {} %}
                        {{ timer.hours|default(0) * 3600 + timer.minutes|default(0) * 60 + timer.seconds|default(0) + timer.days|default(0) * 86400 }}
                  
                  - if:
                      - condition: template
                        value_template: "{{ timer_seconds > 0 }}"
                    then:
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ lighting_bypass_timer_enabled }}"
                              - condition: template
                                value_template: >
                                  {% if lighting_bypass_timer_entity is defined and lighting_bypass_timer_entity %}
                                    {{ lighting_bypass_timer_entity | select('string') | map('states') | select('eq', 'on') | list | count > 0 }}
                                  {% else %}
                                    false
                                  {% endif %}
                            sequence:
                              - if:
                                  - condition: template
                                    value_template: "{{ debug_enabled }}"
                                then:
                                  - service: persistent_notification.create
                                    data:
                                      title: "🐛 {{ automation_friendly_name }} - Light Off Timer BYPASSED (Inactive)"
                                      message: |
                                        ⚡ Trigger: {{ trigger_time }}
                                        ⏱️ Timer Bypassed: Yes (bypass condition is true)
                                      notification_id: "{{ debug_notification_id }}_{{ now().strftime('%Y%m%d_%H%M%S%f')[:-3] }}"
