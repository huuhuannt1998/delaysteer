      # ── Channel 6 ────────────────────────────────────────────────────────────
      - conditions: "{{ scene_key == '006' }}"
        sequence: !input channel_6_up
      - conditions: "{{ scene_key == '018' }}"
        sequence: !input channel_6_down
      - conditions: "{{ scene_key == '030' }}"
        sequence: !input channel_6_home

      # ── Channel 7 ────────────────────────────────────────────────────────────
      - conditions: "{{ scene_key == '007' }}"
