blueprint:
  name: "MAX Messenger Notifications — Camera photo / video"
  description: >
    Send a camera snapshot, a recorded video, or both to MAX Messenger
    when one or more Home Assistant triggers fire.

    Requires the MAX Messenger Notifications custom integration v0.6.0 or newer.
    Video mode requires a camera entity that supports camera.record.
  domain: automation

  input:
    trigger_additional:
      name: "Trigger(s)"
      description: >
        Select one or more triggers, for example motion, person detection,
        doorbell, door opening, or another Home Assistant trigger.
      default: []
      selector:
        trigger: {}

    camera:
      name: "Camera"
      description: "Camera used for snapshots and/or video recording."
      selector:
        entity:
          filter:
            - domain: camera

    media_mode:
      name: "Media to send"
      description: "Choose photo, video, or both."
      default: photo_video
      selector:
        select:
          options:
            - label: "Photo + video"
              value: photo_video
            - label: "Photo only"
              value: photo
            - label: "Video only"
              value: video

    conditions:
      name: "Conditions"
      description: "Optional conditions that must be true before sending."
      default: []
      selector:
        condition: {}

    snapshot_delay:
      name: "Delay before snapshot"
      description: "Useful when the camera needs a moment after motion is detected."
      default:
        seconds: 1
      selector:
        duration: {}

    snapshot_file:
      name: "Snapshot file"
      description: "Must be writable by Home Assistant. /media is recommended."
      default: "/media/max_messenger_camera_latest.jpg"
      selector:
        text: {}

    video_file:
      name: "Video file"
      description: "Must be writable by Home Assistant. /media is recommended."
      default: "/media/max_messenger_camera_latest.mp4"
      selector:
        text: {}

    video_duration:
      name: "Video duration"
      description: "How many seconds to record."
      default: 10
      selector:
        number:
          min: 3
          max: 60
          step: 1
          unit_of_measurement: s
          mode: slider

    photo_message:
      name: "Photo message"
      default: >-
        📷 **Camera event**

        Camera: {{ state_attr(camera_entity, 'friendly_name') or camera_entity }}
        Time: {{ now().strftime('%H:%M:%S') }}
      selector:
        text:
          multiline: true

    video_message:
      name: "Video message"
      default: >-
        🎥 **Camera event video**

        Camera: {{ state_attr(camera_entity, 'friendly_name') or camera_entity }}
        Time: {{ now().strftime('%H:%M:%S') }}
      selector:
        text:
          multiline: true

    user_ids:
      name: "MAX recipients"
      description: >
        Optional comma-separated MAX user IDs, for example:
        123456789, 987654321.
        Leave empty to send to every enabled user allowed by the integration ACL.
      default: ""
      selector:
        text: {}

    required_permission:
      name: "Required permission"
      description: >
        ACL permission required for recipients. Keep "cameras" unless you use
        another permission model.
      default: "cameras"
      selector:
        text: {}

    max_notify:
      name: "MAX notification"
      description: "Whether MAX should show a notification for the message."
      default: true
      selector:
        boolean: {}

    cooldown:
      name: "Cooldown"
      description: "Delay before this single-mode automation can run again."
      default:
        seconds: 30
      selector:
        duration: {}

    additional_actions_before:
      name: "Additional actions before sending"
      default: []
      selector:
        action: {}

    additional_actions_after:
      name: "Additional actions after sending"
      default: []
      selector:
        action: {}

trigger: !input trigger_additional
condition: !input conditions

variables:
  selected_media_mode: !input media_mode
  camera_entity: !input camera
  max_user_ids_text: !input user_ids
  max_user_ids: >-
    {% set raw = (max_user_ids_text | string | trim) %}
    {% if raw == '' %}
      {{ [] }}
    {% else %}
      {{ raw.split(',') | map('trim') | reject('equalto', '') | map('int') | list }}
    {% endif %}

action:
  - choose: []
    default: !input additional_actions_before

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ selected_media_mode in ['photo', 'photo_video'] }}
        sequence:
          - delay: !input snapshot_delay
          - action: camera.snapshot
            target:
              entity_id: !input camera
            data:
              filename: !input snapshot_file
          - delay:
              seconds: 1
          - action: max_messenger.broadcast_image
            data:
              file_path: !input snapshot_file
              message: !input photo_message
              user_ids: "{{ max_user_ids }}"
              required_permission: !input required_permission
              format: markdown
              notify: !input max_notify

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ selected_media_mode in ['video', 'photo_video'] }}
        sequence:
          - action: camera.record
            target:
              entity_id: !input camera
            data:
              filename: !input video_file
              duration: !input video_duration
          - delay:
              seconds: 1
          - action: max_messenger.broadcast_video
            data:
              file_path: !input video_file
              message: !input video_message
              user_ids: "{{ max_user_ids }}"
              required_permission: !input required_permission
              format: markdown
              notify: !input max_notify

  - choose: []
    default: !input additional_actions_after

  - delay: !input cooldown

mode: single
max_exceeded: silent
