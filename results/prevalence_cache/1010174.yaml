trigger_variables:
  enable_run_2: !input enable_run_2
  enable_run_3: !input enable_run_3

variables:
  sync_pulse: !input sync_pulse_seconds
  pressure_pause: !input pressure_release_seconds
  rain_limit: !input rain_threshold
  temp_limit: !input temp_threshold
  rain_history: !input rain_history_sensor
  rain_forecast: !input rain_forecast_sensor
  weather_ent: !input weather_entity
  notify_enabled: !input enable_notification
  notify_devices: !input notify_devices
  notify_earliest: !input notify_time_earliest
  notify_latest: !input notify_time_latest
  zones:
    - active: !input z1_active
      sensor: !input z1_sensor
      limit: !input z1_limit
      time: !input z1_duration
      time_warm: !input z1_duration_warm
      w_dep: !input z1_weather_dep
    - active: !input z2_active
      sensor: !input z2_sensor
      limit: !input z2_limit
      time: !input z2_duration
      time_warm: !input z2_duration_warm
      w_dep: !input z2_weather_dep
    - active: !input z3_active
      sensor: !input z3_sensor
      limit: !input z3_limit
      time: !input z3_duration
      time_warm: !input z3_duration_warm
      w_dep: !input z3_weather_dep
    - active: !input z4_active
      sensor: !input z4_sensor
      limit: !input z4_limit
      time: !input z4_duration
      time_warm: !input z4_duration_warm
      w_dep: !input z4_weather_dep
    - active: !input z5_active
      sensor: !input z5_sensor
      limit: !input z5_limit
      time: !input z5_duration
      time_warm: !input z5_duration_warm
      w_dep: !input z5_weather_dep
    - active: !input z6_active
      sensor: !input z6_sensor
      limit: !input z6_limit
      time: !input z6_duration
      time_warm: !input z6_duration_warm
      w_dep: !input z6_weather_dep

trigger:
  - platform: time
    at: !input start_time
  - platform: time
    at: !input start_time_2
    enabled: "{{ enable_run_2 }}"
  - platform: time
    at: !input start_time_3
    enabled: "{{ enable_run_3 }}"

action:
  # --- Fetch weather forecast ---
  - action: weather.get_forecasts
    data:
      type: daily
    target:
      entity_id: !input weather_entity
    response_variable: forecast_response
    continue_on_error: true

  # --- Extract weather data ---
  - variables:
      # Rain forecast: Use dedicated sensor if configured, otherwise weather forecast
      rain_forecast_available: >-
        {{ rain_forecast not in ['', none, 'unknown']
           and states(rain_forecast) not in ['unavailable', 'unknown', 'none'] }}
      fore_rain: >-
        {% if rain_forecast_available %}
          {{ states(rain_forecast) | float(0) }}
        {% elif forecast_response is defined %}
          {% set entity_data = forecast_response[weather_ent] | default({}) %}
          {% set fc = entity_data['forecast'] | default([]) %}
          {{ fc[0].precipitation | float(0) if fc | count > 0 else 0 }}
        {% else %}
          0
        {% endif %}
      # Temperature: Always from weather forecast
      fore_temp: >-
        {% if forecast_response is defined %}
          {% set entity_data = forecast_response[weather_ent] | default({}) %}
          {% set fc = entity_data['forecast'] | default([]) %}
          {{ fc[0].temperature | float(20) if fc | count > 0 else 20 }}
        {% else %}
          20
        {% endif %}
      is_warm_day: "{{ fore_temp | float >= temp_limit | float }}"
      hist_rain_val: "{{ states(rain_history) | float(0) }}"
      # Track rain source for notification
      rain_source: >-
        {% if rain_forecast_available %}
          sensor
        {% elif forecast_response is defined %}
          forecast
        {% else %}
          fallback
        {% endif %}

  # --- Pre-check ---
  - variables:
      any_zone_needs_water: >-
        {% set ns = namespace(needs_water=false) %}
        {% for zone in zones %}
          {% if zone.active %}
            {% set s_avail = zone.sensor not in ['', none, 'unknown']
               and states(zone.sensor) not in ['unavailable', 'unknown', 'none'] %}
            {% if s_avail %}
              {% set dry = states(zone.sensor) | float(0) < zone.limit | float %}
            {% else %}
              {% set dry = true %}
            {% endif %}
            {% set w_ok = (not zone.w_dep)
                          or (hist_rain_val | float < rain_limit | float
                              and fore_rain | float < rain_limit | float) %}
            {% if dry and w_ok %}
              {% set ns.needs_water = true %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.needs_water }}

  # --- Build watering report ---
  - variables:
      watering_report: >-
        {% set ns = namespace(watered=[], skipped=[], total_min=0) %}
        {% for zone in zones %}
          {% if zone.active %}
            {% set s_avail = zone.sensor not in ['', none, 'unknown']
               and states(zone.sensor) not in ['unavailable', 'unknown', 'none'] %}
            {% if s_avail %}
              {% set dry = states(zone.sensor) | float(0) < zone.limit | float %}
            {% else %}
              {% set dry = true %}
            {% endif %}
            {% set w_ok = (not zone.w_dep)
                          or (hist_rain_val | float < rain_limit | float
                              and fore_rain | float < rain_limit | float) %}
            {% if dry and w_ok %}
              {% set dur = zone.time_warm | int if is_warm_day else zone.time | int %}
              {% set ns.watered = ns.watered + ['Z' ~ loop.index ~ ' (' ~ dur ~ 'min)'] %}
              {% set ns.total_min = ns.total_min + dur %}
            {% else %}
              {% set ns.skipped = ns.skipped + ['Z' ~ loop.index] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ {
          'watered': ns.watered,
          'skipped': ns.skipped,
          'total_min': ns.total_min,
          'count': ns.watered | count
        } }}

  # --- Main loop ---
  - if:
      - condition: template
        value_template: "{{ any_zone_needs_water }}"
    then:
      - repeat:
          count: 6
          sequence:
            - variables:
                curr: "{{ zones[repeat.index - 1] }}"
            - if:
                - condition: template
                  value_template: "{{ curr.active }}"
              then:
                - variables:
                    sensor_available: >-
                      {{ curr.sensor not in ['', none, 'unknown']
                         and states(curr.sensor) not in
                            ['unavailable', 'unknown', 'none'] }}
                    moisture: >-
                      {{ states(curr.sensor) | float(0)
                         if sensor_available else -1 }}
                    must_water: >-
                      {% if sensor_available %}
                        {% set dry = moisture | float < curr.limit | float %}
                      {% else %}
                        {% set dry = true %}
                      {% endif %}
                      {% set w_ok = (not curr.w_dep)
                                    or (hist_rain_val | float < rain_limit | float
                                        and fore_rain | float < rain_limit | float) %}
                      {{ dry and w_ok }}
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ must_water }}"
                      sequence:
                        - action: homeassistant.turn_on
                          target:
                            entity_id: !input water_switch
                        - delay:
                            minutes: >-
                              {{ curr.time_warm | int
                                 if is_warm_day
                                 else curr.time | int }}
                        - action: homeassistant.turn_off
                          target:
                            entity_id: !input water_switch
                  default:
                    - action: homeassistant.turn_on
                      target:
                        entity_id: !input water_switch
                    - delay:
                        seconds: "{{ sync_pulse | int }}"
                    - action: homeassistant.turn_off
                      target:
                        entity_id: !input water_switch
                - delay:
                    seconds: "{{ pressure_pause | int }}"

  # --- Send push notifications with time window ---
  - if:
      - condition: template
        value_template: "{{ notify_enabled and notify_devices | count > 0 }}"
    then:
      - choose:
          # Too early: Wait until earliest time
          - conditions:
              - condition: template
                value_template: "{{ now() < today_at(notify_earliest) }}"
            sequence:
              - wait_template: "{{ now() >= today_at(notify_earliest) }}"
                timeout:
                  hours: 18
                continue_on_timeout: false
          # Too late: Don't send
          - conditions:
              - condition: template
                value_template: "{{ now() > today_at(notify_latest) }}"
            sequence:
              - stop: "Notification skipped – outside time window"

      # Build and send notification
      - variables:
          notify_title: >-
            {% if any_zone_needs_water %}
              🌱 Irrigation Complete
            {% else %}
              💤 No Irrigation Needed
            {% endif %}
          notify_message: >-
            {% if any_zone_needs_water %}
              {{ watering_report.count }} zone(s) watered ({{ watering_report.total_min }} min total)
              ✅ Watered: {{ watering_report.watered | join(', ') }}
              {% if watering_report.skipped | count > 0 %}⏭️ Skipped: {{ watering_report.skipped | join(', ') }}{% endif %}
              🌡️ {{ 'Warm day' if is_warm_day else 'Normal day' }} ({{ fore_temp }}°C)
              🌧️ Rain 24h: {{ hist_rain_val }}mm | Forecast: {{ fore_rain }}mm ({{ rain_source }})
            {% else %}
              All zones skipped.
              🌧️ Rain 24h: {{ hist_rain_val }}mm | Forecast: {{ fore_rain }}mm ({{ rain_source }})
              🌡️ Temperature: {{ fore_temp }}°C
            {% endif %}
      - repeat:
          for_each: "{{ notify_devices }}"
          sequence:
            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify(separator='_') }}"
              data:
                title: "{{ notify_title }}"
                message: "{{ notify_message }}"
              continue_on_error: true

mode: queued
max: 3
