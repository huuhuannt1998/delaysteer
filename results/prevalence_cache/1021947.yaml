    value_template: "{{ remote_entity != '' and remote_entity is not none }}"

action:
  - action: remote.send_command
    target:
      entity_id: "{{ remote_entity }}"
    data:
      command: "{{ ir_code }}"

mode: single
max_exceeded: silent
