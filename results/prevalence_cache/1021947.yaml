blueprint:
  name: Midea Portable AC - FollowMe via IR
  description: >
    (V1.1) Mirrors an external temperature sensor to a Midea AC's IR "FollowMe/C-Sense" feature by
    sending pre-captured raw IR codes through an IR remote. All codes
    are embedded directly in this blueprint - no learn_command storage
    dependency. Fires whenever the sensor's rounded integer value changes,
    and re-sends at least every update interval even if unchanged.
  domain: automation
  homeassistant:
    min_version: 2026.4.0
  input:
    target_temperature_sensor:
      name: Target Temperature Sensor (do not choose the AC itself)
      description: The temperature sensor to mirror as FollowMe input.
      selector:
        entity:
          domain: sensor
          device_class: temperature
    ir_emitter:
      name: IR Remote
      description: The IR emitter entity that will transmit the IR code.
      selector:
        entity:
          domain: infrared
          device_class: emitter
    update_interval:
      name: Update Interval
      description: Resend the current FollowMe code at least this often, even if temperature hasn't changed (default 2 minutes).
      default: "/2"
      selector:
        select:
          mode: dropdown
          options:
            - label: "Every 1 minute"
              value: "/1"
            - label: "Every 2 minutes"
              value: "/2"

trigger:
  - trigger: state
    entity_id: !input target_temperature_sensor
  - trigger: time_pattern
    minutes: !input update_interval

variables:
  target_sensor: !input target_temperature_sensor
  sensor_unit: "{{ state_attr(target_sensor, 'unit_of_measurement') }}"
  raw_state: "{{ states(target_sensor) | float(default=none) }}"
  raw_temp_c: >
    {% if raw_state is none %}
      {{ none }}
    {% elif sensor_unit in ['°F', 'F'] %}
      {{ ((raw_state - 32) * 5 / 9) }}
    {% else %}
      {{ raw_state }}
    {% endif %}
  rounded_temp: >
    {% if raw_temp_c is not none %}
      {{ [[ raw_temp_c | round(0, 'common') | int, 0] | max, 37] | min }}
    {% else %}
      none
    {% endif %}
  ir_emitter_entity: !input ir_emitter
  ir_device_id: "{{ device_id(ir_emitter_entity) }}"
  remote_entity: >
    {{ device_entities(ir_device_id) | select('match', '^remote\.') | list | first }}
