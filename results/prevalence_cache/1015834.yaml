blueprint:
  name: "ZHA - IKEA TRADFRI on/off switch (universal: lights & switches)"
  description: >
    Control any light or switch entity with an IKEA TRADFRI on/off remote (2-button) via ZHA.


    Single press: top button turns the target(s) on, bottom button turns them off.


    Hold: if every targeted entity is a light, holding the top button brightens and
    holding the bottom button dims, in 10% steps, matching the original poolcactus
    "ZHA - IKEA Tradfri on/off switch (incl dimmer)" blueprint. If any targeted
    entity is not a light (e.g. a switch/socket), holding has no extra effect
    beyond the initial on/off.
  domain: automation
  source_url: https://github.com/lubosbury/zha-tradfri-onof-universal/blob/main/blueprints/automation/lubosbury/zha-tradfri-onoff-universal.yaml
  input:
    remote:
      name: Remote
      description: The IKEA TRADFRI on/off switch (ZHA) that will control the target(s).
      selector:
        device:
          integration: zha
          manufacturer: IKEA of Sweden
          model: TRADFRI on/off switch
    target:
      name: Target entities
      description: >
        The light and/or switch entities to control. Hold-to-dim only activates
        when every selected entity is a light.
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true

mode: restart

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      command: "{{ trigger.event.data.command }}"
      cluster_id: "{{ trigger.event.data.cluster_id }}"
      endpoint_id: "{{ trigger.event.data.endpoint_id }}"
      target_entities: !input target
      all_lights: >-
        {{ (target_entities | map('regex_search', '^light\\.') | select | list | length)
           == (target_entities | list | length) }}
  - choose:
      - conditions:
          - "{{ command == 'on' }}"
          - "{{ cluster_id == 6 }}"
          - "{{ endpoint_id == 1 }}"
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: !input target
      - conditions:
          - "{{ command == 'off' }}"
          - "{{ cluster_id == 6 }}"
          - "{{ endpoint_id == 1 }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: !input target
      - conditions:
          - "{{ command == 'move_with_on_off' }}"
          - "{{ cluster_id == 8 }}"
          - "{{ endpoint_id == 1 }}"
          - "{{ all_lights }}"
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ repeat.index < 10 }}"
              sequence:
                - service: light.turn_on
                  target:
                    entity_id: !input target
                  data:
                    transition: 1
                    brightness_step_pct: 10
                - delay: 1
      - conditions:
          - "{{ command == 'move' }}"
          - "{{ cluster_id == 8 }}"
          - "{{ endpoint_id == 1 }}"
          - "{{ all_lights }}"
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ repeat.index < 10 }}"
              sequence:
                - service: light.turn_on
                  target:
                    entity_id: !input target
                  data:
                    transition: 1
                    brightness_step_pct: -10
                - delay: 1
