blueprint:
  name: Daily automatic light color adjustment
  description: >
    Holds a desired colour and brightness on a set of lights, reasserting it on a
    schedule. Reconciles only the lights that are actually out of place, so in the
    steady state it sends nothing.

    It never switches lights on or off by itself: it adjusts lights that are
    already on. Switching stays with whatever handles it in your setup.

    v2.0.0 — see CHANGELOG.md. If your lights are behind a relay, turn on the
    relay setting under Reconciliation: the default changed in this version.
  domain: automation
  author: driin0
  homeassistant:
    # Sections in the configuration UI were introduced in 2024.6.
    min_version: 2024.6.0
  input:
    entity_lights:
      name: Lights to adjust
      description: Lights or light groups to keep in sync. Groups are expanded to their members.
      selector:
        entity:
          domain: light
          multiple: true

    boolean_entity:
      name: Optional boolean entity
      description: Select the boolean entity that will activate the automation (optional)
      selector:
        entity:
          domain: input_boolean
      default: ""

    # ---------------------------------------------------------------- behaviour

    colour:
      name: Colour
      icon: mdi:palette
      input:
        colour_mode:
          name: Colour mode
          description: >
            "Per weekday" uses the colours configured below — the classic behaviour.

            "Rainbow" ignores them and puts the seven rainbow colours on the seven
            days — red on Monday, unless you move it with the offset below.

            "Rotate configured colours" cycles through the distinct colours you
            configured, never repeating the previous day's.

            "Rotate full spectrum" needs no configuration at all: it cycles through
            twelve vivid hues spread around the colour wheel.

            The two rotating modes are deterministic, not random: this automation
            re-evaluates every minute, so an actual draw would repaint the lights
            continuously. The colour depends only on the date — identical all day,
            and different from yesterday's by construction.
          default: Per weekday
          selector:
            select:
              options:
                - Per weekday
                - Rainbow
                - Rotate configured colours
                - Rotate full spectrum

        rotation_offset:
          name: Colour offset
          description: >
            Shifts the colours along. Zero means no shift.

            In "Rainbow" it chooses which colour lands on which day — by default
            Monday is red, and an offset moves that along. In the rotating modes
            it sets where this automation starts in the sequence, so several
            zones can run together without ever showing the same colour as one
            another: with the twelve-colour spectrum, values such as 0, 3, 6 and
            9 keep four zones far apart on the colour wheel.

            The value wraps around however many colours the chosen mode has, so
            nothing can break — but it also means anything above that limit
            repeats. Rainbow has seven colours, so 0-6 covers every possibility
            and 7 is the same as 0. The full spectrum has twelve, so all values
            are distinct there.
          default: 0
          selector:
            number:
              min: 0
              max: 11
              mode: slider

    weekday_colours:
      name: Colours per weekday
      icon: mdi:calendar-week
      collapsed: true
      description: >
        Used by "Per weekday", and used as the palette by "Rotate configured
        colours" (duplicates count once). IGNORED by "Rainbow" and "Rotate full
        spectrum", which bring their own colours — in those modes the pickers
        below have no effect and do not reflect what the lights are doing.

        Brightness always follows the weekday, in every mode.
      input:
        enable_monday:
          name: Enable Monday
          description: Enable or disable adjustment for Monday
          default: true
          selector:
            boolean: {}
        monday_rgb_color:
          name: Monday RGB Color
          description: Select the RGB color for Monday
          default: [0, 70, 120]
          selector:
            color_rgb: {}
        monday_colour_name:
          name: Monday colour by name
          description: >
            Optional. Pick a colour name instead of using the picker above — the
            name wins when set. Leave blank to use the picker.
          default: ""
          selector:
            select:
              custom_value: true
              options:
                - ""
                - red
                - orange
                - amber
                - gold
                - yellow
                - lime
                - green
                - teal
                - turquoise
                - cyan
                - skyblue
                - blue
                - indigo
                - violet
                - purple
                - magenta
                - pink
                - coral
                - white
                - warmwhite
        monday_brightness_pct:
          name: Monday Brightness (percent)
          description: Select the brightness for Monday in percent
          default: 100
          selector:
            number: { min: 0, max: 100, unit_of_measurement: "%" }

        # ----------------------------------------------------------------- tuesday
        enable_tuesday:
          name: Enable Tuesday
          description: Enable or disable adjustment for Tuesday
          default: true
          selector:
            boolean: {}
        tuesday_rgb_color:
          name: Tuesday RGB Color
          description: Select the RGB color for Tuesday
          default: [0, 70, 120]
          selector:
            color_rgb: {}
        tuesday_colour_name:
          name: Tuesday colour by name
          description: >
            Optional. Pick a colour name instead of using the picker above — the
            name wins when set. Leave blank to use the picker.
          default: ""
          selector:
            select:
              custom_value: true
              options:
                - ""
                - red
                - orange
                - amber
                - gold
                - yellow
                - lime
                - green
                - teal
                - turquoise
                - cyan
                - skyblue
                - blue
                - indigo
                - violet
                - purple
                - magenta
                - pink
                - coral
                - white
                - warmwhite
        tuesday_brightness_pct:
          name: Tuesday Brightness (percent)
          description: Select the brightness for Tuesday in percent
          default: 100
          selector:
            number: { min: 0, max: 100, unit_of_measurement: "%" }

        # --------------------------------------------------------------- wednesday
        enable_wednesday:
          name: Enable Wednesday
          description: Enable or disable adjustment for Wednesday
          default: true
          selector:
            boolean: {}
        wednesday_rgb_color:
          name: Wednesday RGB Color
          description: Select the RGB color for Wednesday
          default: [0, 70, 120]
          selector:
            color_rgb: {}
        wednesday_colour_name:
          name: Wednesday colour by name
          description: >
            Optional. Pick a colour name instead of using the picker above — the
