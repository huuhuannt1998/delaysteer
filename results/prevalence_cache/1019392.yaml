blueprint:
  name: WLED Holiday, Weather & Event Scheduler v6.0.1
  description: >
    Action-first redesign of the WLED scheduler. The scheduler decides WHEN and WHICH event is active;
    native Home Assistant action builders decide WHAT every WLED, smart light, scene, switch, script,
    relay, or other device does. No primary WLED is required. Every user-facing setting includes a
    short plain-English explanation. Start with Core schedule, create/select the required Text helper,
    then configure Startup, Event, and Shutdown actions. Testing is isolated under Testing & diagnostics.
  domain: automation
  homeassistant:
    min_version: 2025.10.0

  input:
    help:
      name: Setup guide & help
      icon: mdi:book-open-page-variant
      collapsed: true
      description: >
        QUICK START — 1) Create one Text helper under Settings > Devices & services > Helpers and
        select it in Core schedule. 2) Set your timing. 3) Put shared smart-plug/relay startup steps
        under Startup / power-on actions. 4) For each holiday/weather/custom event, use + Add action
        to turn on each WLED and then Select option on that WLED's Preset or Playlist entity.
        5) Put shared turn-off/power-down steps under Shutdown / power-off actions. 6) To test, choose
        a mode under Testing & diagnostics, Save, then click Run actions once. Return Test mode to
        Automatic when finished.
      input:
        help_read_only_note:
          name: Setup guide note
          description: >
            This switch does nothing and is intentionally optional. It only gives Home Assistant a
            real input so this collapsed help section can render. Leave it off.
          default: false
          selector:
            boolean:

    core:
      name: Core schedule
      icon: mdi:clock-outline
      collapsed: true
      description: >
        Timing only. This section decides when the scheduler is allowed to be active. Device control
        belongs in Startup, Event, and Shutdown actions below. Negative sun offsets mean BEFORE
        sunrise/sunset; positive offsets mean AFTER.
      input:
        scheduler_state_helper:
          name: Scheduler memory helper
          description: >
            Required. Create one Text helper in Home Assistant and select it here. v6 stores the
            currently active event key in this helper so arbitrary actions run only when the active
            event actually changes instead of every minute.
          default: ''
          selector:
            entity:
              domain: input_text
        schedule_mode:
          name: Schedule mode
          description: >
            Choose whether lighting uses sunrise/sunset windows or one fixed daily start/end window.
          default: sun
          selector:
            select:
              options:
                - label: Sun-based evening and morning windows
                  value: sun
                - label: Fixed daily start and end times
                  value: fixed
        start_time:
          name: Fixed mode — daily start time
          description: >
            Used only in Fixed mode. This is the time the daily lighting window begins.
          default: '17:00:00'
          selector:
            time:
        end_time:
          name: Fixed mode — daily end time
          description: >
            Used only in Fixed mode. This is the time the daily lighting window ends; it may be after
            midnight.
          default: '01:00:00'
          selector:
            time:
        evening_on_offset:
          name: Evening ON — before/after sunset (minutes)
          description: >
            When evening lighting begins relative to sunset. Negative means before sunset; positive means
            after. Example: -15 means 15 minutes before sunset.
          default: -15
          selector:
            number:
              min: -360
              max: 360
              step: 5
              unit_of_measurement: min
        evening_off_offset:
          name: Evening OFF — before/after sunset (minutes)
          description: >
            When the evening window ends relative to sunset. Positive values are after sunset. Example: 300
            means 5 hours after sunset.
          default: 300
          selector:
            number:
              min: -360
              max: 360
              step: 5
              unit_of_measurement: min
        morning_on_offset:
          name: Morning ON — before/after sunrise (minutes)
          description: >
            When morning lighting begins relative to sunrise. Negative means before sunrise; positive means
            after. Example: -90 means 90 minutes before sunrise.
          default: -90
          selector:
            number:
              min: -360
              max: 360
              step: 5
              unit_of_measurement: min
        morning_off_offset:
          name: Morning OFF — before/after sunrise (minutes)
          description: >
            When the morning window ends relative to sunrise. Example: 15 means 15 minutes after sunrise.
          default: 15
          selector:
            number:
              min: -360
              max: 360
              step: 5
              unit_of_measurement: min

    lifecycle:
      name: Power, startup & shutdown
      icon: mdi:power-plug
      collapsed: true
      description: >
        Shared lifecycle actions. Startup runs once when the scheduler changes from OFF to active.
        Shutdown runs once when it changes from active to OFF. Put every smart plug, relay, delay,
        or shared power step here; no one-to-one WLED/power-supply pairing is required.
      input:
        startup_actions:
          name: Startup / power-on actions
          description: >
            Runs once when the scheduler transitions from OFF to an active event. Add all required smart
            plugs, relays, delays, or scripts here.
          default: []
          selector:
            action:
        shutdown_actions:
          name: Shutdown / power-off actions
          description: >
            Runs once when the scheduler transitions from an active event to OFF. Add WLED turn-off
            actions, delays, then smart plug or relay shutdown actions in the order you want.
          default: []
          selector:
            action:
    conditions:
      name: Optional extra conditions
      icon: mdi:filter-check-outline
      collapsed: true
      description: >
        Optional safety or lifestyle rules added on top of the scheduler, such as someone being home,
        Vacation Mode being off, or a helper being enabled. Most users can leave this section closed.
      input:
        additional_conditions:
          name: Additional conditions
          description: >
            Optional. Most users should leave this empty. Add a condition only if another rule must
            also be true before automatic scheduling may change anything, such as someone being home
            or Vacation Mode being off. Tests bypass these conditions.
          default: []
          selector:
            condition:

    weather:
      name: Weather rules
      icon: mdi:weather-partly-rainy
      collapsed: true
      description: >
        Optional rain, snow, heat, and freeze event rules. Weather can compete with holidays inside the
        normal schedule or optionally wake lighting during allowed weather override hours.
      input:
        weather_enabled:
          name: Enable weather rules
          description: >
            Turns weather-based event selection on or off. If off, rain, snow, heat, and freeze actions are
            ignored.
          default: true
          selector:
            boolean:
        weather_entity:
          name: Weather entity
          description: >
            Select the Home Assistant weather entity whose hourly forecast should drive weather events.
          default: ''
          selector:
            entity:
              domain: weather
        weather_priority:
          name: Priority when weather and a holiday both match
          description: >
            When both a holiday/custom event and weather match, choose which one wins.
          default: weather
          selector:
            select:
              options:
                - label: Weather wins
                  value: weather
                - label: Holiday / custom event wins
                  value: calendar
        forecast_hours:
          name: Rain/snow look-ahead
          description: >
            How many upcoming hourly forecast entries to inspect for rain or snow.
          default: 6
          selector:
            number:
              min: 1
              max: 24
              step: 1
              unit_of_measurement: hours
        weather_outside_schedule_enabled:
          name: Allow weather to activate outside the normal schedule
          description: >
            When enabled, matching weather may activate lighting even when the normal schedule is off, but
            only during the allowed override hours.
          default: false
          selector:
            boolean:
        weather_override_start_time:
          name: Weather activation — earliest start
          description: >
            Earliest time weather is allowed to wake the lighting outside the normal schedule.
          default: '08:00:00'
          selector:
            time:
        weather_override_end_time:
          name: Weather activation — latest end
          description: >
            Latest time weather is allowed to keep lighting active outside the normal schedule.
          default: '22:00:00'
          selector:
            time:
        rain_actions:
          name: Rain actions
          description: >
            Use + Add action to define exactly what should happen for this event. Add as many WLED
            controllers, regular lights, scenes, switches, scripts, or other Home Assistant actions as
            you need. For WLED, a common sequence is Turn on light, then Select option on that WLED's
            Preset or Playlist entity. Each WLED may use a different preset, playlist, or native effect.
            Leaving this empty disables this event.
          default: []
          selector:
            action:
        snow_actions:
          name: Snow actions
          description: >
            Use + Add action to define exactly what should happen for this event. Add as many WLED
            controllers, regular lights, scenes, switches, scripts, or other Home Assistant actions as
            you need. For WLED, a common sequence is Turn on light, then Select option on that WLED's
            Preset or Playlist entity. Each WLED may use a different preset, playlist, or native effect.
            Leaving this empty disables this event.
          default: []
          selector:
            action:
        heat_threshold:
          name: Hot temperature threshold
          description: >
            If any checked forecast temperature reaches or exceeds this value, the Heat event may become
            active.
          default: 80
          selector:
            number:
              min: -40
              max: 130
              step: 1
              unit_of_measurement: °
        heat_actions:
          name: Heat actions
          description: >
            Use + Add action to define exactly what should happen for this event. Add as many WLED
            controllers, regular lights, scenes, switches, scripts, or other Home Assistant actions as
