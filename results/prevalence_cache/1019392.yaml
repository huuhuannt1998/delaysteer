            Preset or Playlist entity. Each WLED may use a different preset, playlist, or native effect.
            Leaving this empty disables this event.
          default: []
          selector:
            action:
        freeze_threshold:
          name: Cold temperature threshold
          description: >
            If any checked forecast temperature reaches or falls below this value, the Freeze event may
            become active.
          default: 32
          selector:
            number:
              min: -40
              max: 80
              step: 1
              unit_of_measurement: °
        freeze_actions:
          name: Freeze actions
          description: >
            Use + Add action to define exactly what should happen for this event. Add as many WLED
