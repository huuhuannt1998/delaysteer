                            value_template: "{{ test_event == 'custom_10' }}"
                        sequence: !input custom_10_actions
                    default: []
              - conditions:
                  - condition: template
                    value_template: "{{ test_mode == 'shutdown_only' }}"
                sequence:
                  - sequence: !input shutdown_actions
          - stop: "Test completed. Return Test mode to Automatic."

  # Automatic executions do nothing while a test mode is armed.
  - condition: template
    value_template: "{{ test_mode == 'auto' }}"

  # A state helper is required for deduplication.
  - condition: template
    value_template: "{{ scheduler_state_helper | trim != '' }}"

  # Optional user conditions apply only to automatic scheduling.
  - condition: and
    conditions: !input additional_conditions

  # Fetch hourly forecasts only when weather is configured.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ weather_enabled and weather_entity | trim != '' }}"
        sequence:
          - action: weather.get_forecasts
            target:
              entity_id: !input weather_entity
            data:
              type: hourly
            response_variable: weather_response
    default:
      - variables:
          weather_response: {}

  - variables:
      active_window: >-
        {% set n = now() %}
        {% if schedule_mode == 'fixed' %}
          {% set s = today_at(start_time) %}
          {% set e = today_at(end_time) %}
          {% if e <= s %}{% set e = e + timedelta(days=1) %}{% endif %}
          {% if n < s and e.date() > s.date() %}
            {% set s = s - timedelta(days=1) %}
            {% set e = e - timedelta(days=1) %}
          {% endif %}
          {{ 'fixed' if s <= n < e else 'off' }}
        {% else %}
          {% set next_set = as_local(as_datetime(state_attr('sun.sun','next_setting'))) %}
          {% set next_rise = as_local(as_datetime(state_attr('sun.sun','next_rising'))) %}
          {% set ns = namespace(result='off') %}
          {% for base in [next_set - timedelta(days=1), next_set] %}
            {% set s = base + timedelta(minutes=evening_on_offset|int) %}
            {% set e = base + timedelta(minutes=evening_off_offset|int) %}
            {% if e <= s %}{% set e = e + timedelta(days=1) %}{% endif %}
            {% if s <= n < e %}{% set ns.result = 'evening' %}{% endif %}
          {% endfor %}
          {% for base in [next_rise - timedelta(days=1), next_rise] %}
            {% set s = base + timedelta(minutes=morning_on_offset|int) %}
            {% set e = base + timedelta(minutes=morning_off_offset|int) %}
            {% if e <= s %}{% set e = e + timedelta(days=1) %}{% endif %}
            {% if s <= n < e %}{% set ns.result = 'morning' %}{% endif %}
          {% endfor %}
          {{ ns.result }}
        {% endif %}
      in_daily_window: "{{ active_window != 'off' }}"
      weather_event_key: >-
        {% if not weather_enabled or weather_entity | trim == '' %}{{ '' }}
        {% else %}
          {% set forecasts = weather_response.get(weather_entity, {}).get('forecast', []) %}
          {% set upcoming = forecasts[:forecast_hours|int] %}
          {% set conditions = upcoming | map(attribute='condition') | list %}
          {% set temps = upcoming | selectattr('temperature','defined') | map(attribute='temperature') | list %}
          {% set rain_conditions = ['rainy','pouring','lightning-rainy'] %}
          {% set snow_conditions = ['snowy','snowy-rainy'] %}
          {% if conditions | select('in', snow_conditions) | list | count > 0 and snow_actions | count > 0 %}weather_snow
          {% elif conditions | select('in', rain_conditions) | list | count > 0 and rain_actions | count > 0 %}weather_rain
          {% elif temps | count > 0 and temps | max >= heat_threshold|float and heat_actions | count > 0 %}weather_heat
          {% elif temps | count > 0 and temps | min <= freeze_threshold|float and freeze_actions | count > 0 %}weather_freeze
          {% else %}{{ '' }}{% endif %}
        {% endif %}
      weather_override_time_allowed: >-
        {% set n = now() %}
        {% set s = today_at(weather_override_start_time) %}
        {% set e = today_at(weather_override_end_time) %}
        {% if e <= s %}{{ n >= s or n < e }}
        {% else %}{{ s <= n < e }}{% endif %}
