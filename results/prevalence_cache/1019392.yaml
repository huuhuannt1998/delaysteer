                            value_template: "{{ test_event == 'custom_5' }}"
                        sequence: !input custom_5_actions
                      - conditions:
                          - condition: template
                            value_template: "{{ test_event == 'custom_6' }}"
                        sequence: !input custom_6_actions
                      - conditions:
                          - condition: template
                            value_template: "{{ test_event == 'custom_7' }}"
                        sequence: !input custom_7_actions
                      - conditions:
                          - condition: template
                            value_template: "{{ test_event == 'custom_8' }}"
                        sequence: !input custom_8_actions
