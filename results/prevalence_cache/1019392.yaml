    testing:
      name: Testing & diagnostics
      icon: mdi:test-tube
      collapsed: true
      description: >
        Tests are isolated from the live schedule. Save the selected test mode, then click Run actions
        once. Automatic minute/startup runs stop while a test is armed.
      input:
        test_mode:
          name: Test mode
          description: >
            Choose what to test. Save the automation, then click Run actions once. Automatic scheduler runs
            pause while any test mode is armed.
          default: auto
          selector:
            select:
              options:
                - label: Automatic
                  value: auto
                - label: Test startup actions only
