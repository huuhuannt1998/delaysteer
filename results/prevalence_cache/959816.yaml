    zone4:
      name: Zone 4 - What This Zone Controls
      icon: mdi:numeric-4-circle
      collapsed: true
      input:
        zone_4_name:
          name: Zone 4 Name - Used Only In Notifications
          default: ''
          selector:
            text:
              multiple: false
              multiline: false
        zone_4_targets:
          name: Zone 4 - What Devices Does This Zone Control?
          default: []
          selector:
            target:
              entity:
              - domain:
