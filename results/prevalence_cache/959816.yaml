              multiple: false
              multiline: false
        zone_2_targets:
          name: Zone 2 - What Devices Does This Zone Control?
          default: []
          selector:
            target:
              entity:
              - domain:
                - light
              - domain:
                - switch
              - domain:
                - scene
    zone3:
      name: Zone 3 - What This Zone Controls
      icon: mdi:numeric-3-circle
      collapsed: true
      input:
        zone_3_name:
          name: Zone 3 Name - Used Only In Notifications
          default: ''
          selector:
            text:
              multiple: false
              multiline: false
        zone_3_targets:
          name: Zone 3 - What Devices Does This Zone Control?
          default: []
          selector:
            target:
